org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.nonFinalResIds=true
org.gradle.configuration-cache=false
org.gradle.caching=true

# D8/R8 merges and minifies bundled Python/ML runtimes. Keep one worker so the
# runner has enough memory headroom while giving the Gradle/R8 process 3 GiB.
org.gradle.workers.max=1
