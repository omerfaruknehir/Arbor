name: Snapshot 0.20.20 apply status

on:
  push:
    branches:
      - agent/stateful-status-02020

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh api 'repos/${{ github.repository }}/actions/runs?branch=agent%2Fstateful-icon-restart-0.20.20&per_page=10' > .github/stateful-02020-runs.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/stateful-02020-runs.json
          git commit -m 'Record 0.20.20 apply status [skip ci]'
          git push
