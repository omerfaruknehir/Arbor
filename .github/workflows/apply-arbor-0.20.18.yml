name: Apply Arbor 0.20.18 fixes

on:
  push:
    branches: [agent/fix-icon-message-rendering-0.20.18]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated transformations
        run: |
          python ci/apply_02018_icons.py
          python ci/apply_02018_messages.py
          python ci/apply_02018_meta.py

      - name: Commit clean source tree
        run: |
          rm -f \
            ci/apply_02018_icons.py \
            ci/apply_02018_messages.py \
            ci/apply_02018_meta.py \
            .github/workflows/apply-arbor-0.20.18.yml \
            .github/workflows/source-export.yml \
            .github/source-artifact-id.txt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix launcher icon fidelity and user message rendering"
          git push
