name: Snapshot Arbor 0.20.19 release

on:
  push:
    branches:
      - agent/release-snapshot-0.20.19

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8ba59cf2b6f397c54830888affa71108bb4b4722
        run: |
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"
          run_id="$(jq -r '.workflow_runs[] | select(.name == "Release Android") | .id' <<<"$runs" | head -n 1)"
          test -n "$run_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > .github/release-0.20.19-snapshot-run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > .github/release-0.20.19-snapshot-jobs.json
      - name: Save snapshot
        shell: bash
        run: |
          rm .github/workflows/snapshot-release-02019.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record Arbor 0.20.19 release snapshot [skip ci]"
          git push
