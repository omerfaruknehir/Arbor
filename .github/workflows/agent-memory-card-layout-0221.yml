name: Build Arbor 0.22.1 memory card layout fix

on:
  push:
    branches:
      - fix/memory-card-layout-0.22.1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/memory-card-layout-0.22.1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply memory card layout fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt')
          source = settings.read_text()
          old = r'''      ListItem(
          headlineContent = { Text(memory.content) },
          supportingContent = {
              Text("${memory.category} · ${if (memory.enabled) "Enabled" else "Disabled"}")
          },
          trailingContent = {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  IconButton(onClick = {
                      editingId = memory.id
                      editText = memory.content
                      editCategory = memory.category
                  }) {
                      Icon(Icons.Outlined.Edit, "Edit memory")
                  }
                  Switch(
                      checked = memory.enabled,
                      onCheckedChange = { viewModel.setMemoryEnabled(memory.id, it) },
                  )
                  IconButton(onClick = { viewModel.deleteMemory(memory.id) }) {
                      Icon(Icons.Outlined.DeleteOutline, "Delete memory")
                  }
              }
          },
          colors = androidx.compose.material3.ListItemDefaults.colors(containerColor = Color.Transparent),
      )'''
          new = r'''      Column(
          modifier = Modifier
              .fillMaxWidth()
              .padding(horizontal = 16.dp, vertical = 14.dp),
          verticalArrangement = Arrangement.spacedBy(10.dp),
      ) {
          Text(
              text = memory.content,
              style = MaterialTheme.typography.bodyLarge,
          )
          Row(
              modifier = Modifier.fillMaxWidth(),
              verticalAlignment = Alignment.CenterVertically,
          ) {
              Column(Modifier.weight(1f)) {
                  Text(
                      text = memory.category,
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      maxLines = 1,
                  )
                  Text(
                      text = if (memory.enabled) "Enabled" else "Disabled",
                      style = MaterialTheme.typography.labelSmall,
                      color = if (memory.enabled) {
                          MaterialTheme.colorScheme.primary
                      } else {
                          MaterialTheme.colorScheme.onSurfaceVariant
                      },
                  )
              }
              IconButton(onClick = {
                  editingId = memory.id
                  editText = memory.content
                  editCategory = memory.category
              }) {
                  Icon(Icons.Outlined.Edit, "Edit memory")
              }
              Switch(
                  checked = memory.enabled,
                  onCheckedChange = { viewModel.setMemoryEnabled(memory.id, it) },
              )
              IconButton(onClick = { viewModel.deleteMemory(memory.id) }) {
                  Icon(Icons.Outlined.DeleteOutline, "Delete memory")
              }
          }
      }'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one memory ListItem block, found {source.count(old)}')
          settings.write_text(source.replace(old, new))

          build = Path('app/build.gradle.kts')
          build_source = build.read_text()
          old_version = '        versionCode = 164\n        versionName = "0.22.0"'
          new_version = '        versionCode = 165\n        versionName = "0.22.1"'
          if build_source.count(old_version) != 1:
              raise SystemExit('Could not find the 0.22.0 version block')
          build.write_text(build_source.replace(old_version, new_version))

          notes = Path('docs/releases/RELEASE_NOTES_0.22.1.md')
          notes.write_text('''# Arbor 0.22.1\n\nThis hotfix repairs the Saved memories card layout on phones.\n\n## Memory UI\n\n- Gives memory text the full card width instead of placing it beside edit, enable, and delete controls.\n- Moves metadata and controls into a separate secondary row below the memory text.\n- Preserves editing, enable/disable, deletion, search, and bulk-management behavior.\n\n## Included\n\n- Includes the adaptive Home-widget and managed-memory changes from Arbor 0.22.0.\n''')
          PY

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified hotfix
        shell: bash
        run: |
          git rm .github/workflows/agent-memory-card-layout-0221.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt app/build.gradle.kts docs/releases/RELEASE_NOTES_0.22.1.md
          git commit -m 'Fix memory card text layout for 0.22.1'
          git push origin HEAD:fix/memory-card-layout-0.22.1
