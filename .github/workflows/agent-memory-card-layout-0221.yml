name: Build Arbor 0.22.1 memory card layout fix

on:
  push:
    branches:
      - fix/memory-card-layout-0.22.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/memory-card-layout-0.22.1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply memory card layout fix
        run: python3 tools/apply-memory-card-0221.py

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified hotfix
        shell: bash
        run: |
          git rm .github/workflows/agent-memory-card-layout-0221.yml tools/apply-memory-card-0221.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt app/build.gradle.kts docs/releases/RELEASE_NOTES_0.22.1.md
          git commit -m 'Fix memory card text layout for 0.22.1'
          git push origin HEAD:fix/memory-card-layout-0.22.1
