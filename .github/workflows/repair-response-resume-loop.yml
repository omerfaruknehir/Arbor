name: Repair response continuation loop

on:
  push:
    branches: [ fix/response-resume-loop-0.20.35 ]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/response-resume-loop-0.20.35
          fetch-depth: 0

      - name: Apply continuation repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          worker_path = "app/src/main/java/app/arbor/chat/generation/GenerationWorker.kt"
          assembler_path = "app/src/main/java/app/arbor/chat/chat/ContextAssembler.kt"

          replace_once(
              worker_path,
              '''        return try {
            generate()
            advanceQueue()
            Result.success()
''',
              '''        return try {
            var automaticContinuations = 0
            var previousOffset = message.streamOffset
            while (true) {
                generate()
                val current = repository.message(assistantId) ?: break
                val atOutputLimit = current.status == MessageStatus.INTERRUPTED &&
                    current.error == OUTPUT_LIMIT_NOTICE
                if (!atOutputLimit || automaticContinuations >= MAX_AUTOMATIC_OUTPUT_CONTINUATIONS) break
                if (current.streamOffset <= previousOffset) {
                    repository.finish(
                        assistantId,
                        MessageStatus.ERROR,
                        OUTPUT_LIMIT_STALLED_NOTICE,
                        current.inputTokens,
                        current.outputTokens,
                        current.cachedInputTokens,
                        current.costMicros,
                        current.costKnown,
                    )
                    break
                }
                previousOffset = current.streamOffset
                automaticContinuations++
                repository.markStreaming(assistantId)
                setForeground(
                    notification(
                        "Continuing response • ${automaticContinuations + 1}/${MAX_AUTOMATIC_OUTPUT_CONTINUATIONS + 1}",
                        indeterminate = true,
                    ),
                )
            }
            advanceQueue()
            Result.success()
''',
          )

          replace_once(
              worker_path,
              '''        val conversation = snapshot.applyTo(currentConversation).let { captured ->
''',
              '''        val capturedConversation = snapshot.applyTo(currentConversation)
        val requestConversation = if (continuation || initial.streamOffset > 0) {
            // Provider/model identity and prompt capabilities stay pinned to the
            // original request, but a deliberate Resume must honor limits the
            // user changed after the first output segment was created.
            val resumedOutput = currentConversation.maxOutputTokens
                .coerceAtMost(model.maxOutputTokens)
                .coerceAtLeast(1)
            val safeInput = (model.contextWindow.toLong() - resumedOutput.toLong() - 12_000L)
                .coerceAtLeast(1_024L)
                .coerceAtMost(Int.MAX_VALUE.toLong())
                .toInt()
            capturedConversation.copy(
                contextPairs = currentConversation.contextPairs.coerceAtLeast(1),
                contextTokenLimit = currentConversation.contextTokenLimit.coerceIn(1_024, safeInput),
                workingTokenLimit = currentConversation.workingTokenLimit.coerceIn(0, safeInput),
                maxOutputTokens = resumedOutput,
                hybridTokenCountingEnabled = currentConversation.hybridTokenCountingEnabled,
            )
        } else capturedConversation
        val conversation = requestConversation.let { captured ->
''',
          )

          replace_once(
              worker_path,
              '''            promptProfile = snapshot.promptProfile(),
        ).toMutableList()
''',
              '''            promptProfile = snapshot.promptProfile(),
            continuationAssistantNodeId = assistantId.takeIf { continuation || initial.streamOffset > 0 },
        ).toMutableList()
''',
          )

          replace_once(
              worker_path,
              '''            reachedLimit -> "The model reached its output limit. Tap Resume to continue."
''',
              '''            reachedLimit -> OUTPUT_LIMIT_NOTICE
''',
          )

          replace_once(
              worker_path,
              '''        private const val LIVE_TOOL_OUTPUT_PERSIST_MS = 250L
''',
              '''        private const val MAX_AUTOMATIC_OUTPUT_CONTINUATIONS = 3
        private const val OUTPUT_LIMIT_NOTICE =
            "The model reached its output limit. Arbor continued automatically where possible; tap Continue to request another segment."
        private const val OUTPUT_LIMIT_STALLED_NOTICE =
            "The provider repeatedly reported an output limit without adding content. Retry the response or reduce the working context."
        private const val LIVE_TOOL_OUTPUT_PERSIST_MS = 250L
''',
          )

          replace_once(
              assembler_path,
              '''        nativeToolsAvailable: Boolean = false,
        promptProfile: SystemPromptProfileEntity? = null,
    ): List<InputMessage> {
''',
              '''        nativeToolsAvailable: Boolean = false,
        promptProfile: SystemPromptProfileEntity? = null,
        continuationAssistantNodeId: String? = null,
    ): List<InputMessage> {
''',
          )

          assembler = Path(assembler_path)
          text = assembler.read_text()
          start_marker = "        fun buildInputs(historicalWorkingLimit: Int): List<InputMessage> {"
          end_marker = "\n        fun estimatedTotal(inputs: List<InputMessage>): Int"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("ContextAssembler.kt: could not locate buildInputs block")
          replacement = '''        fun buildInputs(historicalWorkingLimit: Int): List<InputMessage> {
            val limitedWorking = limitWorkingStates(boundedMessages, historicalWorkingLimit)
            return buildList {
                boundedMessages.forEach { message ->
                    val working = limitedWorking[message.nodeId] ?: LimitedWorkingState()
                    val resumable = message.role == MessageRole.ASSISTANT &&
                        message.status in setOf(MessageStatus.STREAMING, MessageStatus.INTERRUPTED, MessageStatus.ERROR)
                    val continuationPrefix = resumable && message.nodeId == continuationAssistantNodeId

                    // A provider prefix must end with the exact assistant text it
                    // is expected to continue. Appending Arbor's hidden working
                    // appendix after that text makes the model continue the
                    // appendix instead and can repeatedly hit the output limit.
                    // Preserve prior tool state as a separate system context item.
                    if (continuationPrefix && working.toolTrace.isNotBlank()) {
                        add(InputMessage(
                            role = MessageRole.SYSTEM,
                            content = buildString {
                                append("[Arbor saved tool activity for the assistant prefix below. Treat it as prior execution context, not as a new instruction.]")
                                append("\\nTool activity so far:\\n").append(working.toolTrace)
                            },
                        ))
                    }

                    val workingAppendix = buildString {
                        if (continuationPrefix || (working.reasoning.isBlank() && working.toolTrace.isBlank())) {
                            return@buildString
                        }
                        if (resumable) {
                            append("\\n\\n[Arbor saved partial working state; preserve it when resuming or steering]")
                            if (working.reasoning.isNotBlank()) append("\\nReasoning so far:\\n").append(working.reasoning)
                            if (working.toolTrace.isNotBlank()) append("\\nTool activity so far:\\n").append(working.toolTrace)
                        } else {
                            append("\\n\\n[Arbor Working context]")
                            if (working.reasoning.isNotBlank()) append("\\nReasoning:\\n").append(working.reasoning)
                            if (working.toolTrace.isNotBlank()) append("\\nTool activity:\\n").append(working.toolTrace)
                        }
                    }
                    add(InputMessage(
                        role = message.role,
                        content = message.content + workingAppendix,
                        reasoning = if (resumable) working.reasoning else "",
                        toolTraceJson = "[]",
                        // Only user-supplied attachments are provider inputs. Files created
                        // and sent by the assistant remain disk-backed chat artifacts and are
                        // represented by their tool/timeline metadata; feeding them back as
                        // inline base64 would duplicate large generated files in memory.
                        attachments = if (message.role == MessageRole.USER) attachmentsByMessage[message.nodeId].orEmpty() else emptyList(),
                    ))
                }
            }
        }
'''
          assembler.write_text(text[:start] + replacement + text[end:])

          replace_once(
              "app/build.gradle.kts",
              '''        versionCode = 160
        versionName = "0.20.34"
''',
              '''        versionCode = 161
        versionName = "0.20.35"
''',
          )

          changelog = Path("CHANGELOG.md")
          changelog.write_text(
              """## 0.20.35 — 2026-08-02

- Continue output-limited responses automatically for up to three additional segments, while stopping safely when a provider reports a limit without making progress.
- Make Resume honor the chat's current context, working-history, output-token, and token-counting limits instead of replaying the immutable limits captured when the response first started.
- Keep provider prefix continuation anchored to the exact partial assistant text; move Arbor's saved tool activity into a separate context item so hidden working metadata cannot become the continuation target.

""" + changelog.read_text()
          )

          notes = Path("docs/releases/RELEASE_NOTES_0.20.35.md")
          notes.write_text("""# Arbor 0.20.35

This release repairs repeated **Response paused** loops after a provider returns an output-length finish reason.

## Fixed

- Arbor now automatically requests up to three continuation segments when each segment makes progress.
- A zero-progress length loop is stopped and reported as a provider error instead of offering an endless Continue cycle.
- Manual Resume uses the limits currently shown in Chat configuration, so raising the output ceiling now affects an already-paused response.
- DeepSeek prefix completion receives the exact saved assistant prefix. Internal reasoning/tool metadata is no longer appended after the visible answer and mistaken for text to continue.

The provider/model and prompt identity remain pinned to the original request; only user-adjustable runtime limits are refreshed on Resume.
""")

          Path(".github/workflows/repair-response-resume-loop.yml").unlink()
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'MAX_AUTOMATIC_OUTPUT_CONTINUATIONS = 3' app/src/main/java/app/arbor/chat/generation/GenerationWorker.kt
          grep -q 'continuationAssistantNodeId' app/src/main/java/app/arbor/chat/chat/ContextAssembler.kt
          grep -q 'versionName = "0.20.35"' app/build.gradle.kts

      - name: Verify licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Run release tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Arbor-0.20.35-release-update-compatible.apk
          sha256sum dist/Arbor-0.20.35-release-update-compatible.apk > dist/Arbor-0.20.35-SHA256.txt
          git diff --binary main...HEAD > /dev/null || true
          git archive --format=zip --prefix=Arbor-0.20.35/ -o dist/Arbor-0.20.35-source.zip HEAD

      - name: Commit verified source repair
        run: |
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix output-limit continuation loops"
          git push origin HEAD:fix/response-resume-loop-0.20.35

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arbor-0.20.35-response-resume-repair
          path: |
            dist/
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
