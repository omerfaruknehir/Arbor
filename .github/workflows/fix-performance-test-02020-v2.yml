name: Fix 0.20.20 persistent route test

on:
  push:
    branches:
      - agent/stateful-icon-restart-0.20.20

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch moved route assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/app/arbor/chat/ui/PerformanceOverlayTest.kt')
          text = path.read_text()
          anchor = '        val rootSource = java.io.File("src/main/java/app/arbor/chat/ui/ArborApp.kt").readText()\n'
          if 'val routeSource = ' not in text:
              if anchor not in text:
                  raise SystemExit('Root source anchor not found')
              text = text.replace(
                  anchor,
                  '        val routeSource = java.io.File("src/main/java/app/arbor/chat/ui/SettingsRoute.kt").readText()\n' + anchor,
                  1,
              )
          old = '        assertTrue(settingsSource.contains("DEVELOPER(\\\"Developer settings\\\")"))\n'
          new = '        assertTrue(routeSource.contains("DEVELOPER(\\\"Developer settings\\\")"))\n'
          if old not in text:
              raise SystemExit('Developer route assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-performance-test-02020.yml
          rm -f .github/workflows/fix-performance-test-02020-v2.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update performance test for persistent settings routes"
          git push
