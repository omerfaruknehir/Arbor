name: Validate cloud restore repair

on:
  push:
    branches:
      - fix/cloud-restore-and-icons
    paths:
      - tools/fix_cloud_restore_icons.py
      - .github/workflows/fix-cloud-restore-icons.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
  XYLUNE_SOURCE_COMMIT: ${{ github.sha }}
  XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
  XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-restore-and-icons
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply cloud restore and provider icon repair
        run: python3 tools/fix_cloud_restore_icons.py
      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh
      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog
      - name: Run release tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest
      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease
      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease
      - name: Verify package, version, signature, and repair assets
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='app.xylune.chat' versionCode='171' versionName='0.23.2'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          grep -F 'name="cloud_backups" path="cloud-backups/"' app/src/main/res/xml/file_paths.xml
          test -f app/src/main/res/drawable/ic_google_drive.xml
          test -f app/src/main/res/drawable/ic_onedrive.xml
          test -f app/src/main/res/drawable/ic_dropbox.xml
          test -f app/src/main/res/drawable/ic_nextcloud.xml
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Fix Xylune cloud restore and provider icons"
          git push origin HEAD:fix/cloud-restore-and-icons
