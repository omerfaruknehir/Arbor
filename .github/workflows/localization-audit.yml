name: Localization validation

on:
  push:
    branches:
      - agent/turkish-localization
    paths:
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turkish-localization
          fetch-depth: 0
      - name: Correct dynamic Turkish rule and add coverage
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/app/xylune/chat/ui/UiLocalization.kt')
          s = p.read_text(encoding='utf-8')
          old = r'Regex("""^ Allow (\d+) listed network origins\?$""")'
          new = r'Regex("""^Allow (\d+) listed network origins\?$""")'
          if old not in s:
              raise SystemExit('missing network-origin dynamic rule')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          t = Path('app/src/test/java/app/xylune/chat/ui/TurkishLocalizationTest.kt')
          tests = t.read_text(encoding='utf-8')
          needle = '        assertEquals("Kaynak 3", localizeUiText("Source 3", XyluneUiLanguage.TURKISH))\n'
          addition = needle + (
              '        assertEquals("3 listelenen ağ kaynağına izin ver", localizeUiText("Allow 3 listed network origins?", XyluneUiLanguage.TURKISH))\n'
              '        assertEquals("2 devre dışı bellek silinsin mi?", localizeUiText("Delete 2 disabled memories?", XyluneUiLanguage.TURKISH))\n'
              '        assertEquals("Deneme 4 · 2 hata", localizeUiText("Attempt 4 · 2 error(s)", XyluneUiLanguage.TURKISH))\n'
          )
          if needle not in tests:
              raise SystemExit('missing TurkishLocalizationTest insertion point')
          t.write_text(tests.replace(needle, addition, 1), encoding='utf-8')
      - name: Commit localization corrections
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/xylune/chat/ui/UiLocalization.kt app/src/test/java/app/xylune/chat/ui/TurkishLocalizationTest.kt
          git commit -m "Cover dynamic Turkish translations"
          git push origin HEAD:agent/turkish-localization
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run localization unit tests and compile release
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest compileReleaseKotlin
