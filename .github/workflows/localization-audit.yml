name: Localization audit

on:
  pull_request:
    paths:
      - 'app/src/**/*.kt'
      - 'app/src/main/res/**'
      - '.github/workflows/localization-audit.yml'
  push:
    branches:
      - agent/turkish-localization
    paths:
      - 'app/src/**/*.kt'
      - 'app/src/main/res/**'
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Collect UI string literals
        shell: python
        run: |
          from pathlib import Path
          import ast
          import re

          roots = [Path('app/src/main/java'), Path('app/src/debug/java')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(sorted(root.rglob('*.kt')))

          literal_re = re.compile(r'"(?:\\.|[^"\\])*"')
          likely_ui_markers = (
              'Text(', 'title =', 'subtitle =', 'label =', 'placeholder =',
              'contentDescription =', 'supportingText =', 'headlineContent =',
              'showSnackbar(', 'Toast.makeText(', 'message =', 'description =',
              'emptyText =', 'buttonText =', 'SettingsGroup(', 'SettingsDestination(',
              'SectionTitle(', 'SettingsSwitch(', 'SettingSwitch(', 'OptionRow(',
              'StatusRow(', 'XyluneAlertDialog(', 'confirmButton', 'dismissButton',
              'RadioOption(', 'FilterChip(', 'AssistChip(', 'InputChip(', 'SuggestionChip(',
              'DropdownMenuItem(', 'NavigationDrawerItem(', 'NavigationBarItem(',
              'TopAppBar(', 'LargeTopAppBar(', 'MediumTopAppBar(', 'SmallTopAppBar(',
              'OutlinedTextField(', 'TextField(', 'SearchBar(', 'Tooltip',
          )
          excluded_prefixes = (
              'http://', 'https://', 'app.', 'com.', 'android.', 'xylune_',
              'application/', 'text/', 'image/', 'model/', 'provider/',
          )
          one_word_ui = {
              'back','close','cancel','save','delete','edit','retry','search','settings','appearance',
              'privacy','about','open','copy','share','stop','send','images','files','camera','tools',
              'thinking','research','off','on','auto','system','light','dark','refresh','done','next',
              'skip','continue','remove','add','download','restore','import','export','archive','rename',
              'move','unarchive','install','uninstall','enable','disable','default','english','turkish',
              'language','yes','no','ok','apply','create','clear','browse','connect','disconnect','learn',
              'manage','select','choose','view','hide','show','copy','paste','replace','reset','finish',
          }

          rows = []
          for path in files:
              rel = path.as_posix()
              if '/python/' in rel or '/schemas/' in rel:
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith(('package ', 'import ', '//', '*')):
                      continue
                  if not any(marker in line for marker in likely_ui_markers):
                      continue
                  for match in literal_re.finditer(line):
                      token = match.group(0)
                      try:
                          value = ast.literal_eval(token)
                      except Exception:
                          value = token[1:-1]
                      clean = value.strip()
                      if not clean or not re.search(r'[A-Za-z]', clean):
                          continue
                      if clean.startswith(excluded_prefixes):
                          continue
                      if re.fullmatch(r'[A-Za-z0-9_.:/+-]+', clean) and clean.casefold() not in one_word_ui:
                          continue
                      rows.append((rel, lineno, clean))

          Path('build').mkdir(exist_ok=True)
          unique = sorted({value for _, _, value in rows}, key=lambda s: s.casefold())
          with Path('build/localization-audit.txt').open('w', encoding='utf-8') as out:
              out.write('=== LOCATIONS ===\n')
              for rel, lineno, value in rows:
                  out.write(f'{rel}:{lineno}\t{value}\n')
              out.write('\n=== UNIQUE ===\n')
              for value in unique:
                  out.write(value.replace('\n', r'\n') + '\n')
          print(f'Collected {len(rows)} occurrences / {len(unique)} unique displayed strings')
      - uses: actions/upload-artifact@v7
        with:
          name: localization-audit
          path: build/localization-audit.txt
          retention-days: 2
      - uses: actions/upload-artifact@v7
        with:
          name: localization-source-snapshot
          path: |
            app/src/main/java/
            app/src/main/res/
            app/src/test/java/
            app/build.gradle.kts
          retention-days: 2
