name: Localization patch

on:
  push:
    branches:
      - agent/turkish-localization
    paths:
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turkish-localization
          fetch-depth: 0
      - name: Apply localization patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ci/localization.patch.gz.b64 | gzip --decompress > /tmp/localization.patch
          git apply --check /tmp/localization.patch
          git apply /tmp/localization.patch
          git diff --check
          git add app
          git diff --cached --stat
      - name: Commit localization implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Turkish app localization"
          git push origin HEAD:agent/turkish-localization
