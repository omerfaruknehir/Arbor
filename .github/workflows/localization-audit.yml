name: Localization validation

on:
  push:
    branches:
      - agent/turkish-localization
    paths:
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/turkish-localization
          fetch-depth: 0
      - name: Fix Kotlin regex literals
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/app/xylune/chat/ui/UiLocalization.kt')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Regex("^ Allow (\\d+) listed network origins?$")': 'Regex("""^ Allow (\\d+) listed network origins\\?$""")',
              'Regex("^Delete (\\d+) disabled memor(?:y|ies)\\?$")': 'Regex("""^Delete (\\d+) disabled memor(?:y|ies)\\?$""")',
              'Regex("^Updates are checked against (.+)\\.$")': 'Regex("""^Updates are checked against (.+)\\.$""")',
              'Regex("^Attempt (\\d+) · repeated candidate · (\\d+) error\\(s\\)$")': 'Regex("""^Attempt (\\d+) · repeated candidate · (\\d+) error\\(s\\)$""")',
              'Regex("^Attempt (\\d+) · (\\d+) error\\(s\\)$")': 'Regex("""^Attempt (\\d+) · (\\d+) error\\(s\\)$""")',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected literal: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit regex fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/xylune/chat/ui/UiLocalization.kt
          git commit -m "Fix Turkish localization regex literals"
          git push origin HEAD:agent/turkish-localization
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify localization tests and release build
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
