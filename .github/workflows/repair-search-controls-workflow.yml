name: Repair search controls workflow

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/repair-search-controls-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair duplicate max_uses patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path(".github/workflows/implement-search-controls-0.24.7.yml")
          lines = target.read_text().splitlines(keepends=True)
          start_marker = "          replace_once(\n"
          path_marker = '              "app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt",\n'
          value_marker = "              '                put(\"max_uses\", JsonPrimitive(8))',\n"
          comment_marker = "          # There are two max_uses occurrences; replace the remaining fetch occurrence too.\n"
          write_marker = '          write("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt", text)\n'

          start = None
          for index in range(len(lines) - 2):
              if lines[index] == start_marker and lines[index + 1] == path_marker and lines[index + 2] == value_marker:
                  start = index
                  break
          if start is None:
              raise SystemExit("Could not find duplicate max_uses replace_once block")

          comment = lines.index(comment_marker, start)
          end = lines.index(write_marker, comment) + 1
          replacement = [
              "          # Both Anthropic server tools use the same max_uses default.\n",
              '          text = read("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt")\n',
              '          count = text.count(\'put("max_uses", JsonPrimitive(8))\')\n',
              "          if count != 2:\n",
              '              raise SystemExit(f"Expected two Anthropic max_uses defaults, found {count}")\n',
              "          text = text.replace(\n",
              '              \'put("max_uses", JsonPrimitive(8))\',\n',
              '              \'put("max_uses", JsonPrimitive(request.webSearchMaxResults.coerceIn(3, 20)))\',\n',
              "          )\n",
              '          write("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt", text)\n',
          ]
          target.write_text("".join(lines[:start] + replacement + lines[end:]))
          Path(".github/workflows/repair-search-controls-workflow.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Xylune 0.24.7 search implementation workflow"
          git push
