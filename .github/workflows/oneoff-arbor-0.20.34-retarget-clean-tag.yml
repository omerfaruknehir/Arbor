name: One-off Arbor 0.20.34 clean tag

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/oneoff-arbor-0.20.34-retarget-clean-tag.yml

permissions:
  contents: write

jobs:
  retarget-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Point release tag at clean verified source
        shell: bash
        run: |
          git tag -f v0.20.34 5db9bb70ecec4a41aac403ab3b951e7c2c8bb96a
          git push --force origin refs/tags/v0.20.34

      - name: Remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-arbor-0.20.34-retarget-clean-tag.yml
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish Arbor 0.20.34 source cleanup"
          git push origin HEAD:main
