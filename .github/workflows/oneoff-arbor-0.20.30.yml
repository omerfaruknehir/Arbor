name: One-off Arbor 0.20.30 repairs

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/oneoff-arbor-0.20.30.yml

permissions:
  contents: write

jobs:
  repair-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          # Release identity.
          replace_once("app/build.gradle.kts", 'versionCode = 155', 'versionCode = 156')
          replace_once("app/build.gradle.kts", 'versionName = "0.20.29"', 'versionName = "0.20.30"')

          # Reserve the second action slot as the chat header collapses. The title
          # remains centered in expanded mode, then shifts into the genuinely free
