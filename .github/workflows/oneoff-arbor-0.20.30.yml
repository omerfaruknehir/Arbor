name: One-off Arbor 0.20.30 repairs

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/oneoff-arbor-0.20.30.yml

permissions:
  contents: write

jobs:
  repair-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct and apply source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("ci/oneoff-arbor-0.20.30-repair-source.txt")
          lines = source_path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "PY")

          extracted = []
          active_quote = None
          for raw in lines[start + 1:end]:
              if active_quote is None:
                  line = raw[10:] if raw.startswith("          ") else raw
                  extracted.append(line)
                  single_count = line.count("'''")
                  double_count = line.count('\"\"\"')
                  if single_count % 2 == 1:
                      active_quote = "'''"
                  elif double_count % 2 == 1:
                      active_quote = '\"\"\"'
              else:
                  # The original invalid YAML preserved these lines exactly as
                  # intended string/file contents. Do not strip their indentation.
                  extracted.append(raw)
                  if raw.count(active_quote) % 2 == 1:
                      active_quote = None

          if active_quote is not None:
              raise SystemExit(f"Unclosed embedded Python string: {active_quote}")
          Path("/tmp/arbor-0.20.30-repair.py").write_text("\n".join(extracted) + "\n")
          PY
          python3 /tmp/arbor-0.20.30-repair.py
          rm -f ci/oneoff-arbor-0.20.30-repair-source.txt

      - name: Verify licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Run release tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Build release artifacts
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Commit verified repairs
        shell: bash
        run: |
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix widget repair guidance and chat protocol rendering

          Release Arbor 0.20.30 with exact item/container grammar, targeted compiler diagnostics, DeepSeek DSML adaptation, and collision-free collapsed chat actions."
          git push origin HEAD:main
