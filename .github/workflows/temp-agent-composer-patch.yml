name: One-shot composer patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-agent-composer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/image-composer-blur-height
          fetch-depth: 0
      - name: Apply patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/agent_composer_popup_patch.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/android.yml
          rm -f .github/workflows/agent-composer-popup-fix.yml
          rm -f ci/agent-composer-popup-trigger.txt
          rm -f ci/agent_composer_popup_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move composer controls into plus menu and fix popup dismissal'
          git push origin HEAD:agent/image-composer-blur-height
      - name: Remove one-shot runner from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/temp-agent-composer-patch.yml
          git add .github/workflows/temp-agent-composer-patch.yml
          git commit -m 'Remove one-shot composer patch runner'
          git push origin HEAD:main
