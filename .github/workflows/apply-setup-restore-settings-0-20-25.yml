name: Apply setup restore and settings backup

on:
  push:
    branches:
      - feature/setup-restore-settings-0.20.25

permissions:
  contents: write

concurrency:
  group: apply-setup-restore-settings-0-20-25
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/setup-restore-settings-0.20.25
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply source changes
        run: python scripts/apply_setup_restore_settings_0_20_25.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md docs/releases/RELEASE_NOTES_0.20.25.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add setup restore and portable app settings"
            git push origin HEAD:feature/setup-restore-settings-0.20.25
          fi
