name: Apply legal pages and dynamic logo patch

on:
  push:
    branches:
      - agent/legal-pages-about-dynamic-logo

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[legal-patch-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/legal-pages-about-dynamic-logo
          fetch-depth: 0

      - name: Validate and apply guarded patch
        run: |
          python -m py_compile .github/scripts/apply-legal-pages-about-dynamic-logo.py
          python .github/scripts/apply-legal-pages-about-dynamic-logo.py

      - name: Validate generated sources
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('app/src/main/java/app/xylune/chat/ui/SettingsScreen.kt').read_text()
          test = Path('app/src/test/java/app/xylune/chat/ui/LegalWebsiteIntegrationTest.kt').read_text()
          site = Path('docs/assets/js/site.js').read_text()
          boot = Path('docs/assets/js/theme-boot.js').read_text()

          assert 'SettingsGroup("Legal")' in settings
          assert settings.count('dynamicLogo = matchLauncherIconToPalette') >= 6
          assert 'assertTrue(settings.contains("SettingsGroup(\\"Legal\\")"))' in test
          assert 'function syncBrandLogo(preference)' in site
          assert "dynamicLogo: params.get('dynamicLogo') === '1'" in boot
          print('Generated Android and website sources passed structural validation.')
          PY

      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/apply-legal-pages-about-dynamic-logo.py
          rm .github/workflows/legal-pages-about-dynamic-logo-patch.yml

      - name: Commit completed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add legal pages to About and theme website logo [legal-patch-complete]"
          git push origin HEAD:agent/legal-pages-about-dynamic-logo
