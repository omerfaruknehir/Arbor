name: Publish Arbor 0.20.15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0-20-15.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 247bd65656c52d860559275482ad146b725a6ecf

      - name: Skip if already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.20.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified build artifact
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/8781250077/zip" \
            > "$RUNNER_TEMP/arbor-0.20.15.zip"
          unzip -q "$RUNNER_TEMP/arbor-0.20.15.zip" -d "$RUNNER_TEMP/arbor-artifact"

      - name: Prepare release assets
        if: steps.existing.outputs.published != 'true'
        run: |
          mkdir -p release-assets
          cp "$RUNNER_TEMP/arbor-artifact/outputs/apk/release/app-release.apk" \
            release-assets/Arbor-0.20.15-release.apk
          cp "$RUNNER_TEMP/arbor-artifact/outputs/bundle/release/app-release.aab" \
            release-assets/Arbor-0.20.15-release.aab
          cp "$RUNNER_TEMP/arbor-artifact/outputs/apk/androidTest/debug/app-debug-androidTest.apk" \
            release-assets/Arbor-0.20.15-instrumentation.apk
          (
            cd release-assets
            sha256sum Arbor-0.20.15-release.apk \
              Arbor-0.20.15-release.aab \
              Arbor-0.20.15-instrumentation.apk \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.20.15 \
            --repo "$GITHUB_REPOSITORY" \
            --target 247bd65656c52d860559275482ad146b725a6ecf \
            --title "Arbor 0.20.15" \
            --notes-file docs/releases/RELEASE_NOTES_0.20.15.md \
            release-assets/Arbor-0.20.15-release.apk \
            release-assets/Arbor-0.20.15-release.aab \
            release-assets/Arbor-0.20.15-instrumentation.apk \
            release-assets/SHA256SUMS.txt
