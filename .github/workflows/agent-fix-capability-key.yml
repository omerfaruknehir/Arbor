name: Apply capability key fix

on:
  push:
    branches:
      - agent/widget-snippet-runtime
    paths:
      - '.github/workflows/agent-fix-capability-key.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply source fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/arbor/chat/widgets/ArborProgramSpec.kt')
          source = path.read_text()
          marker = '    private fun validateWidgetCapabilities('
          insertion = '''    private fun capabilityKey(value: ArborWidgetCapabilityRequest): String = when (value.type) {
              "network" -> "network:${value.origins.sorted().joinToString(",")}"
              "location" -> "location:${value.accuracy}"
              "folder" -> "folder:${value.mode}"
              else -> value.type
          }

          '''
          if 'private fun capabilityKey(' not in source:
              if marker not in source:
                  raise SystemExit('capability helper insertion point not found')
              source = source.replace(marker, insertion + marker, 1)
          path.write_text(source)
          PY
          rm .github/workflows/agent-fix-capability-key.yml
          git diff --check
          git config user.name 'Arbor Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/app/arbor/chat/widgets/ArborProgramSpec.kt .github/workflows/agent-fix-capability-key.yml
          git commit -m 'Fix widget capability validation'
          git push origin HEAD:agent/widget-snippet-runtime
