name: Retry Arbor 0.22.0 memory integration

on:
  push:
    branches: [ agent/memory-management-0.22.0 ]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/memory-management-0.22.0
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply literal-safe product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/agent-memory-management-022.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(?P<script>[\s\S]*?)\n\s{10}PY\n", workflow)
          if match is None:
              raise SystemExit('Could not extract the original integration script')
          script = textwrap.dedent(match.group('script'))
          # The first workflow used ordinary Python triple-quoted strings. Python
          # consumed Kotlin backslash escapes such as \\s before matching files.
          # Make only opening replacement literals raw; closing delimiters and
          # already-raw regex literals are left unchanged.
          script = re.sub(r"(?m)^(\s*)'''(?=\S)", r"\1r'''", script)
          exec(compile(script, '<memory-0.22.0-integration>', 'exec'))
          PY
      - name: Verify release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest
      - name: Verify release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease
      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-memory-management-022.yml .github/workflows/agent-memory-management-022-retry.yml
          git add app docs
          git commit -m "Improve memory management and prepare Arbor 0.22.0"
          git push origin HEAD:agent/memory-management-0.22.0
