                          properties = """"query":{"type":"string","minLength":1,"maxLength":500},"includeDisabled":{"type":"boolean"},"limit":{"type":"integer","minimum":1,"maximum":200}""",
                          required = listOf("query"),
                      ))
                      add(tool(
