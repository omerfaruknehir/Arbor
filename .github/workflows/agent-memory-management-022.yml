                          properties = """"id":{"type":"string","minLength":1,"maxLength":100},"text":{"type":"string","minLength":1,"maxLength":2000},"category":{"type":"string","maxLength":40}""",
                          required = listOf("id", "text"),
                      ))
                      add(tool(
