          tools = 'app/src/main/java/app/arbor/chat/agent/AgentTools.kt'
          replace_once(tools,
          '''    val memoryId: String? = null,
              val memoryText: String? = null,
              val memoryCategory: String? = null,
              val args: List<String> = emptyList(),
          ''',
          '''    val memoryId: String? = null,
              val memoryText: String? = null,
