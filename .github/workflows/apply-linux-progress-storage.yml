name: Apply Linux setup progress and storage repair

on:
  push:
    branches:
      - fix/linux-setup-progress-storage-0.23.9

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-setup-progress-storage-0.23.9
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply runtime repair
        run: python3 .github/scripts/apply-linux-runtime-progress-storage.py
      - name: Apply UI and release metadata
        run: python3 .github/scripts/apply-linux-ui-release.py
      - name: Escape structural-test interpolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/app/xylune/chat/ui/OnboardingFlowTest.kt')
          text = path.read_text()
          old = 'assertTrue(workspace.contains("Step $step of $total"))'
          new = 'assertTrue(workspace.contains("Step \\$step of \\$total"))'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one structural assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          ./ci/verify-third-party-licenses.sh
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
      - name: Commit repaired tree
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show Linux setup progress and fix storage accounting"
          git push origin HEAD:fix/linux-setup-progress-storage-0.23.9
