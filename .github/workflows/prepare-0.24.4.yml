name: Prepare Xylune 0.24.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Bump version, changelog, and release ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old_code = '        versionCode = 192'
          new_code = '        versionCode = 193'
          old_name = '        versionName = "0.24.3"'
          new_name = '        versionName = "0.24.4"'
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('Expected exactly one 0.24.3 version declaration')
          build.write_text(text.replace(old_code, new_code).replace(old_name, new_name))

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          if current.startswith('## 0.24.4'):
              raise SystemExit('0.24.4 changelog entry already exists')
          entry = '\n'.join([
              '## 0.24.4 — 2026-08-05',
              '',
              '- Route Privacy, Terms, and Data Deletion to the rendered Xylune Pages site and expose them under About Xylune.',
              '- Add centered sticky website titles whose expanded-to-compact transition is driven directly by the CSS scroll timeline, with snap points around the collapse range.',
              '- Add an always-visible web scheme selector and update both the Xylune logo and favicon for dark, light, system, or app-provided palettes.',
              '- Add a semantic-version-sorted Pages release list and explicitly mark each new stable GitHub release as latest.',
              '- Consume stale Predictive Back progress flows so AndroidX cannot crash with `You must collect the progress flow`.',
              '',
              '',
          ])
          changelog.write_text(entry + current)

          release_workflow = Path('.github/workflows/release.yml')
          release_text = release_workflow.read_text()
          slash = chr(92)
          old_publish = f'            -F draft=false {slash}\n            >/dev/null'
          new_publish = f'            -F draft=false {slash}\n            -f make_latest=true {slash}\n            >/dev/null'
          if new_publish not in release_text:
              if release_text.count(old_publish) != 1:
                  raise SystemExit('Could not locate the canonical release publication step')
              release_workflow.write_text(release_text.replace(old_publish, new_publish))
          PY

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Commit prepared release
        shell: bash
        run: |
          rm .github/workflows/prepare-0.24.4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            CHANGELOG.md \
            .github/workflows/release.yml \
            docs/releases/RELEASE_NOTES_0.24.4.md \
            .github/workflows/prepare-0.24.4.yml
          git commit -m 'Prepare Xylune 0.24.4'
          git push origin HEAD:main
