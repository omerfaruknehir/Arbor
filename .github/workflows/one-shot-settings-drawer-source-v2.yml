name: One-shot Arbor 0.20.13 fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-settings-drawer-source-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Backfill 0.20.12 source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf source-backfill
          mkdir source-backfill
          git archive --format=zip --prefix='Arbor-0.20.12/' -o source-backfill/Arbor-0.20.12-source.zip v0.20.12
          git archive --format=tar --prefix='Arbor-0.20.12/' v0.20.12 | gzip -n > source-backfill/Arbor-0.20.12-source.tar.gz
          cd source-backfill
          sha256sum Arbor-0.20.12-source.zip Arbor-0.20.12-source.tar.gz > Arbor-0.20.12-source-SHA256.txt
          gh release upload v0.20.12 ./* --clobber

      - name: Apply source changes
        run: python3 .github/scripts/fix_0_20_13.py

      - name: Verify and build optimized release
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Settings drawer arbitration and release source archives"
          git push origin HEAD:main
