name: Finalize Xylune legal identity

on:
  push:
    branches:
      - agent/finish-cloud-backup
    paths:
      - tools/finalize_legal_identity.py
      - .github/workflows/finalize-legal-identity.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/finalize_legal_identity.py
      - .github/workflows/finalize-legal-identity.yml

permissions:
  contents: write

concurrency:
  group: finalize-xylune-legal-identity
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-cloud-backup
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply canonical identity and legal pages
        run: python3 tools/finalize_legal_identity.py

      - name: Verify third-party license catalog
        shell: bash
        run: |
          set -euo pipefail
          ./ci/verify-third-party-licenses.sh
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:generateOfflineLicenseCatalog

      - name: Run release tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            testReleaseUnitTest lintRelease

      - name: Assemble canonical release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            assembleRelease

      - name: Verify package, certificate, and legal files
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > /tmp/xylune-badging.txt
          grep -F "package: name='app.xylune.chat' versionCode='170' versionName='0.23.1'" /tmp/xylune-badging.txt
          grep -F "application-label:'Xylune'" /tmp/xylune-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/xylune-cert.txt
          grep -F 'Signer #1 certificate SHA-1 digest: 595474cbcc007374653a7053df3792dbed16ad99' /tmp/xylune-cert.txt
          test -f PRIVACY.md
          test -f TERMS.md
          test -f DATA_DELETION.md
          test -f docs/index.md
          test -f docs/privacy/index.md
          test -f docs/terms/index.md
          test -f docs/data-deletion/index.md
          grep -F 'WVR0y8wAc3RlOnBT3zeS2+0WrZk=' docs/CLOUD_PROVIDERS_SETUP.md
          grep -F '6698' docs/privacy/index.md

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app README.md BUILDING.md ci CHANGELOG.md docs PRIVACY.md TERMS.md DATA_DELETION.md
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No legal or identity changes were produced'
            exit 1
          fi
          git commit -m 'Publish Xylune legal pages and canonical package'
          git push origin HEAD:agent/finish-cloud-backup
