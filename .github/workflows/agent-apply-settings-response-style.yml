name: Apply settings response-style patch

on:
  push:
    branches:
      - agent/settings-response-style

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Apply requested changes
        run: |
          git apply --check .github/agent-patches/settings-response-style.patch
          git apply .github/agent-patches/settings-response-style.patch
      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest
      - name: Commit verified implementation
        run: |
          rm .github/agent-patches/settings-response-style.patch
          rm .github/workflows/agent-apply-settings-response-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Organize settings and add less emoji mode'
          git push origin HEAD:agent/settings-response-style
