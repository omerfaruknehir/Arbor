name: Run performance overlay upgrade

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/performance-overlay-profile-scale' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Extract and run branch transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-performance-overlay-upgrade.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw_lines = workflow[start:end].splitlines()
          yaml_indent = 10
          output = []
          inside_triple = False
          string_trim = yaml_indent

          for raw_line in raw_lines:
              if not inside_triple:
                  line = raw_line[yaml_indent:] if raw_line.startswith(' ' * yaml_indent) else raw_line
                  output.append(line)
                  if line.count('"""') % 2 == 1:
                      inside_triple = True
                      delimiter_column = raw_line.index('"""')
                      after = raw_line.split('"""', 1)[1]
                      if after:
                          content_indent = len(after) - len(after.lstrip(' '))
                          string_trim = max(0, delimiter_column - content_indent)
                      else:
                          string_trim = yaml_indent
              else:
                  line = raw_line[string_trim:] if raw_line.startswith(' ' * string_trim) else raw_line
                  output.append(line)
                  if raw_line.count('"""') % 2 == 1:
                      inside_triple = False
                      string_trim = yaml_indent

          Path('/tmp/apply-performance-overlay.py').write_text('\n'.join(output) + '\n')
          PY
          python3 /tmp/apply-performance-overlay.py

      - name: Verify transformed source
        shell: bash
        run: |
          grep -q 'versionName = "0.20.11"' app/build.gradle.kts
          grep -q 'performanceOverlayScale' app/src/main/java/app/arbor/chat/settings/AppPreferences.kt
          grep -q 'Overlay scale' app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt
          grep -q 'sharePointerInputWithSiblings(): Boolean = true' app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt
          grep -q 'PerformanceCauseProfile' app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt
          ! grep -q 'Likely:' app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt

      - name: Run focused validation
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleRelease

      - name: Commit source-only result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-performance-overlay-upgrade.yml
          git rm .github/performance-overlay-upgrade.trigger
          git add app README.md CHANGELOG.md docs/releases/RELEASE_NOTES_0.20.11.md
          git commit -m "Upgrade performance overlay profiling and touch-through UX"
          git push origin HEAD:${{ github.head_ref }}
