name: Prepare Xylune 0.23.19

on:
  push:
    branches:
      - release/0.23.19

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.23.19
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Bump version and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old_code = '        versionCode = 187'
          new_code = '        versionCode = 188'
          old_name = '        versionName = "0.23.18"'
          new_name = '        versionName = "0.23.19"'
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('Expected exactly one 0.23.18 version declaration')
          build.write_text(text.replace(old_code, new_code).replace(old_name, new_name))

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          if current.startswith('## 0.23.19'):
              raise SystemExit('0.23.19 changelog entry already exists')
          entry = '''## 0.23.19 — 2026-08-05

          - Add a global **Less emoji** response-style preference, enabled by default and applied to existing and new chats on their next response.
          - Avoid decorative emoji without banning meaningful or explicitly requested emoji, and persist the preference through portable settings backup and restore.
          - Reorganize Settings into **AI & chat**, **Capabilities**, **App & data**, and **About**, with a dedicated **Response style** page.

          '''
          changelog.write_text(entry + current)
          PY

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Commit prepared release
        shell: bash
        run: |
          rm .github/workflows/prepare-0.23.19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts CHANGELOG.md docs/releases/RELEASE_NOTES_0.23.19.md .github/workflows/prepare-0.23.19.yml
          git commit -m 'Prepare Xylune 0.23.19'
          git push origin HEAD:release/0.23.19
