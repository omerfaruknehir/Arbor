name: Apply Pages and reasoning fixes from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/openai-compatible-visible-reasoning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run one-shot patch
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/patch-pages-reasoning-once.yml \
            | sed '1d;$d;s/^          //' > /tmp/patch-pages-reasoning.py
          python3 /tmp/patch-pages-reasoning.py
          rm -f .github/workflows/patch-pages-reasoning-pr.yml .github/patch-pages-reasoning.trigger

      - name: Run focused unit tests
        run: ./gradlew testReleaseUnitTest --tests app.xylune.chat.provider.NativeProviderProtocolTest --tests app.xylune.chat.ui.LegalWebsiteIntegrationTest

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix visible reasoning and Pages color/title behavior"
          git push origin HEAD:${{ github.head_ref }}
