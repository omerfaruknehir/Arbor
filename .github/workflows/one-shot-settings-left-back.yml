name: One-shot settings left-back fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-settings-left-back.yml

permissions:
  contents: write

jobs:
  fix-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply settings gesture fix and prepare 0.20.12
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              "app/src/main/java/app/arbor/chat/ui/ArborApp.kt",
              """                // Chat and the Settings root support pull-to-open. Nested Settings pages
                // still register horizontal Back priority, so the drawer yields to them.
                gesturesEnabled = drawerSwipeEnabled(screen),""",
              """                // Only Chat owns the left-edge drawer gesture. Settings uses both
                // system back edges; its menu button remains the explicit drawer entry point.
                gesturesEnabled = drawerSwipeEnabled(screen),""",
          )
          replace_exact(
              "app/src/main/java/app/arbor/chat/ui/ArborApp.kt",
              "internal fun drawerSwipeEnabled(screen: Screen): Boolean = screen == Screen.CHAT || screen == Screen.SETTINGS",
              "internal fun drawerSwipeEnabled(screen: Screen): Boolean = screen == Screen.CHAT",
          )
          replace_exact(
              "app/src/test/java/app/arbor/chat/ui/NavigationBackTest.kt",
              """    @Test fun drawerSwipeIsEnabledAtChatAndSettingsRoots() {
        assertTrue(drawerSwipeEnabled(Screen.CHAT))
        assertTrue(drawerSwipeEnabled(Screen.SETTINGS))
        assertFalse(drawerSwipeEnabled(Screen.SEARCH))
        assertFalse(drawerSwipeEnabled(Screen.SANDBOX))
        assertFalse(drawerSwipeEnabled(Screen.TERMINAL))
    }""",
              """    @Test fun drawerSwipeIsLimitedToChatSoSettingsCanUseBothBackEdges() {
        assertTrue(drawerSwipeEnabled(Screen.CHAT))
        assertFalse(drawerSwipeEnabled(Screen.SETTINGS))
        assertFalse(drawerSwipeEnabled(Screen.SEARCH))
        assertFalse(drawerSwipeEnabled(Screen.SANDBOX))
        assertFalse(drawerSwipeEnabled(Screen.TERMINAL))
    }""",
          )
          replace_exact("app/build.gradle.kts", "versionCode = 137", "versionCode = 138")
          replace_exact("app/build.gradle.kts", 'versionName = "0.20.11"', 'versionName = "0.20.12"')

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text()
          marker = "# Changelog\n"
          section = """

## 0.20.12 — 2026-07-30

- Reserve both system back edges on the Settings screen, including the main Settings menu.
- Keep the navigation drawer available through the Settings menu button while limiting pull-to-open to Chat.
- Add regression coverage for Settings left-edge back ownership.
"""
          if "## 0.20.12 — 2026-07-30" not in changelog_text:
              if marker not in changelog_text:
                  raise SystemExit("CHANGELOG heading not found")
              changelog.write_text(changelog_text.replace(marker, marker + section, 1))

          readme = Path("README.md")
          readme.write_text(readme.read_text().replace("0.20.11", "0.20.12"))

          notes = Path("docs/releases/RELEASE_NOTES_0.20.12.md")
          notes.write_text("""# Arbor 0.20.12

## Fixed

- The left-edge Android back gesture now works from the main Settings menu and returns to Chat, matching the right-edge gesture.
- Settings no longer lets the drawer's pull-to-open recognizer steal the left-edge back gesture.
- The drawer remains available from the Settings hamburger button.

## Build

This release is an optimized, minified release build. Developer settings and the performance overlay remain available in-app.
""")

          Path(".github/workflows/one-shot-settings-left-back.yml").unlink()

      - name: Verify and build optimized release
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit and push fix
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Settings left-edge back gesture and release 0.20.12"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish Arbor 0.20.12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Arbor-0.20.12-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release/Arbor-0.20.12-release.aab
          (cd release && sha256sum Arbor-0.20.12-release.* > Arbor-0.20.12-SHA256.txt)
          gh release create v0.20.12 release/* \
            --target "$TARGET_SHA" \
            --title "Arbor 0.20.12" \
            --notes-file docs/releases/RELEASE_NOTES_0.20.12.md
