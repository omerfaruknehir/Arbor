name: Export Arbor 0.20.20 source

on:
  push:
    branches:
      - agent/stateful-icon-restart-0.20.20

permissions:
  contents: write
  actions: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: git archive --format=zip --output=Arbor-stateful-02020-source.zip HEAD
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Arbor-stateful-02020-source
          path: Arbor-stateful-02020-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Record artifact ID
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n%s\n' "$ARTIFACT_ID" "$SOURCE_SHA" > .github/stateful-02020-artifact.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/stateful-02020-artifact.txt
          git commit -m "Record 0.20.20 source artifact [skip ci]"
          git push
