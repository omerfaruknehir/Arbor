name: One-shot Arbor 0.20.14 onboarding

on:
  push:
    branches:
      - agent/onboarding-ux-0.20.14
    paths:
      - .github/workflows/one-shot-onboarding-0.20.14.yml

permissions:
  contents: write

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply onboarding source changes
        run: python3 .github/scripts/apply_onboarding_0_20_14.py

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Assemble optimized release AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bundleRelease

      - name: Assemble instrumentation APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit and push verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/arbor/chat/ui/OnboardingScreen.kt \
                  app/src/main/java/app/arbor/chat/ui/ArborApp.kt \
                  app/src/test/java/app/arbor/chat/ui/OnboardingFlowTest.kt \
                  app/build.gradle.kts README.md CHANGELOG.md \
                  docs/releases/RELEASE_NOTES_0.20.14.md
          git commit -m "Improve onboarding resilience, themes, and contrast"
          git push origin HEAD:agent/onboarding-ux-0.20.14
