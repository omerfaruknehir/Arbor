name: Validate Pages motion

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'app/src/test/java/app/xylune/chat/ui/WebsiteMotionIntegrationTest.kt'
      - '.github/workflows/validate-pages-motion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate JavaScript syntax
        run: |
          node --check docs/assets/js/site.js
          node --check docs/assets/js/motion.js
          node --check docs/assets/js/releases.js
      - name: Run website motion test
        run: ./gradlew :app:testReleaseUnitTest --tests app.xylune.chat.ui.WebsiteMotionIntegrationTest
