name: Apply and verify widget compiler 0.20.28

on:
  push:
    branches: [ agent/widget-compiler-0.20.28 ]
    paths:
      - .github/workflows/apply-widget-compiler-0.20.28.yml

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/widget-compiler-0.20.28
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply staged product patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/widget-compiler-0.20.28/*.part > "$RUNNER_TEMP/widget-compiler.patch"
          git apply --check "$RUNNER_TEMP/widget-compiler.patch"
          git apply "$RUNNER_TEMP/widget-compiler.patch"
          rm -rf .github/patches/widget-compiler-0.20.28
          rm -f .github/workflows/export-widget-compiler-context.yml
          rm -f .github/workflows/apply-widget-compiler-0.20.28.yml
          git diff --check
          test ! -e .github/patches/widget-compiler-0.20.28
          test ! -e .github/workflows/export-widget-compiler-context.yml
          test ! -e .github/workflows/apply-widget-compiler-0.20.28.yml
          git status --short

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Assemble optimized release AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bundleRelease

      - name: Assemble instrumentation APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: compile and test AI widgets before display'
          git push origin HEAD:agent/widget-compiler-0.20.28

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arbor-0.20.28-widget-compiler-release-and-reports
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
