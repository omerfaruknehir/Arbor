name: Apply APT status fd repair

on:
  push:
    branches:
      - fix/apt-status-fd-0.23.12
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-apt-status-fd-0.23.12
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apt-status-fd-0.23.12
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply repair
        run: python3 .github/scripts/apply-apt-status-fd-0.23.12.py
      - name: Remove one-shot repair files
        run: |
          rm -f \
            .github/scripts/apply-apt-status-fd-0.23.12.py \
            .github/workflows/apply-apt-status-fd-0.23.12.yml
      - name: Verify repair
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R 'APT::Status-Fd=1' app/src/main app/src/test
          grep -R 'APT::Status-Fd=3' app/src/main app/src/test
          grep -R 'additionalProgressFiles = listOf(statusFile)' app/src/main
          ./ci/verify-third-party-licenses.sh
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
      - name: Commit repaired tree
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use a dedicated APT status descriptor"
          git pull --rebase origin fix/apt-status-fd-0.23.12
          git push origin HEAD:fix/apt-status-fd-0.23.12
