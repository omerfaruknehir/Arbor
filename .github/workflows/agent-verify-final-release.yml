name: Agent verify final 0.24.15 release

on:
  push:
    branches:
      - agent/fix-recovery-dismissal-state
    paths:
      - .github/workflows/agent-verify-final-release.yml

permissions:
  contents: write
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-recovery-dismissal-state
      - name: Wait for final main Android run and release
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: 518f8487da1efa23421873e54efc1a37cd74cd34
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          out=ci/agent-final-release-verification.txt
          run_id=""
          for _ in $(seq 1 100); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Android --branch main --limit 10 \
              --json databaseId,headSha,status \
              --jq ".[] | select(.headSha == \"$MAIN_SHA\") | .databaseId" | head -n1)"
            if [[ -n "$run_id" ]]; then
              status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
              [[ "$status" == completed ]] && break
            fi
            sleep 15
          done
          release_json=""
          for _ in $(seq 1 20); do
            if release_json="$(gh release view v0.24.15 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,publishedAt,targetCommitish,url,assets 2>/dev/null)"; then
              break
            fi
            sleep 6
          done
          {
            echo "main_sha=$MAIN_SHA"
            echo "android_run_id=$run_id"
            if [[ -z "$run_id" ]]; then
              echo "android_run=missing"
            else
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
                --json databaseId,number,status,conclusion,event,headSha,createdAt,updatedAt,url,jobs
              echo
              echo "failed_logs:"
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
            fi
            echo
            echo "release:"
            if [[ -n "$release_json" ]]; then
              echo "$release_json"
            else
              echo "v0.24.15 release not found"
            fi
          } > "$out" 2>&1
      - name: Save verification report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-verify-final-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/agent-final-release-verification.txt .github/workflows/agent-verify-final-release.yml
          git commit -m 'Capture final 0.24.15 release verification'
          git push origin HEAD:agent/fix-recovery-dismissal-state
