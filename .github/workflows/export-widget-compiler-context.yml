name: Export widget compiler source context

on:
  push:
    branches: [ agent/widget-compiler-0.20.28 ]
    paths:
      - .github/workflows/export-widget-compiler-context.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr arbor-widget-compiler-source.zip . -x '.git/*' 'build/*' 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: arbor-widget-compiler-source
          path: arbor-widget-compiler-source.zip
          if-no-files-found: error
