name: Publish validated title collapse hotfix source

on:
  push:
    branches: [ agent/title-collapse-hotfix-0.23.16 ]
    paths:
      - .github/workflows/agent-title-collapse-hotfix.yml

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/title-collapse-hotfix-0.23.16
          fetch-depth: 0
      - name: Recreate the already validated source tree
        run: |
          set -euo pipefail
          python3 ci/run-title-collapse-hotfix.py
          grep -F 'versionCode = 185' app/build.gradle.kts
          grep -F 'versionName = "0.23.16"' app/build.gradle.kts
          grep -F 'Modifier.nestedScroll(topAppBarScrollBehavior.nestedScrollConnection)' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          ! grep -F 'ChatChromeScrollSample(' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          ! grep -F 'projectChatChromeFromScroll(' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'paging.itemCount > 0 && (snapshot == null || snapshot.atLatest)' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
      - name: Commit only non-workflow files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            app/build.gradle.kts \
            app/src/main/java/app/xylune/chat/ui/ChatScreen.kt \
            app/src/main/java/app/xylune/chat/ui/ChatCollapsingTranslucentTopBar.kt \
            app/src/test/java/app/xylune/chat/ui/KeyboardSearchDriveRegressionTest.kt \
            docs/releases/RELEASE_NOTES_0.23.16.md
          git commit -m 'Fix chat title collapse regressions'
          git push origin HEAD:agent/title-collapse-hotfix-0.23.16
