name: Verify Arbor 0.22.5 cloud providers

on:
  push:
    branches:
      - release/cloud-providers-0.22.5
  workflow_dispatch:

permissions:
  contents: write

env:
  ARBOR_SOURCE_REPOSITORY: ${{ github.repository }}
  ARBOR_SOURCE_COMMIT: ${{ github.sha }}
  ARBOR_MICROSOFT_CLIENT_ID: ${{ vars.ARBOR_MICROSOFT_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
  ARBOR_DROPBOX_APP_KEY: ${{ vars.ARBOR_DROPBOX_APP_KEY || 'arborbuildvalidation' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cloud-providers-0.22.5
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply complete cloud integration
        run: |
          python3 tools/apply-cloud-providers-0225-core.py
          python3 tools/apply-cloud-providers-0225-clients.py
          python3 tools/apply-cloud-providers-0225-ui.py
          python3 tools/fix-cloud-providers-0225.py
          python3 tools/improve-cloud-providers-0225.py
      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh
      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest
      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease
      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease
      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"
      - name: Commit verified product changes
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows/release.yml .github/workflows/android.yml
          git rm \
            tools/apply-cloud-providers-0225-core.py \
            tools/apply-cloud-providers-0225-clients.py \
            tools/apply-cloud-providers-0225-ui.py \
            tools/fix-cloud-providers-0225.py \
            tools/improve-cloud-providers-0225.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs
          git commit -m 'Add complete cloud provider support in Arbor 0.22.5 [skip ci]'
          git push origin HEAD:release/cloud-providers-0.22.5
