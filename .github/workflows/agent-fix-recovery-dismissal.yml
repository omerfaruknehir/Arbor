name: Agent fix recovery dismissal

on:
  push:
    branches:
      - agent/fix-recovery-dismissal-state
    paths:
      - .github/workflows/agent-fix-recovery-dismissal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-recovery-dismissal-state
      - name: Apply patch
        run: python3 ci/agent-fix-recovery-dismissal.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          rm -f .github/workflows/agent-fix-recovery-dismissal.yml
          rm -f ci/agent-fix-recovery-dismissal.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Persist recovery dismissals per chat and prepare 0.24.15'
          git push origin HEAD:agent/fix-recovery-dismissal-state
