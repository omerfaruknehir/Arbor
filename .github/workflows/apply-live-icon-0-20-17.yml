name: Build live icon switching branch

on:
  push:
    branches:
      - agent/live-icon-switch-and-themed-logos-0.20.17
    paths:
      - .github/workflows/apply-live-icon-0-20-17.yml
      - .github/tmp/live-icon/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-icon-switch-0.20.17
  cancel-in-progress: false

jobs:
  generate-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate normal source changes
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path(".github/tmp/live-icon/apply_02017.py"); s=p.read_text(); old="\"The launcher may take a moment to refresh. Android themed icons can override app-selected colors.\""; new="\"Using the ${palette.displayName} icon. Your launcher may take a moment to refresh.\""; i=s.rfind(old); assert i >= 0; p.write_text(s[:i] + new + s[i + len(old):])'
          python -c 'from pathlib import Path; p=Path(".github/tmp/live-icon/apply_02017.py"); s=p.read_text(); old="""changelog = replace_once(changelog, '# Changelog\\n\\n', '# Changelog\\n\\n' + entry, 'changelog insertion')"""; new="""changelog = changelog.replace('# Changelog\\n\\n', '# Changelog\\n\\n' + entry, 1)"""; assert old in s; p.write_text(s.replace(old,new,1))'
          python -m py_compile .github/tmp/live-icon/apply_02017.py
          python .github/tmp/live-icon/apply_02017.py
          rm -rf .github/tmp/live-icon
          rm -f .github/workflows/apply-live-icon-0-20-17.yml
          git diff --check
          test "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)" = "0.20.17"
          test "$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)" = "143"
          test "$(grep -c 'android:targetActivity=".LauncherActivity"' app/src/main/AndroidManifest.xml)" = "6"
          ! grep -q 'android:targetActivity=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'internal fun ArborMark' app/src/main/java/app/arbor/chat/ui/PaletteVisuals.kt
          grep -q 'MaterialTheme.colorScheme' app/src/main/java/app/arbor/chat/ui/PaletteVisuals.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Build release artifacts
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit verified source to branch
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          test ! -e .github/tmp/live-icon
          test ! -e .github/workflows/apply-live-icon-0-20-17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep icon changes in-app and theme Arbor marks"
          git push origin HEAD:agent/live-icon-switch-and-themed-logos-0.20.17

      - uses: actions/upload-artifact@v4
        with:
          name: Arbor-0.20.17-branch-build
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
