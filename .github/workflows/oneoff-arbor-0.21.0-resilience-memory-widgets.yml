name: One-off Arbor 0.21.0 resilience memory widgets

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/oneoff-arbor-0.21.0-resilience-memory-widgets.yml

permissions:
  contents: write

jobs:
  repair-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply Arbor 0.21.0 repair
        run: |
          python3 -m py_compile ci/oneoff-arbor-0.21.0-resilience-memory-widgets.py
          python3 ci/oneoff-arbor-0.21.0-resilience-memory-widgets.py

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Build optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified release source
        shell: bash
        run: |
          rm -f ci/oneoff-arbor-0.21.0-resilience-memory-widgets.py
          rm -f .github/workflows/oneoff-arbor-0.21.0-resilience-memory-widgets.yml
          find ci -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make long agent work resumable and add memory

          Release Arbor 0.21.0 with long-lived streaming, race-free Continue, expanded tool workflows, encrypted cross-chat memory, and less restrictive generated-widget UI."
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
