name: Agent patch diagnosis

on:
  push:
    branches: [agent/fix-error-release-ci]
    paths:
      - '.github/workflows/agent-patch-diagnose.yml'

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-error-release-ci
      - name: Capture branch workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          out=ci/agent-patch-diagnosis.txt
          gh run list --repo "$GITHUB_REPOSITORY" --branch agent/fix-error-release-ci --limit 10 \
            --json databaseId,name,status,conclusion,event,headSha,createdAt,url > "$out"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Agent patch recovery release' --branch agent/fix-error-release-ci --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$run_id" ]]; then
            printf '\nPatch run details:\n' >> "$out"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,jobs >> "$out" || true
            printf '\nPatch failed logs:\n' >> "$out"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed >> "$out" 2>&1 || true
          fi
          rm -f .github/workflows/agent-patch-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/agent-patch-diagnosis.txt .github/workflows/agent-patch-diagnose.yml
          git commit -m 'Capture recovery patch diagnosis'
          git push origin HEAD:agent/fix-error-release-ci
