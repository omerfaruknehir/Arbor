name: One-off Arbor 0.20.33 DSML quarantine

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/oneoff-arbor-0.20.33-dsml-quarantine.yml

permissions:
  contents: write

jobs:
  repair-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply DSML quarantine repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('ci/oneoff-arbor-0.20.33-dsml-quarantine.py')
          text = script.read_text()
          old = '''        return compact.contains("dsmltoolcalls") &&
                      (compact.contains("dsmlinvoke") || compact.contains("dsmlparameter"))'''
          new = '''        return compact.contains("dsml") &&
                      compact.contains("toolcalls") &&
                      (compact.contains("invoke") || compact.contains("parameter"))'''
          if old not in text:
              raise SystemExit('DSML protocol-hint patch anchor missing')
          script.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile ci/oneoff-arbor-0.20.33-dsml-quarantine.py
          python3 ci/oneoff-arbor-0.20.33-dsml-quarantine.py

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Build optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f ci/oneoff-arbor-0.20.33-dsml-quarantine.py
          rm -f .github/workflows/oneoff-arbor-0.20.33-dsml-quarantine.yml
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Quarantine DeepSeek DSML across text and reasoning

          Release Arbor 0.20.33 with reasoning-channel parsing, robust protocol detection, and no-leak buffering for DeepSeek tool turns."
          git push origin HEAD:main
