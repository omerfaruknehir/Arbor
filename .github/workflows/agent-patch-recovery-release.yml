name: Agent patch recovery release

on:
  push:
    branches:
      - agent/fix-error-release-ci
    paths:
      - .github/workflows/agent-patch-recovery-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-error-release-ci
      - name: Apply patch
        run: python3 ci/agent-patch-recovery-release.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          rm -f .github/workflows/agent-patch-recovery-release.yml
          rm -f ci/agent-patch-recovery-release.py
          rm -f ci/agent-main-actions-diagnosis.txt
          rm -f ci/agent-patch-diagnosis.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix recovery visibility and prepare 0.24.14'
          git push origin HEAD:agent/fix-error-release-ci
