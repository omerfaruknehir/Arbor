name: Publish Arbor 0.20.27

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-arbor-0.20.27.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified 0.20.27 artifacts
        uses: actions/download-artifact@v4
        with:
          name: arbor-release-and-reports
          path: imported
          repository: ${{ github.repository }}
          run-id: 30676214933
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.20.27
          RELEASE_COMMIT=09a183c2e08bec59f3e2b9f245396a7df5a3bce3
          mkdir -p dist reports-stage

          APK="$(find imported -type f -path '*/outputs/apk/release/*.apk' -print -quit)"
          AAB="$(find imported -type f -path '*/outputs/bundle/release/*.aab' -print -quit)"
          TEST_APK="$(find imported -type f -name '*androidTest*.apk' -print -quit)"
          TEST_REPORTS="$(find imported -type d -path '*/reports/tests' -print -quit)"
          LINT_REPORT="$(find imported -type f -name 'lint-results-release.html' -print -quit)"

          test -n "$APK" && test -n "$AAB" && test -n "$TEST_APK"
          test -n "$TEST_REPORTS" && test -n "$LINT_REPORT"

          cp "$APK" "dist/Arbor-${VERSION}-release.apk"
          cp "$AAB" "dist/Arbor-${VERSION}-release.aab"
          cp "$TEST_APK" "dist/Arbor-${VERSION}-androidTest.apk"
          cp -R "$TEST_REPORTS" reports-stage/tests
          cp "$LINT_REPORT" reports-stage/lint-results-release.html
          (cd reports-stage && zip -qr "../dist/Arbor-${VERSION}-test-reports.zip" .)

          git archive --format=zip --prefix="Arbor-${VERSION}/" "$RELEASE_COMMIT" > "dist/Arbor-${VERSION}-source.zip"
          git archive --format=tar.gz --prefix="Arbor-${VERSION}/" "$RELEASE_COMMIT" > "dist/Arbor-${VERSION}-source.tar.gz"

          cp docs/releases/RELEASE_NOTES_0.20.27.md release-notes.md
          printf '%s\n' '' '## Verification' '' '- Release unit tests passed.' '- Release lint passed.' '- Android emulator smoke tests passed.' '- Optimized APK, AAB, and instrumentation APK built successfully.' '- APK Signature Scheme v2 verified with the established update-compatible certificate SHA-256 `b9d95df7ad0661559341623227cb0cc5218524715af5d7b31af2ecd0e7d577b9`.' '' 'The installable APK intentionally uses Arbor’s established update-compatible debug certificate. It is not Google Play production signing.' >> release-notes.md

          (cd dist && sha256sum Arbor-${VERSION}-release.apk Arbor-${VERSION}-release.aab Arbor-${VERSION}-androidTest.apk Arbor-${VERSION}-source.zip Arbor-${VERSION}-source.tar.gz Arbor-${VERSION}-test-reports.zip > Arbor-${VERSION}-SHA256SUMS.txt)
          ls -lh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.20.27 dist/* \
            --target 09a183c2e08bec59f3e2b9f245396a7df5a3bce3 \
            --title "Arbor 0.20.27" \
            --notes-file release-notes.md \
            --latest
