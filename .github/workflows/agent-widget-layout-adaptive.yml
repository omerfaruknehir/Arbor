name: Apply adaptive widget layout fix

on:
  push:
    branches: [ agent/widget-layout-adaptive ]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/widget-layout-adaptive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply root-cause widget fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def append_before_last(path: str, marker: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text()
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit(f"Closing marker not found in {path}")
              p.write_text(text[:index] + addition + text[index:])

          spec = 'app/src/main/java/app/arbor/chat/widgets/ArborProgramSpec.kt'
          replace_once(spec,
          '''    val state: Map<String, String>,
              val ui: ArborProgramNode,
              val actions: Map<String, List<ArborProgramAction>>,
          ''',
          '''    val state: Map<String, String>,
              val ui: ArborProgramNode,
              val compactUi: ArborProgramNode?,
              val expandedUi: ArborProgramNode?,
              val actions: Map<String, List<ArborProgramAction>>,
          ''')
          replace_once(spec,
          '''data class ArborProgramTransition(
              val state: Map<String, String>,
              val submitMessage: String? = null,
              val refreshSources: Set<String> = emptySet(),
              val folderWrites: List<ArborFolderWriteRequest> = emptyList(),
              val openRoute: String? = null,
          )

          object ArborProgramParser {
          ''',
          '''data class ArborProgramTransition(
              val state: Map<String, String>,
              val submitMessage: String? = null,
              val refreshSources: Set<String> = emptySet(),
              val folderWrites: List<ArborFolderWriteRequest> = emptyList(),
              val openRoute: String? = null,
          )

          internal fun ArborProgramDefinition.uiFor(widthDp: Int, heightDp: Int): ArborProgramNode = when {
              widthDp < 260 || heightDp < 120 -> compactUi ?: ui
              widthDp >= 360 && heightDp >= 160 -> expandedUi ?: ui
              else -> ui
          }

          internal fun ArborProgramDefinition.uiRoots(): List<ArborProgramNode> =
              listOfNotNull(ui, compactUi, expandedUi).distinct()

          object ArborProgramParser {
          ''')
          replace_once(spec,
          '''        val uiObject = requireNotNull(root.objectOrNull("ui")) { "Program ui object is required" }
                  val ui = parseNode(uiObject, "/ui", 0)
                  val actions = parseActions(root.objectOrNull("actions") ?: JsonObject(emptyMap()))
                  validateActionReferences(ui, actions)
          ''',
          '''        val uiObject = requireNotNull(root.objectOrNull("ui")) { "Program ui object is required" }
                  val ui = parseNode(uiObject, "/ui", 0)
                  val compactUi = root.objectOrNull("compactUi")?.let { value ->
                      require(expected == ArborProgramSurface.WIDGET) { "compactUi is available only to Home widgets" }
                      parseNode(value, "/compactUi", 0)
                  }
                  val expandedUi = root.objectOrNull("expandedUi")?.let { value ->
                      require(expected == ArborProgramSurface.WIDGET) { "expandedUi is available only to Home widgets" }
                      parseNode(value, "/expandedUi", 0)
                  }
                  val actions = parseActions(root.objectOrNull("actions") ?: JsonObject(emptyMap()))
                  validateActionReferences(ui, actions)
                  compactUi?.let { validateActionReferences(it, actions) }
                  expandedUi?.let { validateActionReferences(it, actions) }
          ''')
          replace_once(spec,
          '''            state = state,
                      ui = ui,
                      actions = actions,
          ''',
          '''            state = state,
                      ui = ui,
                      compactUi = compactUi,
                      expandedUi = expandedUi,
                      actions = actions,
          ''')
          replace_once(spec,
          '''    private fun parseStyle(raw: JsonObject, path: String): ArborProgramStyle {
                  rejectUnknown(raw, STYLE_FIELDS, path)
                  val emphasis = raw.string("emphasis").lowercase().ifBlank { "normal" }
                  require(emphasis in setOf("normal", "medium", "strong")) { "$path/emphasis is invalid" }
                  val align = raw.string("align").lowercase().ifBlank { "start" }
                  require(align in setOf("start", "center", "end")) { "$path/align is invalid" }
                  return ArborProgramStyle(
                      foreground = validateColor(raw.string("foreground"), "$path/foreground"),
                      background = validateColor(raw.string("background"), "$path/background"),
                      emphasis = emphasis,
                      align = align,
                      padding = raw.number("padding", 0.0).toInt().coerceIn(0, 32),
                      gap = raw.number("gap", 8.0).toInt().coerceIn(0, 32),
                      cornerRadius = raw.number("cornerRadius", 12.0).toInt().coerceIn(0, 32),
                      fontSize = raw.number("fontSize", 0.0).toInt().coerceIn(0, 48),
                      weight = raw.number("weight", 0.0).toFloat().coerceIn(0f, 10f),
                  )
              }
          ''',
          '''    private fun parseStyle(raw: JsonObject, path: String): ArborProgramStyle {
                  rejectUnknown(raw, STYLE_FIELDS, path)
                  val declaredEmphasis = raw.string("emphasis").lowercase()
                  val fontWeight = raw.string("fontWeight").lowercase()
                  require(declaredEmphasis.isBlank() || fontWeight.isBlank()) {
                      "$path cannot define both emphasis and fontWeight"
                  }
                  val emphasis = when {
                      declaredEmphasis.isNotBlank() -> declaredEmphasis
                      fontWeight in setOf("bold", "strong", "700", "800", "900") -> "strong"
                      fontWeight in setOf("medium", "500", "600") -> "medium"
                      fontWeight in setOf("", "normal", "regular", "400") -> "normal"
                      else -> error("$path/fontWeight is invalid")
                  }
                  require(emphasis in setOf("normal", "medium", "strong")) { "$path/emphasis is invalid" }
                  require(raw["fontSize"] == null || raw["size"] == null) {
                      "$path cannot define both fontSize and size"
                  }
                  val fontSize = when {
                      raw["fontSize"] != null -> raw.number("fontSize", 0.0)
                      raw["size"] != null -> raw.number("size", 0.0)
                      else -> 0.0
                  }.toInt().coerceIn(0, 48)
                  val align = raw.string("align").lowercase().ifBlank { "start" }
                  require(align in setOf("start", "center", "end")) { "$path/align is invalid" }
                  return ArborProgramStyle(
                      foreground = validateColor(raw.string("foreground"), "$path/foreground"),
                      background = validateColor(raw.string("background"), "$path/background"),
                      emphasis = emphasis,
                      align = align,
                      padding = raw.number("padding", 0.0).toInt().coerceIn(0, 32),
                      gap = raw.number("gap", 8.0).toInt().coerceIn(0, 32),
                      cornerRadius = raw.number("cornerRadius", 12.0).toInt().coerceIn(0, 32),
                      fontSize = fontSize,
                      weight = raw.number("weight", 0.0).toFloat().coerceIn(0f, 10f),
                  )
              }
          ''')
          replace_once(spec,
          '''    private val ROOT_FIELDS = setOf("schema", "id", "title", "description", "state", "ui", "actions", "capabilities", "dataSources", "refreshMinutes")
          ''',
          '''    private val ROOT_FIELDS = setOf("schema", "id", "title", "description", "state", "ui", "compactUi", "expandedUi", "actions", "capabilities", "dataSources", "refreshMinutes")
          ''')
          replace_once(spec,
          '''    private val STYLE_FIELDS = setOf("foreground", "background", "emphasis", "align", "padding", "gap", "cornerRadius", "fontSize", "weight")
          ''',
          '''    private val STYLE_FIELDS = setOf("foreground", "background", "emphasis", "fontWeight", "align", "padding", "gap", "cornerRadius", "fontSize", "size", "weight")
          ''')

          renderer = 'app/src/main/java/app/arbor/chat/widgets/WidgetCanvasRenderer.kt'
          replace_once(renderer,
          '''        renderer.renderNode(
                      definition.ui,
                      RectF(0f, 0f, bitmap.width.toFloat(), bitmap.height.toFloat()),
                      0,
                  )
          ''',
          '''        val widthDp = (bitmap.width / renderer.densityValue).toInt()
                  val heightDp = (bitmap.height / renderer.densityValue).toInt()
                  renderer.renderNode(
                      definition.uiFor(widthDp, heightDp),
                      RectF(0f, 0f, bitmap.width.toFloat(), bitmap.height.toFloat()),
                      0,
                  )
          ''')
          replace_once(renderer,
          '''        val clippedSamples = linkedSetOf<String>()

                  fun renderNode(node: ArborProgramNode, bounds: RectF, depth: Int) {
          ''',
          '''        val clippedSamples = linkedSetOf<String>()
                  val densityValue: Float get() = density

                  fun renderNode(node: ArborProgramNode, bounds: RectF, depth: Int) {
          ''')
          replace_once(renderer,
          '''            val logicalPadding = node.style.padding.takeIf { it > 0 }
                          ?: if (depth == 0 && node.type in setOf("column", "row", "stack")) 10 else 0
          ''',
          '''            val defaultRootPadding = if (bounds.height() / density <= 120f || bounds.width() / density <= 260f) 6 else 10
                      val logicalPadding = node.style.padding.takeIf { it > 0 }
                          ?: if (depth == 0 && node.type in setOf("column", "row", "stack")) defaultRootPadding else 0
          ''')
          replace_once(renderer,
          '''        private fun renderColumn(node: ArborProgramNode, bounds: RectF, depth: Int) {
                      val visible = node.children.filter { ArborProgramRuntime.visible(it.visibleWhen, state) && !(suppressActionControls && isActionControl(it)) }
                      if (visible.isEmpty()) return
                      val gap = dp(node.style.gap)
                      val available = (bounds.height() - gap * (visible.size - 1)).coerceAtLeast(1f)
                      val weights = visible.map { childWeight(it) }
                      val total = weights.sum().takeIf { it > 0f } ?: visible.size.toFloat()
                      var top = bounds.top
                      visible.forEachIndexed { index, child ->
                          val height = if (index == visible.lastIndex) bounds.bottom - top else available * weights[index] / total
                          renderNode(child, RectF(bounds.left, top, bounds.right, top + height), depth + 1)
                          top += height + gap
                      }
                  }

                  private fun renderRow(node: ArborProgramNode, bounds: RectF, depth: Int) {
                      val visible = node.children.filter { ArborProgramRuntime.visible(it.visibleWhen, state) && !(suppressActionControls && isActionControl(it)) }
                      if (visible.isEmpty()) return
                      val gap = dp(node.style.gap)
                      val available = (bounds.width() - gap * (visible.size - 1)).coerceAtLeast(1f)
                      val weights = visible.map { childWeight(it) }
                      val total = weights.sum().takeIf { it > 0f } ?: visible.size.toFloat()
                      var left = bounds.left
                      visible.forEachIndexed { index, child ->
                          val width = if (index == visible.lastIndex) bounds.right - left else available * weights[index] / total
                          renderNode(child, RectF(left, bounds.top, left + width, bounds.bottom), depth + 1)
                          left += width + gap
                      }
                  }
          ''',
          '''        private fun renderColumn(node: ArborProgramNode, bounds: RectF, depth: Int) {
                      val visible = node.children.filter { ArborProgramRuntime.visible(it.visibleWhen, state) && !(suppressActionControls && isActionControl(it)) }
                      if (visible.isEmpty()) return
                      val gap = dp(node.style.gap)
                      val available = (bounds.height() - gap * (visible.size - 1)).coerceAtLeast(1f)
                      val heights = allocateAxis(
                          available,
                          visible.map(::preferredHeight),
                          visible.map(::childWeight),
                      )
                      var top = bounds.top
                      visible.forEachIndexed { index, child ->
                          val height = if (index == visible.lastIndex) bounds.bottom - top else heights[index]
                          renderNode(child, RectF(bounds.left, top, bounds.right, top + height), depth + 1)
                          top += height + gap
                      }
                  }

                  private fun renderRow(node: ArborProgramNode, bounds: RectF, depth: Int) {
                      val visible = node.children.filter { ArborProgramRuntime.visible(it.visibleWhen, state) && !(suppressActionControls && isActionControl(it)) }
                      if (visible.isEmpty()) return
                      val gap = dp(node.style.gap)
                      val available = (bounds.width() - gap * (visible.size - 1)).coerceAtLeast(1f)
                      val widths = allocateAxis(
                          available,
                          visible.map(::preferredWidth),
                          visible.map { child -> child.style.weight.takeIf { it > 0f } ?: if (child.type == "spacer") 1f else .05f },
                      )
                      var left = bounds.left
                      visible.forEachIndexed { index, child ->
                          val width = if (index == visible.lastIndex) bounds.right - left else widths[index]
                          renderNode(child, RectF(left, bounds.top, left + width, bounds.bottom), depth + 1)
                          left += width + gap
                      }
                  }
          ''')
          replace_once(renderer,
          '''        private fun drawMetric(node: ArborProgramNode, bounds: RectF) {
                      val labelHeight = if (node.label.isBlank()) 0f else min(bounds.height() * .28f, dp(24))
                      if (labelHeight > 0f) {
                          drawTextBlock(
                              ArborProgramRuntime.render(node.label, state),
                              RectF(bounds.left, bounds.top, bounds.right, bounds.top + labelHeight),
                              node.style.copy(fontSize = 13, emphasis = "medium", foreground = "muted"),
                              false,
