name: Apply Arbor 0.20.20 stateful restart

on:
  push:
    branches:
      - agent/stateful-icon-restart-0.20.20

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply source patch
        shell: bash
        run: |
          cat .github/patches/stateful-02020/patch-*.part > /tmp/arbor-0.20.20.patch
          sha256sum /tmp/arbor-0.20.20.patch
          git apply --check /tmp/arbor-0.20.20.patch
          git apply /tmp/arbor-0.20.20.patch
          git diff --check

      - name: Run structural validation
        shell: bash
        run: |
          ./ci/verify-third-party-licenses.sh
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main')
          xmls = list(root.rglob('*.xml'))
          for path in xmls:
              ET.parse(path)
          assert len(xmls) >= 60
          checks = {
              'app/build.gradle.kts': ['versionName = "0.20.20"', 'versionCode = 146'],
              'app/src/main/java/app/arbor/chat/MainActivity.kt': ['flushPersistentState()', 'finishAffinity()', 'ComponentName(packageName, desiredAlias)'],
              'app/src/main/java/app/arbor/chat/settings/LauncherIconSwitchReceiver.kt': ['AlarmManager.ELAPSED_REALTIME_WAKEUP', 'relaunch.send()', 'goAsync()'],
              'app/src/main/java/app/arbor/chat/settings/ComposerDraftStore.kt': ['draft.$conversationId'],
              'app/src/main/java/app/arbor/chat/settings/PersistentUiStateStore.kt': ['ChatScrollSnapshot', 'settingsScrollKey'],
              'app/src/main/java/app/arbor/chat/ui/OnboardingScreen.kt': ['HorizontalPager(', 'animateScrollToPage', 'pagerState.settledPage'],
              'app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt': ['Setup assistant', 'returnToSetup()', 'saveSettingsScrollOffset'],
              'app/src/main/res/drawable-v31/ic_arbor_background_system.xml': ['system_accent1_800', 'system_accent2_700'],
              'app/src/main/res/values-v31/styles.xml': ['Theme.Arbor.Launcher.System', '@mipmap/ic_launcher_system'],
          }
          for name, needles in checks.items():
              text = Path(name).read_text()
              for needle in needles:
                  assert needle in text, f'{name}: missing {needle}'
          print(f'Validated {len(xmls)} XML resources and {len(checks)} state contracts')
          PY

      - name: Commit clean implementation
        shell: bash
        run: |
          rm -rf .github/patches/stateful-02020
          rm -f .github/workflows/apply-stateful-02020.yml
          rm -f .github/workflows/export-stateful-02020.yml
          rm -f .github/stateful-02020-artifact.txt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add stateful launcher restart and durable drafts"
          git push
