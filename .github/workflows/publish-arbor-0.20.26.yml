name: Publish Arbor 0.20.26

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-arbor-0.20.26.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified 0.20.26 build
        uses: actions/download-artifact@v4
        with:
          name: arbor-release-and-reports
          path: imported
          repository: ${{ github.repository }}
          run-id: 30669944337
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.20.26
          RELEASE_COMMIT=c8de53de73767ca630aee2b60a0268d56fb2e0ad
          mkdir -p dist reports-stage

          cp imported/outputs/apk/release/app-release.apk "dist/Arbor-${VERSION}-release.apk"
          cp imported/outputs/bundle/release/app-release.aab "dist/Arbor-${VERSION}-release.aab"
          cp imported/outputs/apk/androidTest/debug/app-debug-androidTest.apk "dist/Arbor-${VERSION}-androidTest.apk"

          cp -R imported/reports/tests reports-stage/tests
          cp imported/reports/lint-results-release.html reports-stage/lint-results-release.html
          (cd reports-stage && zip -qr "../dist/Arbor-${VERSION}-test-reports.zip" .)

          git archive --format=zip --prefix="Arbor-${VERSION}/" "$RELEASE_COMMIT" > "dist/Arbor-${VERSION}-source.zip"
          git archive --format=tar.gz --prefix="Arbor-${VERSION}/" "$RELEASE_COMMIT" > "dist/Arbor-${VERSION}-source.tar.gz"

          cat docs/releases/RELEASE_NOTES_0.20.26.md > release-notes.md
          cat >> release-notes.md <<'EOF'

## Verification

- Release unit tests passed.
- Release lint passed.
- Android 16 emulator smoke test passed.
- Optimized APK, AAB, and instrumentation APK built successfully.
- APK Signature Scheme v2 verified with the established update-compatible certificate SHA-256 `b9d95df7ad0661559341623227cb0cc5218524715af5d7b31af2ecd0e7d577b9`.

The installable APK intentionally uses Arbor's established update-compatible debug certificate. It is not Google Play production signing.
EOF

          (cd dist && sha256sum Arbor-${VERSION}-release.apk Arbor-${VERSION}-release.aab Arbor-${VERSION}-androidTest.apk Arbor-${VERSION}-source.zip Arbor-${VERSION}-source.tar.gz Arbor-${VERSION}-test-reports.zip > Arbor-${VERSION}-SHA256SUMS.txt)

          ls -lh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.20.26
          TARGET=c8de53de73767ca630aee2b60a0268d56fb2e0ad

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Arbor 0.20.26" --notes-file release-notes.md --latest
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$TARGET" \
              --title "Arbor 0.20.26" \
              --notes-file release-notes.md \
              --latest
          fi
