name: Validate TTFT root fix PR

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/ttft-root-fix-0.23.18'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ttft-root-fix-0.23.18
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply deterministic TTFT patch
        run: |
          set -euo pipefail
          python3 ci/apply-ttft-root-fix.py
      - name: Validate source contract
        run: |
          set -euo pipefail
          grep -F 'versionCode = 187' app/build.gradle.kts
          grep -F 'versionName = "0.23.18"' app/build.gradle.kts
          grep -F 'safeVisiblePrefixLength(pending)' app/src/main/java/app/xylune/chat/provider/DsmlToolProtocol.kt
          ! grep -F 'quarantineToolText' app/src/main/java/app/xylune/chat/provider/OpenAiCompatibleProvider.kt
          grep -F 'allowModelCall = false' app/src/main/java/app/xylune/chat/generation/GenerationWorker.kt
          grep -F '.setExpedited(OutOfQuotaPolicy.RUN_AS_NON_EXPEDITED_WORK_REQUEST)' app/src/main/java/app/xylune/chat/generation/GenerationScheduler.kt
          test -f docs/releases/RELEASE_NOTES_0.23.18.md
      - name: Test, lint, and build APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Remove temporary machinery and commit validated source
        run: |
          set -euo pipefail
          rm .github/workflows/agent-ttft-root-fix.yml
          rm .github/workflows/agent-ttft-root-fix-pr.yml
          rm ci/apply-ttft-root-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix time to first token at the source'
          git push origin HEAD:agent/ttft-root-fix-0.23.18
