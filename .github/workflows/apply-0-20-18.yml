name: Apply Arbor 0.20.18 source patch

on:
  push:
    branches:
      - agent/fix-icon-kill-logo-message-truncation-0.20.18
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-arbor-0-20-18
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-icon-kill-logo-message-truncation-0.20.18
          fetch-depth: 0

      - name: Apply reviewed plain-text patch
        shell: bash
        run: |
          cat ci/agent-0.20.18.patch.* > /tmp/arbor-0.20.18.patch
          echo '6de9081277293d301f101e492eaba126f586b33f423655b83db8d6160fb4bdac  /tmp/arbor-0.20.18.patch' | sha256sum --check --strict
          git apply --check /tmp/arbor-0.20.18.patch
          git apply /tmp/arbor-0.20.18.patch
          rm ci/agent-0.20.18.patch.*
          rm .github/workflows/apply-0-20-18.yml
          git diff --check
          test "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)" = "0.20.18"
          ! grep -R "stableMessageKeysByUiIndex" app/src/main/java/app/arbor/chat/ui/ChatScreen.kt
          grep -q 'component.id == "arbor"' app/src/main/java/app/arbor/chat/ui/LicenseCatalogScreen.kt
          grep -q "ProcessLifecycleOwner" app/src/main/java/app/arbor/chat/ArborApplication.kt
          grep -q "parsedMarkdown?.takeIf { it.source == markdown }" app/src/main/java/app/arbor/chat/ui/RichMessage.kt

      - name: Commit clean source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix launcher switching, Arbor branding, and message rendering"
          git push origin HEAD:agent/fix-icon-kill-logo-message-truncation-0.20.18
