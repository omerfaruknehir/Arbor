name: Apply setup status and Dynamic icon fix

on:
  push:
    branches:
      - fix/setup-status-and-dynamic-icon-0.20.22
    paths:
      - .github/workflows/apply-setup-status-fix-0-20-22.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/setup-status-and-dynamic-icon-0.20.22
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply source patch
        run: python scripts/apply_setup_status_fix_0_20_22.py

      - name: Run release verification
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Commit verified fix
        run: |
          rm scripts/apply_setup_status_fix_0_20_22.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Acknowledge setup state and keep Dynamic icon multicolored"
          git push origin HEAD:fix/setup-status-and-dynamic-icon-0.20.22
