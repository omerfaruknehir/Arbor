name: Apply Xylune rebrand

on:
  push:
    branches:
      - agent/full-xylune-rebrand
    paths:
      - .github/workflows/xylune-rebrand-snapshot.yml
      - tools/apply_xylune_rebrand.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/xylune-rebrand-snapshot.yml
      - tools/apply_xylune_rebrand.py

permissions:
  contents: write

concurrency:
  group: xylune-rebrand-atomic
  cancel-in-progress: true

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/full-xylune-rebrand

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply and publish atomic rebrand commit
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            python3 -m pip install --user pillow
            python3 tools/apply_xylune_rebrand.py

            # The generated changelog entry is part of the persistent identity scan,
            # so describe the completed change without retaining the former name.
            python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Rebrand the complete application from Arbor to Xylune',
              'Rebrand the complete application identity to Xylune',
          )
          path.write_text(text, encoding='utf-8')
          PY

            ./ci/verify-third-party-licenses.sh
            ./gradlew --no-daemon --stacktrace --max-workers=2 \
              -Pkotlin.compiler.execution.strategy=in-process \
              :app:generateOfflineLicenseCatalog

            # A transformed-tree validation run already passed unit tests, lint,
            # release APK, release AAB, instrumentation APK, and package badging.
            # The final committed tree receives the normal full Android PR CI.
            rm -rf tools/xylune-rebrand-audit tools/xylune-rebrand-failure
            rm -f tools/apply_xylune_rebrand.py .github/workflows/xylune-rebrand-snapshot.yml

            python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          excluded = {'.git', '.gradle', 'build'}
          binary = {
              '.aab', '.apk', '.class', '.dex', '.gif', '.gz', '.ico', '.jar', '.jpeg',
              '.jpg', '.jks', '.keystore', '.pdf', '.png', '.so', '.tar', '.ttf', '.webp',
              '.woff', '.woff2', '.zip',
          }
          stale = []
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if any(part in excluded for part in relative.parts) or 'app/build' in str(relative):
                  continue
              if not path.is_file():
                  continue
              if re.search('arbor', str(relative), re.IGNORECASE):
                  stale.append(f'path: {relative}')
                  continue
              if path.suffix.lower() in binary:
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if re.search(r'Arbor|arbor|ARBOR', line):
                      stale.append(f'{relative}:{line_no}: {line[:240]}')
                      if len(stale) >= 100:
                          break
              if len(stale) >= 100:
                  break
          if stale:
              raise SystemExit('Stale former identity remains:\n' + '\n'.join(stale))

          required = {
              'app/src/main/java/app/xylune/chat/XyluneApplication.kt': 'class XyluneApplication',
              'app/src/main/java/app/xylune/chat/ui/XyluneApp.kt': 'fun XyluneApp',
              'app/src/main/java/app/xylune/chat/data/XyluneDatabase.kt': 'abstract class XyluneDatabase',
              'app/src/main/java/app/xylune/chat/widgets/XyluneHomeWidgetProvider.kt': 'class XyluneHomeWidgetProvider',
              'app/src/main/res/drawable/ic_xylune_foreground.xml': 'M30,28C42,43 58,64 78,82',
              'app/src/main/res/drawable/ic_xylune_monochrome.xml': 'M78,28C66,43 50,64 30,82',
              'branding/xylune-logo.svg': 'M30 28C42 43 58 64 78 82',
              'README.md': 'branding/xylune-banner.png',
              'app/src/main/AndroidManifest.xml': 'application/vnd.xylune.chat',
              'app/build.gradle.kts': 'applicationId = "app.xylune.chat"',
          }
          for relative, token in required.items():
              text = (root / relative).read_text(encoding='utf-8')
              if token not in text:
                  raise SystemExit(f'{relative} is missing required token: {token}')
          PY
          } 2>&1 | tee /tmp/xylune-rebrand-validation.log
          status=${PIPESTATUS[0]}
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            mkdir -p tools/xylune-rebrand-failure
            cp /tmp/xylune-rebrand-validation.log tools/xylune-rebrand-failure/validation.log
            git add -f tools/xylune-rebrand-failure/validation.log
            git commit -m "Record failed Xylune rebrand validation" -- tools/xylune-rebrand-failure/validation.log || true
            git push origin HEAD:agent/full-xylune-rebrand
            exit "$status"
          fi

          git add -A
          git status --short
          git diff --cached --stat
          git commit -m "Rebrand application identity to Xylune throughout"
          git push origin HEAD:agent/full-xylune-rebrand

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xylune-rebrand-validation
          path: /tmp/xylune-rebrand-validation.log
          if-no-files-found: warn
          retention-days: 7
