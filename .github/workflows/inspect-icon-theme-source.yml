name: Inspect icon theme source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-icon-theme-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot
        run: |
          tar --exclude=.git --exclude='**/build' -czf "$RUNNER_TEMP/arbor-source.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: arbor-icon-theme-source
          path: ${{ runner.temp }}/arbor-source.tgz
          retention-days: 1
