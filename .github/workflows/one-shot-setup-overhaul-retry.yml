name: Retry Arbor 0.20.15 setup overhaul

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-setup-overhaul-retry.yml

permissions:
  contents: write

jobs:
  recover-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Recover and apply setup overhaul
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          workflow = Path('.github/workflows/one-shot-setup-overhaul-0-20-15.yml').read_text()
          pieces = []
          collecting = False
          for line in workflow.splitlines():
              if line.strip() == 'PATCH_Z_B64: >-':
                  collecting = True
                  continue
              if collecting and line.lstrip().startswith('run: |'):
                  break
              if collecting:
                  pieces.append(line.strip())

          raw = ''.join(pieces)
          if not raw:
              raise RuntimeError('Embedded setup payload was not found')

          candidates = [raw]
          # The first transport added one Base64 character. Try each possible
          # single-character deletion; Base64 validation plus zlib checksum
          # makes the recovered script unambiguous.
          if len(raw) % 4 == 1:
              candidates = (raw[:index] + raw[index + 1:] for index in range(len(raw)))

          recovered = None
          for candidate in candidates:
              try:
                  decoded = base64.b64decode(candidate, validate=True)
                  script = zlib.decompress(decoded)
              except Exception:
                  continue
              if script.startswith(b'from pathlib import Path') and b'RELEASE_DISMISS' in script and b'ONBOARDING' in script:
                  recovered = script
                  break

          if recovered is None:
              raise RuntimeError(f'Unable to recover embedded setup payload of length {len(raw)}')

          output = Path('/tmp/fix_0_20_15.py')
          output.write_bytes(recovered)
          print(f'Recovered {len(recovered)}-byte patch script')
          PY
          python3 -m py_compile /tmp/fix_0_20_15.py
          python3 /tmp/fix_0_20_15.py
          git diff --check

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Assemble optimized release AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bundleRelease

      - name: Assemble instrumentation APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arbor-0.20.15-setup-overhaul
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-release.html

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-setup-overhaul-0-20-15.yml \
            .github/workflows/one-shot-setup-overhaul-retry.yml
          git add app/src/main/java \
            app/src/test/java/app/arbor/chat/ui/OnboardingFlowTest.kt \
            app/build.gradle.kts README.md CHANGELOG.md \
            docs/releases/RELEASE_NOTES_0.20.15.md
          git status --short
          git commit -m "Overhaul setup, themes, Linux onboarding, and popup Back"
          git push origin HEAD:main
