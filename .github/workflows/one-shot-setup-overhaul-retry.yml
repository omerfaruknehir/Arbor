name: Retry Arbor 0.20.15 setup overhaul

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-setup-overhaul-retry.yml

permissions:
  contents: write

jobs:
  recover-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct and apply setup overhaul
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          parts = sorted(Path('.github/patches/setup-overhaul').glob('part*.b64'))
          if len(parts) != 8:
              raise RuntimeError(f'Expected 8 payload chunks, found {len(parts)}')

          payload = ''.join(part.read_text() for part in parts)
          payload_hash = hashlib.sha256(payload.encode()).hexdigest()
          if len(payload) != 16008 or payload_hash != '7cc52e3c107be5f0b1e9473fd40e28c5fe8e5edc2d1af994dea38a3a4a099452':
              raise RuntimeError(f'Payload integrity failure: length={len(payload)}, sha256={payload_hash}')

          script = zlib.decompress(base64.b64decode(payload, validate=True))
          script_hash = hashlib.sha256(script).hexdigest()
          if script_hash != 'c7e105af33af96ef2941640fd6001c2eea0366ca6f017326a78372a0e6fc108f':
              raise RuntimeError(f'Patch script integrity failure: sha256={script_hash}')

          output = Path('/tmp/fix_0_20_15.py')
          output.write_bytes(script)
          print(f'Reconstructed verified {len(script)}-byte patch script')
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/fix_0_20_15.py')
          text = path.read_text()

          old = """if not changelog.startswith(anchor):
              raise RuntimeError('CHANGELOG.md anchor changed')
          write('CHANGELOG.md', entry + changelog[len(anchor):])"""
          new = """if changelog.startswith(anchor):
              changelog = changelog[len(anchor):]
          write('CHANGELOG.md', entry + changelog.lstrip('\\n'))"""
          if old not in text:
              raise RuntimeError('Changelog compatibility patch anchor changed')
          text = text.replace(old, new, 1)

          replacements = {
              "import androidx.compose.ui.platform.LocalDensity\n":
                  "import androidx.compose.ui.platform.LocalDensity\nimport androidx.compose.ui.platform.LocalLayoutDirection\n",
              "    val density = LocalDensity.current\n    val minimumBackEdgePx =":
                  "    val density = LocalDensity.current\n    val layoutDirection = LocalLayoutDirection.current\n    val minimumBackEdgePx =",
              "WindowInsets.systemGestures.getLeft(density)":
                  "WindowInsets.systemGestures.getLeft(density, layoutDirection)",
              "WindowInsets.systemGestures.getRight(density)":
                  "WindowInsets.systemGestures.getRight(density, layoutDirection)",
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise RuntimeError(f'Popup layout-direction patch anchor changed: {old_value!r}')
              text = text.replace(old_value, new_value, 1)

          path.write_text(text)
          PY
          python3 -m py_compile /tmp/fix_0_20_15.py
          python3 /tmp/fix_0_20_15.py
          git diff --check

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Assemble optimized release AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bundleRelease

      - name: Assemble instrumentation APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arbor-0.20.15-setup-overhaul
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-release.html

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-setup-overhaul-0-20-15.yml \
            .github/workflows/one-shot-setup-overhaul-retry.yml
          git rm -rf .github/patches/setup-overhaul
          git add app/src/main/java \
            app/src/test/java/app/arbor/chat/ui/OnboardingFlowTest.kt \
            app/build.gradle.kts README.md CHANGELOG.md \
            docs/releases/RELEASE_NOTES_0.20.15.md
          git status --short
          git commit -m "Overhaul setup, themes, Linux onboarding, and popup Back"
          git push origin HEAD:main
