name: Finalize Xylune 0.24.10 source changes

on:
  push:
    branches:
      - fix/search-results-stream-errors-0.24.10
    paths:
      - .github/workflows/implement-search-results-stream-errors.yml

permissions:
  contents: write

concurrency:
  group: finalize-xylune-0.24.10
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-results-stream-errors-0.24.10
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize search and stream-error source changes
        run: python3 .github/scripts/patch-search-results-stream-errors-0.24.10.py

      - name: Materialize Qwen Cloud source changes
        run: python3 .github/scripts/patch-qwen-cloud-0.24.10.py

      - name: Remove all temporary implementation scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/notes
          rm -f \
            .github/scripts/patch-search-results-stream-errors-0.24.10.py \
            .github/scripts/patch-search-results-stream-errors-core-0.24.10.py \
            .github/scripts/patch-qwen-cloud-0.24.10.py \
            .github/workflows/implement-search-results-stream-errors.yml \
            .github/workflows/implement-search-results-stream-errors-retry.yml

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified source changes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show search results, useful errors, and add Qwen Cloud"
          git push origin HEAD:fix/search-results-stream-errors-0.24.10
