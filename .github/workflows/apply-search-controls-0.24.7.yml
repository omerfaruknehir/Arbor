name: Apply search controls 0.24.7

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/apply-search-controls-0.24.7.yml

permissions:
  contents: write

concurrency:
  group: apply-search-controls-0.24.7
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract and repair the implementation script
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/search-controls-0.24.7
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/implement-search-controls-0.24.7.yml').read_text()
          start_marker = '''      - name: Apply search configuration and Markdown-link fixes
                  shell: bash
                  run: |
          '''
          start_marker = start_marker.replace('                  ', '        ')
          end_marker = '\n      - name: Verify third-party licenses\n'
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('Could not locate implementation step in original workflow')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('Could not locate end of implementation step')
          script = textwrap.dedent(workflow[start:end])

          old = '''replace_once(
              "app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt",
              '                put("max_uses", JsonPrimitive(8))',
              '                put("max_uses", JsonPrimitive(request.webSearchMaxResults.coerceIn(3, 20)))',
          )
          # There are two max_uses occurrences; replace the remaining fetch occurrence too.
          text = read("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt")
          text = text.replace('put("max_uses", JsonPrimitive(8))', 'put("max_uses", JsonPrimitive(request.webSearchMaxResults.coerceIn(3, 20)))')
          write("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt", text)
          '''
          new = '''# Both Anthropic server tools use the configured limit.
          text = read("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt")
          count = text.count('put("max_uses", JsonPrimitive(8))')
          if count != 2:
              raise SystemExit(f"Expected two Anthropic max_uses defaults, found {count}")
          text = text.replace(
              'put("max_uses", JsonPrimitive(8))',
              'put("max_uses", JsonPrimitive(request.webSearchMaxResults.coerceIn(3, 20)))',
          )
          write("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt", text)
          '''
          if script.count(old) != 1:
              raise SystemExit(f'Could not repair duplicate max_uses block; matches={script.count(old)}')
          script = script.replace(old, new, 1)
          script = script.replace(
              'Path(".github/workflows/implement-search-controls-0.24.7.yml").unlink()\n',
              '',
          )
          Path('/tmp/apply-search-controls.sh').write_text(script)
          PY
          bash -n /tmp/apply-search-controls.sh
          bash /tmp/apply-search-controls.sh

      - name: Repair generated Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          agent_path = Path("app/src/main/java/app/xylune/chat/agent/AgentTools.kt")
          agent = agent_path.read_text()
          old_call = "WebSearchResponse(query, results)"
          new_call = 'WebSearchResponse(query = query, engine = "DuckDuckGo", results = results)'
          if agent.count(old_call) != 1:
              raise SystemExit(f"Expected one legacy WebSearchResponse call, found {agent.count(old_call)}")
          agent_path.write_text(agent.replace(old_call, new_call, 1))

          client_path = Path("app/src/main/java/app/xylune/chat/agent/WebSearchClient.kt")
          client = client_path.read_text()
          regex_start = client.index("        val anchor = Regex(")
          regex_end = client.index("        return anchor.findAll", regex_start)
          regex_block = r'''        val anchor = Regex(
              """<a[^>]*class="[^"]*result__a[^"]*"[^>]*href="([^"]+)"[^>]*>([\s\S]*?)</a>""",
              RegexOption.IGNORE_CASE,
          )
          val snippet = Regex(
              """class="[^"]*result__snippet[^"]*"[^>]*>([\s\S]*?)</(?:a|div)>""",
              RegexOption.IGNORE_CASE,
          )
          '''
          client = client[:regex_start] + regex_block + client[regex_end:]
          lines = client.splitlines()
          target_indexes = [
              index for index, line in enumerate(lines)
              if "val target = Regex(" in line and "uddg" in line
          ]
          if len(target_indexes) != 1:
              raise SystemExit(f"Expected one DuckDuckGo redirect regex, found {len(target_indexes)}")
          index = target_indexes[0]
          indent = lines[index][:-len(lines[index].lstrip())]
          lines[index] = indent + 'val target = Regex("""[?&]uddg=([^&]+)""").find(decoded)?.groupValues?.get(1)'
          client_path.write_text("\n".join(lines) + "\n")

          native_path = Path("app/src/main/java/app/xylune/chat/provider/NativeWebSearchProvider.kt")
          native = native_path.read_text()
          search_call_start = native.index("        private data class SearchCall(")
          search_call_end = native.index("    }\n}\n\nprivate class GeminiNativeWebSearchTransport", search_call_start)
          search_call = native[search_call_start:search_call_end]
          source_marker = 'put("source", JsonPrimitive(sourceLabel))'
          if search_call.count(source_marker) != 1:
              raise SystemExit(
                  f"Expected one nested Anthropic source label, found {search_call.count(source_marker)}"
              )
          search_call = search_call.replace(
              source_marker,
              'put("source", JsonPrimitive("Anthropic native search"))',
              1,
          )
          native_path.write_text(native[:search_call_start] + search_call + native[search_call_end:])
          PY

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Push tested implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md docs
          git commit -m "Add configurable search backends and literal Markdown links"
          git push --force-with-lease origin HEAD:refs/heads/agent/search-controls-0.24.7
