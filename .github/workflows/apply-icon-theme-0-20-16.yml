name: Apply Arbor 0.20.16 icon themes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-icon-theme-0-20-16.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbor-0.20.16-icon-theme
  cancel-in-progress: false

jobs:
  apply-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected base and payload
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "6ba3974846d5a5329a27e38b9ca686f149f8c097"
          test "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)" = "0.20.15"
          echo "3592e1d52d35c1bd26b3fe8dacc49210f325f93076224fa8239e08c55b78521e  .github/patches/arbor-0.20.16.patch.gz" | sha256sum --check

      - name: Apply verified source patch
        shell: bash
        run: |
          gzip -dc .github/patches/arbor-0.20.16.patch.gz > "$RUNNER_TEMP/arbor.patch"
          echo "f5ac7ff636e1653909df2516807b822648c2881f7c958af57c85ad637be21cf6  $RUNNER_TEMP/arbor.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/arbor.patch"
          git apply --index "$RUNNER_TEMP/arbor.patch"
          rm -f .github/workflows/apply-icon-theme-0-20-16.yml
          rm -f .github/patches/arbor-0.20.16.patch.gz
          rmdir .github/patches 2>/dev/null || true
          git add -A
          git diff --cached --check
          test "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)" = "0.20.16"
          test "$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)" = "142"
          grep -q 'android:name=".LauncherOcean"' app/src/main/AndroidManifest.xml
          grep -q 'palettePreviewColors(option, themeMode)' app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK and AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit verified source
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add theme-matched launcher icons and accurate previews"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        shell: bash
        env:
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Arbor-0.20.16-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release/Arbor-0.20.16-release.aab
          git archive --format=zip --prefix="Arbor-0.20.16/" -o release/Arbor-0.20.16-source.zip "$FINAL_SHA"
          git archive --format=tar --prefix="Arbor-0.20.16/" "$FINAL_SHA" | gzip -n > release/Arbor-0.20.16-source.tar.gz
          (cd release && sha256sum Arbor-0.20.16-* > Arbor-0.20.16-SHA256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Arbor-v0.20.16-Android-release
          if-no-files-found: error
          path: release/*

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if gh release view v0.20.16 >/dev/null 2>&1; then
            echo "v0.20.16 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create v0.20.16 release/* \
            --target "$FINAL_SHA" \
            --title "Arbor 0.20.16" \
            --notes-file docs/releases/RELEASE_NOTES_0.20.16.md
