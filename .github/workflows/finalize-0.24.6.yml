name: Finalize Xylune 0.24.6

"on":
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-xylune-0.24.6
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and retire finalizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          current_code="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$current_version" = "0.24.5"
          test "$current_code" = "194"

          sed -i '0,/versionCode = 194/s//versionCode = 195/' app/build.gradle.kts
          sed -i '0,/versionName = "0.24.5"/s//versionName = "0.24.6"/' app/build.gradle.kts

          {
            printf '%s\n' \
              '## 0.24.6 — 2026-08-06' \
              '' \
              '- Fit every adaptive launcher foreground inside a consistent Android safe zone so the Xylune mark is fully visible in launchers, recent-app/task views, and other masked system surfaces.' \
              '- Apply the same fitted geometry to Xylune, Dynamic/System, Graphite, Ocean, Violet, Sunset, and themed monochrome launcher artwork.' \
              '- Replace Android 12+ splash use of adaptive launcher masks with dedicated palette-matched splash artwork that has additional outer spacing.' \
              ''
            cat CHANGELOG.md
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          rm .github/workflows/finalize-0.24.6.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Xylune 0.24.6 icon sizing release"
          git push

          sleep 3
          gh workflow run release.yml --ref main
