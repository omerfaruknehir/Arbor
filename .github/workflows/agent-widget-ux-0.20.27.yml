name: Build Arbor 0.20.27 widget UX

on:
  push:
    branches:
      - agent/widget-capability-ux-0.20.27

permissions:
  contents: write

concurrency:
  group: arbor-widget-capability-ux-0.20.27
  cancel-in-progress: true

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply widget capability and UX patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ""
          exec(gzip.decompress(base64.b64decode(payload)).decode(), {"__name__": "__main__"})
          PY
          git diff --check
          git status --short

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          ./ci/verify-third-party-licenses.sh
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease bundleRelease assembleDebugAndroidTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve widget capability awareness and UX"
          git push origin HEAD:agent/widget-capability-ux-0.20.27

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arbor-0.20.27
          cp app/build/outputs/apk/release/app-release.apk /tmp/arbor-0.20.27/Arbor-0.20.27-release.apk
          cp app/build/outputs/bundle/release/app-release.aab /tmp/arbor-0.20.27/Arbor-0.20.27-release.aab
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/arbor-0.20.27/Arbor-0.20.27-androidTest.apk
          git archive --format=zip --prefix=Arbor-0.20.27/ --output=/tmp/arbor-0.20.27/Arbor-0.20.27-source.zip HEAD
          git archive --format=tar.gz --prefix=Arbor-0.20.27/ --output=/tmp/arbor-0.20.27/Arbor-0.20.27-source.tar.gz HEAD
          (cd /tmp/arbor-0.20.27 && sha256sum Arbor-* > Arbor-0.20.27-SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arbor-0.20.27-widget-ux
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/arbor-0.20.27/*
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
