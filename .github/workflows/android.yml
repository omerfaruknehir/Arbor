name: Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'ci/**'
      - 'licenses/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'ci/**'
      - 'licenses/**'
  workflow_dispatch:
    inputs:
      run_device_smoke:
        description: Run the Android emulator smoke tests
        required: false
        default: false
        type: boolean
      build_release:
        description: Build protected signed release artifacts when signing secrets are configured
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
  XYLUNE_SOURCE_COMMIT: ${{ github.sha }}
  XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
  XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}

jobs:
  agent-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/image-composer-blur-height'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply composer cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/agent-composer-popup-trigger.txt
          python3 - <<'PY'
          from pathlib import Path

          chat_path = Path('app/src/main/java/app/xylune/chat/ui/ChatScreen.kt')
          chat = chat_path.read_text()

          start_marker = '                if (!imageGenerationMode) LazyRow(\n'
          end_marker = '            }\n\n            Row(verticalAlignment = Alignment.Bottom) {'
          start = chat.index(start_marker)
          end = chat.index(end_marker, start)
          chat = chat[:start] + chat[end:]

          plus_start = chat.index('    if (plusMenu) {\n')
          plus_end = chat.index('    if (sendMenu) {\n', plus_start)
          new_plus = '''    if (plusMenu) {
        ModalBottomSheet(onDismissRequest = { plusMenu = false }) {
            Column(Modifier.fillMaxWidth().padding(bottom = 24.dp)) {
                Text("Add to chat", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.SemiBold, modifier = Modifier.padding(horizontal = 24.dp, vertical = 12.dp))
                ComposerActionRow(Icons.Outlined.AttachFile, "Files", "Documents, archives, code, audio, and other supported files") {
                    plusMenu = false
                    filePicker.launch(arrayOf("*/*"))
                }
                ComposerActionRow(Icons.Outlined.Image, "Photos", "Choose one or more images") {
                    plusMenu = false
                    photoPicker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly))
                }
                ComposerActionRow(Icons.Outlined.CameraAlt, "Camera", "Take a photo and attach it") {
                    plusMenu = false
                    takePhoto()
                }
                if (!generating) conversation?.let { current ->
                    Text(
                        "Modes & tools",
                        style = MaterialTheme.typography.titleMedium,
                        fontWeight = FontWeight.SemiBold,
                        modifier = Modifier.padding(start = 24.dp, end = 24.dp, top = 16.dp, bottom = 8.dp),
                    )
                    Column(
                        Modifier.fillMaxWidth().padding(horizontal = 16.dp),
                        verticalArrangement = Arrangement.spacedBy(8.dp),
                    ) {
                        ThinkingComposerChip(
                            enabled = current.thinkingEnabled,
                            effort = current.thinkingEffort,
                            provider = provider,
                            model = model,
                            onSelection = { enabled, effort ->
                                viewModel.updateConversation {
                                    it.copy(
                                        thinkingEnabled = enabled,
                                        thinkingEffort = effort ?: it.thinkingEffort,
                                    )
                                }
                            },
                        )
                        SearchComposerChip(
                            webEnabled = current.webSearchEnabled,
                            deepResearchEnabled = current.deepResearchEnabled,
                            onSelection = { webEnabled, deepResearchEnabled ->
                                viewModel.updateConversation {
                                    it.copy(
                                        webSearchEnabled = webEnabled,
                                        deepResearchEnabled = deepResearchEnabled,
                                    )
                                }
                            },
                        )
                        ToolComposerChip(
                            pythonEnabled = current.agentPythonEnabled,
                            linuxEnabled = current.agentUbuntuEnabled,
                            linuxInstalled = linuxInstalled,
                            linuxDistributionName = linuxDistributionName,
                            onOpenLinuxSetup = onOpenLinuxSetup,
                            onPythonEnabled = { enabled ->
                                viewModel.updateConversation { it.copy(agentPythonEnabled = enabled) }
                            },
                            onLinuxEnabled = { enabled ->
                                viewModel.updateConversation { it.copy(agentUbuntuEnabled = enabled) }
                            },
                        )
                    }
                }
            }
        }
    }

'''
          chat = chat[:plus_start] + new_plus + chat[plus_end:]

          old = '''                    if (options.isEmpty()) "Thinking unavailable"
                    else "Think · ${selected?.label ?: if (effectiveEnabled) effort.composerName else "Off"}",
'''
          new = '''                    when {
                        options.isEmpty() -> "Unavailable"
                        !effectiveEnabled -> "Off"
                        else -> effectiveEffort.composerName
                    },
'''
          if chat.count(old) != 1:
              raise SystemExit(f'thinking label match count={chat.count(old)}')
          chat = chat.replace(old, new, 1)

          old = '''    val context = LocalContext.current
    val searchSettings by remember(context) {
        (context.applicationContext as app.xylune.chat.XyluneApplication)
            .container.appPreferences.webSearchSettings
    }.collectAsState()
    val label = when {
        deepResearchEnabled -> "Research · ${searchSettings.activeLabel}"
        webEnabled -> "Search · ${searchSettings.activeLabel}"
        else -> "Search off"
    }
'''
          new = '''    val label = when {
        deepResearchEnabled -> "Research"
        webEnabled -> "Search"
        else -> "Off"
    }
'''
          if chat.count(old) != 1:
              raise SystemExit(f'search label match count={chat.count(old)}')
          chat = chat.replace(old, new, 1)

          old = '''    val label = when {
        pythonEnabled && effectiveLinuxEnabled -> "Tools · 2"
        pythonEnabled -> "Tools · Code"
        effectiveLinuxEnabled -> "Tools · Linux"
        else -> "Tools off"
    }
'''
          new = '''    val label = when {
        pythonEnabled && effectiveLinuxEnabled -> "2 on"
        pythonEnabled -> "Code"
        effectiveLinuxEnabled -> "Linux"
        else -> "Off"
    }
'''
          if chat.count(old) != 1:
              raise SystemExit(f'tool label match count={chat.count(old)}')
          chat = chat.replace(old, new, 1)
          chat = chat.replace('else "Attach files, images, or a photo",', 'else "Attachments, modes, and tools",', 1)
          chat_path.write_text(chat)

          slider_path = Path('app/src/test/java/app/xylune/chat/ui/XyluneSliderTest.kt')
          slider = slider_path.read_text()
          test_start = slider.index('    @Test\n    fun composerPillsUseTheFullWidthAsTheirHorizontalGestureViewport() {')
          test_end = slider.index('    @Test\n    fun opaqueTintExplainsWhyBlurCannotBeVisible()', test_start)
          replacement = '''    @Test
    fun composerModesAndToolsLiveInThePlusMenuWithShortLabels() {
        val chat = java.io.File("src/main/java/app/xylune/chat/ui/ChatScreen.kt").readText()
        val composer = chat.substringAfter("private fun Composer(").substringBefore("private fun StagedAttachmentPreview")
        val promptArea = composer.substringBefore("if (plusMenu)")
        val plusMenu = composer.substringAfter("if (plusMenu)").substringBefore("if (sendMenu)")

        assertFalse(promptArea.contains("ThinkingComposerChip("))
        assertFalse(promptArea.contains("SearchComposerChip("))
        assertFalse(promptArea.contains("ToolComposerChip("))
        assertTrue(plusMenu.contains("Text(\"Modes & tools\""))
        assertTrue(plusMenu.contains("ThinkingComposerChip("))
        assertTrue(plusMenu.contains("SearchComposerChip("))
        assertTrue(plusMenu.contains("ToolComposerChip("))
        assertFalse(chat.contains("Think ·"))
        assertFalse(chat.contains("searchSettings.activeLabel"))
        assertFalse(chat.contains("Tools ·"))
    }

'''
          slider = slider[:test_start] + replacement + slider[test_end:]
          slider_path.write_text(slider)

          onboarding_path = Path('app/src/test/java/app/xylune/chat/ui/OnboardingFlowTest.kt')
          onboarding = onboarding_path.read_text()
          old = '''    @Test
    fun `popup back hides keyboard and ignores system edge origins`() {
        val source = java.io.File("src/main/java/app/xylune/chat/ui/ReleaseDismissPopup.kt").readText()
        assertTrue(source.contains("WindowInsets.ime.getBottom"))
        assertTrue(source.contains("keyboard?.hide()"))
        assertTrue(source.contains("startedInBackEdge"))
        assertTrue(source.contains("dismissOnClickOutside = false"))
        assertTrue(source.contains("fun XyluneAlertDialog"))
    }
'''
          new = '''    @Test
    fun `popup back remains keyboard safe while ordinary outside taps dismiss`() {
        val source = java.io.File("src/main/java/app/xylune/chat/ui/ReleaseDismissPopup.kt").readText()
        val alert = source.substringAfter("fun XyluneAlertDialog").substringBefore("/** Dropdown menu")
        val dropdown = source.substringAfter("internal fun XyluneDropdownMenu")
        assertTrue(source.contains("WindowInsets.ime.getBottom"))
        assertTrue(source.contains("keyboard?.hide()"))
        assertTrue(alert.contains("onDismissRequest = onDismissRequest"))
        assertTrue(alert.contains("dismissOnClickOutside = true"))
        assertTrue(dropdown.contains("dismissOnClickOutside: Boolean = true"))
        assertTrue(dropdown.contains("focusable = true"))
    }
'''
          if onboarding.count(old) != 1:
              raise SystemExit(f'onboarding popup test match count={onboarding.count(old)}')
          onboarding_path.write_text(onboarding.replace(old, new, 1))

          notes_path = Path('docs/releases/RELEASE_NOTES_0.24.16.md')
          notes = notes_path.read_text().rstrip()
          if '## Cleaner composer controls' not in notes:
              notes += '''

## Cleaner composer controls

Thinking, search, and execution controls now live under the + menu instead of permanently consuming a row above the prompt. Their visible labels are compact: thinking shows only the current effort, search shows Search or Research, and tools show the active tool state without redundant prefixes.

## Reliable popup dismissal

Thinking/search/tool menus, Xylune dialogs, and anchored link/source previews now use native focusable outside-tap dismissal. Tapping outside closes the popup instead of leaving it stuck on screen, while predictive Back remains keyboard-aware for dialogs.
'''
          notes_path.write_text(notes + '\n')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/android.yml
          rm -f .github/workflows/agent-composer-popup-fix.yml
          rm -f ci/agent-composer-popup-trigger.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move composer controls into plus menu and fix popup dismissal'
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh
      - name: Verify release notes are version scoped
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version"
          notes="$(bash ci/resolve-release-notes.sh "$version")"
          test -s "$notes"
      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog
      - name: Test, lint, and build public release
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"
      - name: Stage verified binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-release
          mkdir ci-release
          cp app/build/outputs/apk/release/app-release.apk ci-release/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ci-release/app-release.aab
      - uses: actions/upload-artifact@v7
        with:
          name: xylune-public-release-build
          if-no-files-found: error
          retention-days: 7
          path: |
            ci-release/app-release.apk
            ci-release/app-release.aab
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xylune-android-failure-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/reports/problems/

  detect-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect unpublished app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          published="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id" | head -n1)"
          if [[ -n "$published" ]]; then
            notes="$(bash ci/resolve-release-notes.sh "$version")"
            test -s "$notes"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; its body was synchronized to the version-specific release notes."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "$tag is unpublished and will use this verified build."
          fi

  publish-release:
    needs: [verify, detect-release]
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      XYLUNE_VERSION: ${{ needs.detect-release.outputs.version }}
      XYLUNE_TAG: ${{ needs.detect-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - uses: actions/download-artifact@v5
        with:
          name: xylune-public-release-build
          path: ci-release
      - name: Prepare fixed six-asset release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release

          apk="Xylune-${XYLUNE_VERSION}-release.apk"
          aab="Xylune-${XYLUNE_VERSION}-release.aab"
          source_zip="Xylune-${XYLUNE_VERSION}-source.zip"
          source_tar="Xylune-${XYLUNE_VERSION}-source.tar.gz"
          manifest="Xylune-${XYLUNE_VERSION}-release.json"
          checksums="Xylune-${XYLUNE_VERSION}-SHA256.txt"

          cp ci-release/app-release.apk "release/$apk"
          cp ci-release/app-release.aab "release/$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/$apk"
          git archive --format=zip --prefix="Xylune-${XYLUNE_VERSION}/" -o "release/$source_zip" "$GITHUB_SHA"
          git archive --format=tar --prefix="Xylune-${XYLUNE_VERSION}/" "$GITHUB_SHA" | gzip -n > "release/$source_tar"

          apk_sha256="$(sha256sum "release/$apk" | awk '{print $1}')"
          cert_sha256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          package_name="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "release/$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          export apk apk_sha256 cert_sha256 package_name version_code manifest

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["XYLUNE_TAG"],
              "versionName": os.environ["XYLUNE_VERSION"],
              "versionCode": int(os.environ["version_code"]),
              "packageName": os.environ["package_name"],
              "apkAsset": os.environ["apk"],
              "apkSha256": os.environ["apk_sha256"],
              "signingCertificateSha256": os.environ["cert_sha256"],
              "sourceCommit": os.environ["GITHUB_SHA"],
          }
          Path("release", os.environ["manifest"]).write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          PY

          (cd release && sha256sum "$apk" "$aab" "$source_zip" "$source_tar" "$manifest" > "$checksums")
          mapfile -t actual < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=("$apk" "$aab" "$source_zip" "$source_tar" "$manifest" "$checksums")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ ${#actual[@]} -eq 6 ]]
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(bash ci/resolve-release-notes.sh "$XYLUNE_VERSION")"
          test -s "$notes"

          mapfile -t draft_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${XYLUNE_TAG}\" and .draft == true) | .id"
          )
          for id in "${draft_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done

          if git ls-remote --exit-code --tags origin "refs/tags/${XYLUNE_TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${XYLUNE_TAG}"
          fi

          gh release create "$XYLUNE_TAG" \
            "release/Xylune-${XYLUNE_VERSION}-release.apk" \
            "release/Xylune-${XYLUNE_VERSION}-release.aab" \
            "release/Xylune-${XYLUNE_VERSION}-source.zip" \
            "release/Xylune-${XYLUNE_VERSION}-source.tar.gz" \
            "release/Xylune-${XYLUNE_VERSION}-release.json" \
            "release/Xylune-${XYLUNE_VERSION}-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Xylune ${XYLUNE_VERSION}" \
            --notes-file "$notes"

  device-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_device_smoke)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace --max-workers=2 connectedDebugAndroidTest

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh
      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XYLUNE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xylune-release.jks"
      - name: Build protected signed release
        env:
          XYLUNE_KEYSTORE_FILE: ${{ runner.temp }}/xylune-release.jks
          XYLUNE_KEYSTORE_PASSWORD: ${{ secrets.XYLUNE_KEYSTORE_PASSWORD }}
          XYLUNE_KEY_ALIAS: ${{ secrets.XYLUNE_KEY_ALIAS }}
          XYLUNE_KEY_PASSWORD: ${{ secrets.XYLUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: xylune-protected-signed-release
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
