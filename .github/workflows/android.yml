name: Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build signed release artifacts when signing secrets are configured
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh
      - name: Verify offline license catalog
        run: ./gradlew --no-daemon :app:generateOfflineLicenseCatalog
      - name: Verify optimized release build
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease bundleRelease assembleDebugAndroidTest
      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arbor-release-and-reports
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-release.html

  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh
      - name: Verify offline license catalog
        run: ./gradlew --no-daemon :app:generateOfflineLicenseCatalog
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARBOR_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arbor-release.jks"
      - name: Build signed release
        env:
          ARBOR_KEYSTORE_FILE: ${{ runner.temp }}/arbor-release.jks
          ARBOR_KEYSTORE_PASSWORD: ${{ secrets.ARBOR_KEYSTORE_PASSWORD }}
          ARBOR_KEY_ALIAS: ${{ secrets.ARBOR_KEY_ALIAS }}
          ARBOR_KEY_PASSWORD: ${{ secrets.ARBOR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: arbor-protected-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
