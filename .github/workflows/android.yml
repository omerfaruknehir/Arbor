name: Android

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'ci/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-patch:
    if: github.head_ref == 'agent/image-composer-blur-height'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply prepared composer cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/agent_composer_popup_patch.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/android.yml
          rm -f .github/workflows/agent-composer-popup-fix.yml
          rm -f ci/agent-composer-popup-trigger.txt
          rm -f ci/agent_composer_popup_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move composer controls into plus menu and fix popup dismissal'
          git push origin HEAD:${{ github.head_ref }}
