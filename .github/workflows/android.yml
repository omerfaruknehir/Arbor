name: Android

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply response continuation repair
        run: python3 ci/apply-response-resume-repair.py

      - name: Restore permanent CI and remove staging files
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/android.yml > .github/workflows/android.yml
          rm -f .github/workflows/repair-response-resume-loop.yml
          rm -f ci/apply-response-resume-repair.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'MAX_AUTOMATIC_OUTPUT_CONTINUATIONS = 3' app/src/main/java/app/arbor/chat/generation/GenerationWorker.kt
          grep -q 'continuationAssistantNodeId' app/src/main/java/app/arbor/chat/chat/ContextAssembler.kt
          grep -q 'versionName = "0.20.35"' app/build.gradle.kts

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit verified repair
        run: |
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix output-limit continuation loops"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Arbor-0.20.35-release-update-compatible.apk
          sha256sum dist/Arbor-0.20.35-release-update-compatible.apk > dist/Arbor-0.20.35-SHA256.txt
          git archive --format=zip --prefix=Arbor-0.20.35/ -o dist/Arbor-0.20.35-source.zip HEAD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arbor-0.20.35-response-resume-repair
          path: |
            dist/
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
