name: Validate stream preview hotfix PR

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - .github/workflows/agent-stream-preview-hotfix-pr.yml
      - ci/apply-stream-preview-hotfix.py

permissions:
  contents: write

env:
  XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
  XYLUNE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
  XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
  XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/stream-preview-smoothing-0.23.17'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stream-preview-smoothing-0.23.17
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply deterministic hotfix
        run: python3 ci/apply-stream-preview-hotfix.py
      - name: Validate source contract
        run: |
          set -euo pipefail
          grep -F 'versionCode = 186' app/build.gradle.kts
          grep -F 'versionName = "0.23.17"' app/build.gradle.kts
          grep -F 'StreamingPreviewStore.publish(' app/src/main/java/app/xylune/chat/generation/GenerationWorker.kt
          grep -F 'if (previewChanged) publishPreview()' app/src/main/java/app/xylune/chat/generation/GenerationWorker.kt
          grep -F 'StreamingPreviewStore.previews.collectAsStateWithLifecycle()' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'ChatFollowMaxFrameStepPx' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'ChatFollowSeekMaxFrameStepPx' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'intervalNanos: Long = 16_500_000L' app/src/main/java/app/xylune/chat/ui/StreamingMotion.kt
          grep -F 'else 16_500_000L' app/src/main/java/app/xylune/chat/ui/RichMessage.kt
          test -f app/src/main/java/app/xylune/chat/generation/StreamingPreviewStore.kt
          test -f docs/releases/RELEASE_NOTES_0.23.17.md
          ./ci/verify-third-party-licenses.sh
      - name: Test, lint, and build APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            app/build.gradle.kts \
            app/src/main/java/app/xylune/chat/generation/GenerationWorker.kt \
            app/src/main/java/app/xylune/chat/generation/StreamingPreviewStore.kt \
            app/src/main/java/app/xylune/chat/ui/ChatScreen.kt \
            app/src/main/java/app/xylune/chat/ui/RichMessage.kt \
            app/src/main/java/app/xylune/chat/ui/StreamingMotion.kt \
            app/src/test/java/app/xylune/chat/ui/StreamingMotionTest.kt \
            app/src/test/java/app/xylune/chat/ui/StreamingPreviewIntegrationTest.kt \
            docs/releases/RELEASE_NOTES_0.23.17.md
          git commit -m 'Smooth live response streaming'
          git push origin HEAD:agent/stream-preview-smoothing-0.23.17
