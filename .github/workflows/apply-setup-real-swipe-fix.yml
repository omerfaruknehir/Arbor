name: Apply setup real swipe fix

on:
  push:
    branches:
      - fix/setup-real-swipe-pager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-real-swipe-pager
          fetch-depth: 0

      - name: Replace setup navigation with an opaque swipe pager
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:140]!r}")
              file.write_text(text.replace(old, new, count))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              file.write_text(text[:start_index] + replacement + text[end_index:])

          def prepend(path: str, text: str) -> None:
              file = Path(path)
              current = file.read_text()
              if current.startswith(text):
                  return
              file.write_text(text + current)

          onboarding = "app/src/main/java/app/xylune/chat/ui/OnboardingScreen.kt"
          text = Path(onboarding).read_text()
          for line in [
              "import androidx.compose.animation.AnimatedContent\n",
              "import androidx.compose.animation.core.FastOutSlowInEasing\n",
              "import androidx.compose.animation.core.animateFloatAsState\n",
              "import androidx.compose.animation.core.tween\n",
              "import androidx.compose.animation.fadeIn\n",
              "import androidx.compose.animation.fadeOut\n",
              "import androidx.compose.animation.slideInHorizontally\n",
              "import androidx.compose.animation.slideOutHorizontally\n",
              "import androidx.compose.animation.togetherWith\n",
          ]:
              text = text.replace(line, "")
          text = text.replace(
              "package app.xylune.chat.ui\n\n",
              "package app.xylune.chat.ui\n\n"
              "import androidx.activity.compose.BackHandler\n",
              1,
          )
          text = text.replace(
              "import androidx.compose.foundation.rememberScrollState\n",
              "import androidx.compose.foundation.rememberScrollState\n"
              "import androidx.compose.foundation.pager.HorizontalPager\n"
              "import androidx.compose.foundation.pager.rememberPagerState\n",
              1,
          )
          text = text.replace(
              "import androidx.compose.runtime.LaunchedEffect\n",
              "import androidx.compose.runtime.LaunchedEffect\n"
              "import androidx.compose.runtime.rememberCoroutineScope\n",
              1,
          )
          text = text.replace(
              "import kotlinx.coroutines.flow.distinctUntilChanged\n",
              "import kotlinx.coroutines.flow.distinctUntilChanged\n"
              "import kotlinx.coroutines.launch\n",
              1,
          )
          Path(onboarding).write_text(text)

          function_start = "@Composable\ninternal fun OnboardingScreen("
          function_end = "@Composable\nprivate fun OnboardingStepActions("
          new_function = '''@Composable
          internal fun OnboardingScreen(
              viewModel: ChatViewModel,
              currentThemeMode: ThemeMode,
              currentPalette: ColorPalette,
              matchLauncherIconToPalette: Boolean,
              amoled: Boolean,
              providerCatalogDelayed: Boolean,
              configuredProviderCount: Int,
              pythonEnabled: Boolean,
              linuxEnabled: Boolean,
              linuxStatus: UbuntuRuntimeStatus,
              stepIndex: Int,
              stepOffsetFraction: Float,
              scrollOffsetForStep: (Int) -> Int,
              onPagerPositionChanged: (Int, Float) -> Unit,
              onStepScrollChanged: (Int, Int) -> Unit,
              onThemeModeChanged: (ThemeMode) -> Unit,
              onPaletteChanged: (ColorPalette) -> Unit,
              onMatchLauncherIconToPaletteChanged: (Boolean) -> Unit,
              onAmoledChanged: (Boolean) -> Unit,
              onPythonEnabledChanged: (Boolean) -> Unit,
              onLinuxEnabledChanged: (Boolean) -> Unit,
              onOpenProviderSetup: () -> Unit,
              onOpenLinuxSetup: () -> Unit,
              onSkipForNow: () -> Unit,
              onFinish: () -> Unit,
          ) {
              val steps = OnboardingStep.entries
              val initialPage = stepIndex.coerceIn(0, steps.lastIndex)
              val pageScrollStates = listOf(
                  rememberScrollState(initial = scrollOffsetForStep(0)),
                  rememberScrollState(initial = scrollOffsetForStep(1)),
                  rememberScrollState(initial = scrollOffsetForStep(2)),
                  rememberScrollState(initial = scrollOffsetForStep(3)),
                  rememberScrollState(initial = scrollOffsetForStep(4)),
              )
              val haptics = rememberXyluneHaptics()
              val coroutineScope = rememberCoroutineScope()
              val pagerState = rememberPagerState(
                  initialPage = initialPage,
                  initialPageOffsetFraction = stepOffsetFraction.coerceIn(-0.499f, 0.499f),
                  pageCount = { steps.size },
              )
              val visiblePage = pagerState.currentPage.coerceIn(0, steps.lastIndex)
              val step = steps[visiblePage]

              fun moveTo(page: Int) {
                  val target = page.coerceIn(0, steps.lastIndex)
                  coroutineScope.launch { pagerState.animateScrollToPage(target) }
              }

              LaunchedEffect(stepIndex) {
                  val target = stepIndex.coerceIn(0, steps.lastIndex)
                  if (!pagerState.isScrollInProgress &&
                      (pagerState.currentPage != target || pagerState.currentPageOffsetFraction != 0f)
                  ) {
                      pagerState.animateScrollToPage(target)
                  }
              }
              LaunchedEffect(pagerState) {
                  snapshotFlow { pagerState.currentPage to pagerState.currentPageOffsetFraction }
                      .distinctUntilChanged()
                      .collect { (page, offset) -> onPagerPositionChanged(page, offset) }
              }
              pageScrollStates.forEachIndexed { page, state ->
                  SetupScrollReporter(page, state, onStepScrollChanged)
              }

              BackHandler(enabled = visiblePage > 0) {
                  haptics.selection()
                  moveTo(visiblePage - 1)
              }

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = MaterialTheme.colorScheme.background,
                  contentColor = MaterialTheme.colorScheme.onBackground,
              ) {
                  Column(
                      Modifier
                          .fillMaxSize()
                          .windowInsetsPadding(WindowInsets.safeDrawing)
                          .padding(horizontal = 16.dp, vertical = 10.dp),
                  ) {
                      OnboardingProgressHeader(
                          currentStepIndex = visiblePage,
                          pagePosition = pagerState.currentPage + pagerState.currentPageOffsetFraction,
                          stepCount = steps.size,
                          stepTitle = step.setupTitle,
                          showBack = visiblePage > 0,
                          showLater = visiblePage < steps.lastIndex,
                          onBack = {
                              haptics.selection()
                              moveTo(visiblePage - 1)
                          },
                          onSkipForNow = {
                              haptics.selection()
                              onSkipForNow()
                          },
                      )
                      Spacer(Modifier.height(10.dp))
                      HorizontalPager(
                          state = pagerState,
                          modifier = Modifier.weight(1f).fillMaxWidth(),
                          beyondViewportPageCount = 0,
                          userScrollEnabled = true,
                          key = { steps[it] },
                      ) { page ->
                          val destination = steps[page]
                          Column(
                              Modifier
                                  .fillMaxSize()
                                  .background(MaterialTheme.colorScheme.background),
                          ) {
                              Column(
                                  Modifier
                                      .weight(1f)
                                      .fillMaxWidth()
                                      .verticalScroll(pageScrollStates[page])
                                      .padding(top = 8.dp, bottom = 16.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.spacedBy(16.dp),
                              ) {
                                  when (destination) {
                                      OnboardingStep.WELCOME -> WelcomeStep(viewModel)
                                      OnboardingStep.APPEARANCE -> AppearanceStep(
                                          currentThemeMode = currentThemeMode,
                                          currentPalette = currentPalette,
                                          matchLauncherIconToPalette = matchLauncherIconToPalette,
                                          amoled = amoled,
                                          onThemeModeChanged = {
                                              haptics.selection()
                                              onThemeModeChanged(it)
                                          },
                                          onPaletteChanged = {
                                              haptics.selection()
                                              onPaletteChanged(it)
                                          },
                                          onMatchLauncherIconToPaletteChanged = onMatchLauncherIconToPaletteChanged,
                                          onAmoledChanged = onAmoledChanged,
                                      )
                                      OnboardingStep.PROVIDER -> ProviderStep(
                                          providerCatalogDelayed = providerCatalogDelayed,
                                          configuredProviderCount = configuredProviderCount,
                                      )
                                      OnboardingStep.TOOLS -> ToolsStep(
                                          pythonEnabled = pythonEnabled,
                                          linuxEnabled = linuxEnabled,
                                          linuxStatus = linuxStatus,
                                          onPythonEnabledChanged = onPythonEnabledChanged,
                                          onLinuxEnabledChanged = onLinuxEnabledChanged,
                                      )
                                      OnboardingStep.READY -> ReadyStep(
                                          themeMode = currentThemeMode,
                                          palette = currentPalette,
                                          matchLauncherIconToPalette = matchLauncherIconToPalette,
                                          configuredProviderCount = configuredProviderCount,
                                          pythonEnabled = pythonEnabled,
                                          linuxEnabled = linuxEnabled,
                                          linuxStatus = linuxStatus,
                                      )
                                  }
                              }
                              HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant)
                              Spacer(Modifier.height(10.dp))
                              OnboardingStepActions(
                                  step = destination,
                                  configuredProviderCount = configuredProviderCount,
                                  linuxEnabled = linuxEnabled,
                                  linuxStatus = linuxStatus,
                                  onContinue = { moveTo(page + 1) },
                                  onOpenProviderSetup = onOpenProviderSetup,
                                  onOpenLinuxSetup = onOpenLinuxSetup,
                                  onFinish = onFinish,
                              )
                          }
                      }
                  }
              }
          }

          '''
          replace_between(onboarding, function_start, function_end, new_function)

          replace_exact(
              onboarding,
              "private fun OnboardingProgressHeader(\n    currentStepIndex: Int,\n    stepCount: Int,",
              "private fun OnboardingProgressHeader(\n    currentStepIndex: Int,\n    pagePosition: Float,\n    stepCount: Int,",
          )
          replace_exact(
              onboarding,
              "                val fill = animateFloatAsState(\n                    targetValue = setupProgressForSegment(currentStepIndex.toFloat(), index),\n                    animationSpec = tween(220, easing = FastOutSlowInEasing),\n                    label = \"SetupProgress$index\",\n                ).value",
              "                val fill = setupProgressForSegment(pagePosition, index)",
          )

          tests = "app/src/test/java/app/xylune/chat/ui/OnboardingFlowTest.kt"
          replace_exact(
              tests,
              "        assertTrue(source.contains(\"animateFloatAsState(\"))\n"
              "        assertTrue(source.contains(\"keepAlive = { false }\"))\n"
              "        assertTrue(source.contains(\"PredictiveNavigationHost(\"))\n"
              "        assertTrue(source.contains(\"label = \\\"XyluneSetupNavigation\\\"\"))\n"
              "        assertTrue(source.contains(\"backTarget = steps.getOrNull(currentPage - 1)\"))\n"
              "        assertTrue(source.contains(\"verticalScroll(pageScrollStates[page])\"))\n"
              "        assertTrue(source.contains(\"setupProgressForSegment(currentStepIndex.toFloat(), index)\"))\n"
              "        assertFalse(source.contains(\"HorizontalPager(\"))\n"
              "        assertFalse(source.contains(\"BackHandler(enabled = currentPage > 0)\"))",
              "        assertTrue(source.contains(\"HorizontalPager(\"))\n"
              "        assertTrue(source.contains(\"rememberPagerState(\"))\n"
              "        assertTrue(source.contains(\"userScrollEnabled = true\"))\n"
              "        assertTrue(source.contains(\"BackHandler(enabled = visiblePage > 0)\"))\n"
              "        assertTrue(source.contains(\"background(MaterialTheme.colorScheme.background)\"))\n"
              "        assertTrue(source.contains(\"pagePosition = pagerState.currentPage + pagerState.currentPageOffsetFraction\"))\n"
              "        assertTrue(source.contains(\"verticalScroll(pageScrollStates[page])\"))\n"
              "        assertTrue(source.contains(\"setupProgressForSegment(pagePosition, index)\"))\n"
              "        assertFalse(source.contains(\"PredictiveNavigationHost(\"))\n"
              "        assertFalse(source.contains(\"AnimatedContent(\"))\n"
              "        assertFalse(source.contains(\"fadeIn(\"))\n"
              "        assertFalse(source.contains(\"fadeOut(\"))",
          )

          replace_exact(
              "app/build.gradle.kts",
              "        versionCode = 175\n        versionName = \"0.23.6\"",
              "        versionCode = 176\n        versionName = \"0.23.7\"",
          )

          Path("docs/releases/RELEASE_NOTES_0.23.7.md").write_text(
              "# Xylune 0.23.7\n\n"
              "- Replace setup's two-tree transition host with a real horizontally draggable pager.\n"
              "- Give every setup page a full opaque background and remove fade, scale, and overlapping transition layers.\n"
              "- Slide the page content and its footer actions together in one surface, with direct swipe-tracked progress.\n"
              "- Preserve Skip for now, restored-backup deferral, and Settings > Finish setup behavior.\n"
          )
          prepend(
              "CHANGELOG.md",
              "## 0.23.7 — 2026-08-04\n\n"
              "- Replace overlapping setup transitions with a real opaque HorizontalPager that supports direct left/right swiping.\n"
              "- Remove setup fades and scales so each page and its actions move as one plain slide.\n\n",
          )

          Path(".github/workflows/apply-setup-real-swipe-fix.yml").unlink()
          PY

      - name: Commit pager implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use an opaque swipe pager for setup"
          git push origin HEAD:fix/setup-real-swipe-pager
