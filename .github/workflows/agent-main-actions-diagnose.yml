name: Agent main Actions diagnosis

on:
  push:
    branches: [agent/fix-error-release-ci]
    paths:
      - '.github/workflows/agent-main-actions-diagnose.yml'

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Capture recent main Android runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=ci/agent-main-actions-diagnosis.txt
          mkdir -p ci
          {
            echo 'Recent Android runs on main:'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow Android --branch main --limit 8 \
              --json databaseId,number,status,conclusion,event,headSha,createdAt,displayTitle,url
            echo
            echo 'Latest failed/cancelled main Android run:'
          } > "$out"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Android --branch main --limit 20 \
            --json databaseId,status,conclusion,event \
            --jq '[.[] | select(.event == "push" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))][0].databaseId // empty')"
          if [[ -n "$run_id" ]]; then
            {
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,number,status,conclusion,event,headSha,createdAt,updatedAt,displayTitle,url,jobs
              echo
              echo 'Failed logs:'
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true
            } >> "$out" 2>&1
          else
            echo 'No failed/cancelled/timed-out main push run found.' >> "$out"
          fi
      - name: Commit diagnosis and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-main-actions-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/agent-main-actions-diagnosis.txt .github/workflows/agent-main-actions-diagnose.yml
          git commit -m 'Capture main Android failure diagnosis'
          git push origin HEAD:agent/fix-error-release-ci
