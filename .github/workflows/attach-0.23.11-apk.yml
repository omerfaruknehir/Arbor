name: Attach Xylune 0.23.11 APK

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/attach-0.23.11-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh run download 30889205095 \
            --repo "$GITHUB_REPOSITORY" \
            --name Xylune-0.23.11-release \
            --dir artifact
          apk="$(find artifact -type f -name 'Xylune-0.23.11.apk' -print -quit)"
          sums="$(find artifact -type f -name 'SHA256SUMS.txt' -print -quit)"
          test -n "$apk" && test -f "$apk"
          test -n "$sums" && test -f "$sums"
          cp "$apk" Xylune-0.23.11.apk
          cp "$sums" SHA256SUMS-0.23.11.txt
      - name: Attach APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.23.11 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v0.23.11 \
            Xylune-0.23.11.apk \
            SHA256SUMS-0.23.11.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
