name: Publish Xylune 0.23.11

# One-shot publication workflow for the update-compatible 0.23.11 APK.
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-0.23.11.yml

permissions:
  contents: write

env:
  XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
  XYLUNE_SOURCE_COMMIT: ${{ github.sha }}
  XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
  XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release source
        run: |
          set -euo pipefail
          grep -F 'versionCode = 180' app/build.gradle.kts
          grep -F 'versionName = "0.23.11"' app/build.gradle.kts
          test -f docs/releases/RELEASE_NOTES_0.23.11.md
          ./ci/verify-third-party-licenses.sh
      - name: Restore update-compatible signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XYLUNE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xylune-release.jks"
      - name: Test, lint, and build signed APK
        env:
          XYLUNE_KEYSTORE_FILE: ${{ runner.temp }}/xylune-release.jks
          XYLUNE_KEYSTORE_PASSWORD: ${{ secrets.XYLUNE_KEYSTORE_PASSWORD }}
          XYLUNE_KEY_ALIAS: ${{ secrets.XYLUNE_KEY_ALIAS }}
          XYLUNE_KEY_PASSWORD: ${{ secrets.XYLUNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/Xylune-0.23.11.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-assets/Xylune-0.23.11.apk
          sha256sum release-assets/Xylune-0.23.11.apk > release-assets/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.23.11 >/dev/null 2>&1; then
            echo 'v0.23.11 already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create v0.23.11 \
            release-assets/Xylune-0.23.11.apk \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Xylune 0.23.11' \
            --notes-file docs/releases/RELEASE_NOTES_0.23.11.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xylune-0.23.11-release
          path: |
            release-assets/*
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
