name: Publish Xylune 0.23.17

# Reused hotfix publication workflow; keeping the path stable avoids release-file churn.
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-0.23.11.yml

permissions:
  contents: write

env:
  XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
  XYLUNE_SOURCE_COMMIT: ${{ github.sha }}
  XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
  XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release source
        run: |
          set -euo pipefail
          grep -F 'versionCode = 186' app/build.gradle.kts
          grep -F 'versionName = "0.23.17"' app/build.gradle.kts
          test -f docs/releases/RELEASE_NOTES_0.23.17.md
          grep -F 'Modifier.nestedScroll(topAppBarScrollBehavior.nestedScrollConnection)' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          ! grep -F 'ChatChromeScrollSample(' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          ! grep -F 'projectChatChromeFromScroll(' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'paging.itemCount > 0 && (snapshot == null || snapshot.atLatest)' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'Sending compacts the header' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'val targetOffset = if (uiIndex <= 0) 0f else limit' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'StreamingPreviewStore.publish(' app/src/main/java/app/xylune/chat/generation/GenerationWorker.kt
          grep -F 'if (previewChanged) publishPreview()' app/src/main/java/app/xylune/chat/generation/GenerationWorker.kt
          grep -F 'StreamingPreviewStore.previews.collectAsStateWithLifecycle()' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'ChatFollowMaxFrameStepPx' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'ChatFollowSeekMaxFrameStepPx' app/src/main/java/app/xylune/chat/ui/ChatScreen.kt
          grep -F 'intervalNanos: Long = 16_500_000L' app/src/main/java/app/xylune/chat/ui/StreamingMotion.kt
          grep -F 'else 16_500_000L' app/src/main/java/app/xylune/chat/ui/RichMessage.kt
          grep -F 'NavigationSlideFraction = 0.5f' app/src/main/java/app/xylune/chat/ui/PredictiveNavigation.kt
          grep -F 'navigationSourceAlpha' app/src/main/java/app/xylune/chat/ui/PredictiveNavigation.kt
          grep -F 'navigationDestinationAlpha' app/src/main/java/app/xylune/chat/ui/PredictiveNavigation.kt
          ./ci/verify-third-party-licenses.sh
      - name: Test, lint, and build APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest lintRelease assembleRelease
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/Xylune-0.23.17.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-assets/Xylune-0.23.17.apk
          sha256sum release-assets/Xylune-0.23.17.apk > release-assets/SHA256SUMS-0.23.17.txt
      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.23.17 >/dev/null 2>&1; then
            gh release edit v0.23.17 \
              --target "$GITHUB_SHA" \
              --title 'Xylune 0.23.17' \
              --notes-file docs/releases/RELEASE_NOTES_0.23.17.md
            gh release upload v0.23.17 \
              release-assets/Xylune-0.23.17.apk \
              release-assets/SHA256SUMS-0.23.17.txt \
              --clobber
          else
            gh release create v0.23.17 \
              release-assets/Xylune-0.23.17.apk \
              release-assets/SHA256SUMS-0.23.17.txt \
              --target "$GITHUB_SHA" \
              --title 'Xylune 0.23.17' \
              --notes-file docs/releases/RELEASE_NOTES_0.23.17.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Xylune-0.23.17-release
          path: |
            release-assets/*
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
