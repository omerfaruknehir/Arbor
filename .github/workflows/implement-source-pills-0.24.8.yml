name: Implement source pills 0.24.8

on:
  push:
    branches:
      - agent/source-pills-0.24.8
    paths:
      - .github/workflows/implement-source-pills-0.24.8.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Start source pill implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Implement compact source pills and automatic source footer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rich_path = Path('app/src/main/java/app/xylune/chat/ui/RichMessage.kt')
          rich = rich_path.read_text()

          start = rich.index('private val XyluneReferenceNotation = Regex(')
          end = rich.index('private object XyluneMarkwonCache', start)
          replacement = r'''internal data class XyluneSourceReference(
              val label: String,
              val target: String,
          )

          private val XyluneLegacyReferenceNotation = Regex(
              """\[\[(source|file)\|([^|\]]{1,160})\|([^\]]{1,1500})]]""",
              RegexOption.IGNORE_CASE,
          )
          private val XyluneCompactSourceNotation = Regex(
              """\[\[([^|\]\n]{1,160})\|(https?://[^\]\n]{1,1500})]]""",
              RegexOption.IGNORE_CASE,
          )
          private val PreparedXyluneReferenceLink = Regex(
              """\[[^\]\n]+]\(xylune-(?:source|file)://reference\?target=[^)]+\)""",
              RegexOption.IGNORE_CASE,
          )

          private val InlineMarkdownLink = Regex("!?\\[[^\\]\\n]+\\]\\([^)\\n]+\\)")
          private val ReferenceMarkdownLink = Regex("!?\\[[^\\]\\n]+\\]\\[[^\\]\\n]+\\]")
          private val AutoMarkdownLink = Regex("<(?:https?|mailto):[^>\\n]+>", RegexOption.IGNORE_CASE)

          private fun referenceMarkdownLink(kind: String, rawLabel: String, rawTarget: String): String {
              val safeLabel = rawLabel.trim().replace("[", "(").replace("]", ")")
              val label = if (safeLabel.length <= 30) safeLabel else safeLabel.take(29).trimEnd() + "…"
              val target = URLEncoder.encode(rawTarget.trim(), Charsets.UTF_8.name()).replace("+", "%20")
              return "[$label](xylune-${kind.lowercase()}://reference?target=$target)"
          }

          internal fun prepareReferenceMarkdown(markdown: String): String {
              var rendered = XyluneLegacyReferenceNotation.replace(markdown) { match ->
                  referenceMarkdownLink(
                      kind = match.groupValues[1],
                      rawLabel = match.groupValues[2],
                      rawTarget = match.groupValues[3],
                  )
              }
              rendered = XyluneCompactSourceNotation.replace(rendered) { match ->
                  referenceMarkdownLink(
                      kind = "source",
                      rawLabel = match.groupValues[1],
                      rawTarget = match.groupValues[2],
                  )
              }
              return rendered
          }

          internal fun renderMarkdownLinksLiterally(markdown: String): String {
              fun escapeDelimiters(value: String): String = buildString(value.length + 8) {
                  value.forEach { char ->
                      if (char in charArrayOf('[', ']', '(', ')', '<', '>')) append('\\')
                      append(char)
                  }
              }

              val protectedReferences = mutableListOf<String>()
              var rendered = PreparedXyluneReferenceLink.replace(prepareReferenceMarkdown(markdown)) { match ->
                  val index = protectedReferences.size
                  protectedReferences += match.value
                  "\u0001xylune-reference-$index\u0002"
              }
              rendered = InlineMarkdownLink.replace(rendered) { escapeDelimiters(it.value) }
              rendered = ReferenceMarkdownLink.replace(rendered) { escapeDelimiters(it.value) }
              rendered = AutoMarkdownLink.replace(rendered) { escapeDelimiters(it.value) }
              protectedReferences.forEachIndexed { index, reference ->
                  rendered = rendered.replace("\u0001xylune-reference-$index\u0002", reference)
              }
              return rendered
          }

          internal fun extractSourceReferences(markdown: String): List<XyluneSourceReference> {
              data class LocatedReference(val offset: Int, val reference: XyluneSourceReference)

              val located = mutableListOf<LocatedReference>()
              XyluneLegacyReferenceNotation.findAll(markdown).forEach { match ->
                  if (match.groupValues[1].equals("source", ignoreCase = true)) {
                      located += LocatedReference(
                          offset = match.range.first,
                          reference = XyluneSourceReference(
                              label = match.groupValues[2].trim(),
                              target = match.groupValues[3].trim(),
                          ),
                      )
                  }
              }
              XyluneCompactSourceNotation.findAll(markdown).forEach { match ->
                  located += LocatedReference(
                      offset = match.range.first,
                      reference = XyluneSourceReference(
                          label = match.groupValues[1].trim(),
                          target = match.groupValues[2].trim(),
                      ),
                  )
              }

              val seenTargets = linkedSetOf<String>()
              return located.sortedBy(LocatedReference::offset).mapNotNull { locatedReference ->
                  val reference = locatedReference.reference
                  if (reference.label.isBlank() || reference.target.isBlank() || !seenTargets.add(reference.target)) {
                      null
                  } else {
                      reference
                  }
              }
          }

          internal fun sourceReferencesFooterMarkdown(markdown: String): String {
              val sources = extractSourceReferences(markdown)
              if (sources.isEmpty()) return ""
              return buildString {
                  append("**Sources**\n\n")
                  sources.forEachIndexed { index, source ->
                      if (index > 0) append('\n')
                      append("- [[")
                          .append(source.label.replace("[", "(").replace("]", ")"))
                          .append('|')
                          .append(source.target)
                          .append("]]" )
                  }
              }
          }

          '''
          rich = rich[:start] + replacement + rich[end:]

          old = '    val visibleBlocks = if (staticContent) staticBlocks else blocks\n    val markwon = remember(context.applicationContext) { XyluneMarkwonCache.get(context.applicationContext) }\n'
          new = old + '    val sourceFooterMarkdown = remember(renderedText) { sourceReferencesFooterMarkdown(renderedText) }\n'
          if rich.count(old) != 1:
              raise SystemExit(f'Expected one RichMessage Markwon anchor, found {rich.count(old)}')
          rich = rich.replace(old, new, 1)

          old = '        StreamingTokenPulse(visible = streaming, modifier = Modifier.padding(top = 2.dp))\n    }\n}\n\ninternal fun generatedPreparationErrors'
          new = '''        if (!renderStreaming && sourceFooterMarkdown.isNotBlank()) {
              MarkdownBlock(
                  markwon = markwon,
                  markdown = sourceFooterMarkdown,
                  key = "$operationScope:sources-footer",
                  streaming = false,
              )
          }
          StreamingTokenPulse(visible = streaming, modifier = Modifier.padding(top = 2.dp))
      }
  }

  internal fun generatedPreparationErrors'''
          if rich.count(old) != 1:
              raise SystemExit(f'Expected one RichMessage footer anchor, found {rich.count(old)}')
          rich = rich.replace(old, new, 1)
          rich_path.write_text(rich)

          context_path = Path('app/src/main/java/app/xylune/chat/chat/ContextAssembler.kt')
          context = context_path.read_text()
          old = '''Xylune renders compact, tappable reference pills inside answers. Cite a website actually used with exactly `[[source|short source label|https://full-url]]`. Cite an uploaded or generated file actually used with exactly `[[file|short file label|file name or Xylune reference]]`. Put these notations immediately after the supported claim. Do not use a reference pill for a source you only saw in a search-results list but did not rely on. Ordinary Markdown links are allowed, but Xylune will show their destination to the user before opening them.'''
          new = '''Xylune renders compact, tappable source pills inside answers. Cite every website actually used with exactly `[[short source label|https://full-url]]`, for example `[[PNA|https://www.pna.gov.ph/index.php/articles/1281231]]`. Put each source notation immediately after the claim it supports, not in a detached citation paragraph. Cite an uploaded or generated file with exactly `[[file|short file label|file name or Xylune reference]]`. Do not cite a search-results entry that you did not open or materially rely on, and never invent a source. Xylune automatically repeats unique website sources in a Sources section at the bottom of the response, so do not manually duplicate that list. Ordinary Markdown links are not citations and are shown literally by the app.'''
          if context.count(old) != 1:
              raise SystemExit(f'Expected one deep-research citation instruction, found {context.count(old)}')
          context = context.replace(old, new, 1)

          old = '''When web or file evidence is used outside Deep Research, Xylune also supports `[[source|short source label|https://full-url]]` and `[[file|short file label|file name or Xylune reference]]`. Use these only for material actually used; Xylune renders them as tappable pills and previews ordinary links before opening them.'''
          new = '''When web or file evidence is used outside Deep Research, cite every material website immediately after its supported claim with `[[short source label|https://full-url]]`, for example `[[PNA|https://www.pna.gov.ph/index.php/articles/1281231]]`. Cite a material file with `[[file|short file label|file name or Xylune reference]]`. Use only sources actually opened or relied on, never invent citations, and do not manually create a duplicate source list: Xylune automatically repeats unique website source pills in a Sources section at the bottom. Ordinary Markdown links remain literal text rather than citations.'''
          if context.count(old) != 1:
              raise SystemExit(f'Expected one general citation instruction, found {context.count(old)}')
          context = context.replace(old, new, 1)
          context_path.write_text(context)

          test_path = Path('app/src/test/java/app/xylune/chat/ui/RichMessageReferenceTest.kt')
          tests = test_path.read_text()
          anchor = '''    @Test fun fileNotationBecomesAnXyluneFileLink() {'''
          inserted = r'''    @Test fun compactSourceNotationBecomesAnXyluneSourceLink() {
              val rendered = prepareReferenceMarkdown(
                  "Claim [[PNA|https://www.pna.gov.ph/index.php/articles/1281231]]",
              )
              assertTrue(rendered.contains("[PNA](xylune-source://reference?target="))
              assertTrue(rendered.contains("https%3A%2F%2Fwww.pna.gov.ph%2Findex.php%2Farticles%2F1281231"))
              assertFalse(rendered.contains("[[PNA|"))
          }

          @Test fun compactSourcePillsRemainClickableWhileOrdinaryMarkdownLinksStayLiteral() {
              val rendered = renderMarkdownLinksLiterally(
                  "[[PNA|https://www.pna.gov.ph/article]] and [ordinary](https://example.com)",
              )
              assertTrue(rendered.contains("[PNA](xylune-source://reference?target="))
              assertTrue(rendered.contains("\\[ordinary\\]\\(https://example.com\\)"))
          }

          @Test fun sourceFooterIsOrderedAndDeduplicatedByDestination() {
              val markdown = """First [[PNA|https://example.com/a]].
          Second [[Example|https://example.com/a]] and [[Other|https://example.com/b]]."""
              val footer = sourceReferencesFooterMarkdown(markdown)
              assertTrue(footer.startsWith("**Sources**"))
              assertEquals(1, Regex("https://example.com/a").findAll(footer).count())
              assertTrue(footer.indexOf("PNA") < footer.indexOf("Other"))
          }

          '''
          if tests.count(anchor) != 1:
              raise SystemExit(f'Expected one test insertion anchor, found {tests.count(anchor)}')
          tests = tests.replace(anchor, inserted + anchor, 1)
          test_path.write_text(tests)

          build_path = Path('app/build.gradle.kts')
          build = build_path.read_text()
          if build.count('versionCode = 196') != 1 or build.count('versionName = "0.24.7"') != 1:
              raise SystemExit('Unexpected current app version')
          build = build.replace('versionCode = 196', 'versionCode = 197', 1)
          build = build.replace('versionName = "0.24.7"', 'versionName = "0.24.8"', 1)
          build_path.write_text(build)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          changelog_path.write_text('''## 0.24.8 — 2026-08-06

- Add compact website source notation such as `[[PNA|https://example.com/article]]` and keep the earlier explicit source/file notation compatible.
- Render source references as inline tappable pills while leaving ordinary model-written Markdown links visible as literal Markdown.
- Automatically add a deduplicated Sources section at the bottom of completed answers, preserving first-use order.
- Show an anchored source preview with page title, domain, description, destination, and an explicit Open button before leaving Xylune.
- Teach supported AI providers to cite material sources immediately after the claims they support and never invent or manually duplicate the source list.

''' + changelog)

          release_notes = Path('docs/releases/RELEASE_NOTES_0.24.8.md')
          release_notes.write_text('''# Xylune 0.24.8

## Source pills and previews

Xylune now accepts compact website citations such as `[[PNA|https://www.pna.gov.ph/index.php/articles/1281231]]`. They render as tappable source pills at the correct inline claim position. The earlier `[[source|label|URL]]` and `[[file|label|target]]` forms remain supported.

Completed answers automatically receive a deduplicated **Sources** section in first-use order. Tapping an inline or bottom source pill opens an anchored preview containing the page title, domain, description, full destination, and an explicit **Open** button.

Ordinary model-written Markdown hyperlinks remain visible as literal Markdown rather than becoming unreliable clickable spans.

## AI citation instructions

Xylune now explicitly tells models to cite only pages they opened or materially used, place each source immediately after the supported claim, use compact source notation, avoid invented citations, and rely on Xylune to generate the bottom Sources section.
''')
          PY

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md docs/releases/RELEASE_NOTES_0.24.8.md
          git commit -m "Add inline source pills and automatic source lists"
          git push origin HEAD:agent/source-pills-0.24.8
