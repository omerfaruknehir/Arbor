name: Restore Arbor visuals temporarily

on:
  push:
    branches:
      - agent/full-xylune-rebrand
    paths:
      - .github/workflows/refine-xylune-icon.yml
      - tools/refine_xylune_icon.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refine-xylune-icon.yml
      - tools/refine_xylune_icon.py

permissions:
  contents: write

concurrency:
  group: restore-arbor-visuals
  cancel-in-progress: true

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-xylune-rebrand
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Arbor visuals and validate
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/refine_xylune_icon.py

          # Keep the original repository banner unchanged until a replacement
          # visual identity is explicitly approved.
          git checkout origin/main -- branding/arbor-banner.png
          rm -f branding/xylune-banner.png
          cmp branding/arbor-banner.png <(git show origin/main:branding/arbor-banner.png)

          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            testReleaseUnitTest lintRelease assembleRelease

          # GITHUB_TOKEN cannot publish workflow modifications. Keep this one-shot
          # workflow unchanged and commit only the restored visual assets/docs.
          git checkout -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            README.md \
            CHANGELOG.md \
            app/src/main/res \
            branding \
            licenses/icons/xylune.svg

          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Keep Arbor icon and banner during Xylune rebrand"
            git push origin HEAD:agent/full-xylune-rebrand
          fi
