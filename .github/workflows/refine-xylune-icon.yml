name: Refine Xylune icon

on:
  push:
    branches:
      - agent/full-xylune-rebrand
    paths:
      - .github/workflows/refine-xylune-icon.yml
      - tools/refine_xylune_icon.py

permissions:
  contents: write

concurrency:
  group: refine-xylune-icon
  cancel-in-progress: true

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-xylune-rebrand
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Refine and validate icon family
        shell: bash
        run: |
          set -euo pipefail
          banner_before="$(sha256sum branding/xylune-banner.png | awk '{print $1}')"
          python3 tools/refine_xylune_icon.py
          banner_after="$(sha256sum branding/xylune-banner.png | awk '{print $1}')"
          test "$banner_before" = "$banner_after"

          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            testReleaseUnitTest lintRelease assembleRelease

          # GITHUB_TOKEN cannot publish workflow modifications. Keep this one-shot
          # workflow unchanged and commit only icon/source asset changes.
          git checkout -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res branding/xylune-logo.svg licenses/icons/xylune.svg
          git diff --cached --stat
          git commit -m "Refine Xylune mark from original A strokes"
          git push origin HEAD:agent/full-xylune-rebrand
