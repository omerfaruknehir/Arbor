name: Apply setup spacing and empty-provider fix

on:
  push:
    branches:
      - fix/setup-spacing-empty-provider

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-spacing-empty-provider
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/apply-setup-spacing-empty-provider.py
      - name: Commit patched tree
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Space setup pages and restore empty provider actions"
          git push origin HEAD:fix/setup-spacing-empty-provider
