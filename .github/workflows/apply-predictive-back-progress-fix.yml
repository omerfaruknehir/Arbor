name: Apply predictive back progress-flow crash fix

on:
  push:
    branches:
      - fix/predictive-back-progress-flow-crash

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[predictive-flow-fix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/predictive-back-progress-flow-crash
          fetch-depth: 0

      - name: Apply guarded source and regression-test changes
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('app/src/main/java/app/xylune/chat/ui/PredictiveNavigation.kt')
          source = source_path.read_text()
          old = '''        val destinationState = latestBackTarget ?: return@PredictiveBackHandler
                  val source = currentSlot()
                  if (source.state == destinationState) return@PredictiveBackHandler
          '''.replace('                  ', '        ')
          new = '''        val destinationState = latestBackTarget
                  val source = currentSlot()
                  if (destinationState == null || source.state == destinationState) {
                      // PredictiveBackHandler can still dispatch for one frame after
                      // enabled becomes false. Its contract requires every invoked
                      // handler to collect the progress flow, even when the callback
                      // is stale and there is no valid navigation operation left.
                      events.collect {}
                      return@PredictiveBackHandler
                  }
          '''.replace('                  ', '        ')
          if source.count(old) != 1:
              raise SystemExit('PredictiveNavigation.kt guard changed; refusing an unsafe patch')
          source_path.write_text(source.replace(old, new))

          test_path = Path('app/src/test/java/app/xylune/chat/ui/PredictiveNavigationMathTest.kt')
          test = test_path.read_text()
          marker = '''    @Test
              fun cancellationBeforeFlowCompletionRollsBack() {
          '''.replace('              ', '    ')
          addition = '''    @Test
              fun stalePredictiveCallbacksStillConsumeTheProgressFlow() {
                  val source = java.io.File("src/main/java/app/xylune/chat/ui/PredictiveNavigation.kt").readText()
                  assertTrue(source.contains("if (destinationState == null || source.state == destinationState)"))
                  assertTrue(source.contains("events.collect {}"))
                  assertTrue(source.indexOf("events.collect {}") < source.indexOf("return@PredictiveBackHandler", source.indexOf("events.collect {}")))
                  assertTrue(!source.contains("latestBackTarget ?: return@PredictiveBackHandler"))
                  assertTrue(!source.contains("if (source.state == destinationState) return@PredictiveBackHandler"))
              }

              @Test
              fun cancellationBeforeFlowCompletionRollsBack() {
          '''.replace('              ', '    ')
          if test.count(marker) != 1:
              raise SystemExit('PredictiveNavigationMathTest.kt marker changed; refusing an unsafe patch')
          test_path.write_text(test.replace(marker, addition))

          patched = source_path.read_text()
          assert patched.count('events.collect {}') == 1
          assert 'latestBackTarget ?: return@PredictiveBackHandler' not in patched
          assert 'if (source.state == destinationState) return@PredictiveBackHandler' not in patched
          print('Predictive back progress-flow crash fix applied.')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-predictive-back-progress-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix stale predictive back flow crash [predictive-flow-fix-complete]"
          git push origin HEAD:fix/predictive-back-progress-flow-crash
