name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon :app:generateOfflineLicenseCatalog

      - name: Match tag to app version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version" >&2
            exit 1
          fi
          echo "ARBOR_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Verify and build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug bundleDebug assembleDebugAndroidTest

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Arbor-${ARBOR_VERSION}-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "release/Arbor-${ARBOR_VERSION}-debug.aab"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "release/Arbor-${ARBOR_VERSION}-debug-androidTest.apk"
          (
            cd release
            sha256sum * > "Arbor-${ARBOR_VERSION}-SHA256.txt"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Arbor-${{ github.ref_name }}-Android
          if-no-files-found: error
          path: release/*

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/RELEASE_NOTES_${ARBOR_VERSION}.md"
          if [[ ! -f "$notes" ]]; then
            notes="CHANGELOG.md"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "Arbor ${ARBOR_VERSION}" \
              --notes-file "$notes"
          fi
