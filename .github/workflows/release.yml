name: Release Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unpublished app version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          release_tag="v${app_version}"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          release_state="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${release_tag}\") | if .draft then \"draft\" else \"published\" end" \
              | head -n 1
          )"

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null \
            || [[ "$release_state" == "published" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$release_tag is already published; nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            if [[ "$release_state" == "draft" ]]; then
              echo "$release_tag has an incomplete draft and will be rebuilt safely."
            else
              echo "$release_tag is new and will be built."
            fi
          fi

  release:
    needs: detect_version
    if: needs.detect_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      XYLUNE_VERSION: ${{ needs.detect_version.outputs.version }}
      XYLUNE_TAG: ${{ needs.detect_version.outputs.tag }}
      XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
      XYLUNE_SOURCE_COMMIT: ${{ github.sha }}
      XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
      XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Assemble optimized release AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bundleRelease

      - name: Assemble instrumentation APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest

      - name: Verify release APK signature
        shell: bash
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Prepare fixed release asset set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release

          apk_asset="Xylune-${XYLUNE_VERSION}-release.apk"
          aab_asset="Xylune-${XYLUNE_VERSION}-release.aab"
          source_zip_asset="Xylune-${XYLUNE_VERSION}-source.zip"
          source_tar_asset="Xylune-${XYLUNE_VERSION}-source.tar.gz"
          manifest_asset="Xylune-${XYLUNE_VERSION}-release.json"
          checksum_asset="Xylune-${XYLUNE_VERSION}-SHA256.txt"

          cp app/build/outputs/apk/release/app-release.apk "release/$apk_asset"
          cp app/build/outputs/bundle/release/app-release.aab "release/$aab_asset"

          apk_sha256="$(sha256sum "release/$apk_asset" | awk '{print $1}')"
          cert_sha256="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/$apk_asset" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1
          )"
          package_name="$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "release/$apk_asset" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          export apk_asset apk_sha256 cert_sha256 package_name version_code manifest_asset

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["XYLUNE_VERSION"]
          manifest = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["XYLUNE_TAG"],
              "versionName": version,
              "versionCode": int(os.environ["version_code"]),
              "packageName": os.environ["package_name"],
              "apkAsset": os.environ["apk_asset"],
              "apkSha256": os.environ["apk_sha256"],
              "signingCertificateSha256": os.environ["cert_sha256"],
              "sourceCommit": os.environ["GITHUB_SHA"],
          }
          Path("release", os.environ["manifest_asset"]).write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

          git archive --format=zip --prefix="Xylune-${XYLUNE_VERSION}/" \
            -o "release/$source_zip_asset" "$GITHUB_SHA"
          git archive --format=tar --prefix="Xylune-${XYLUNE_VERSION}/" "$GITHUB_SHA" \
            | gzip -n > "release/$source_tar_asset"

          (
            cd release
            sha256sum \
              "$apk_asset" \
              "$aab_asset" \
              "$source_zip_asset" \
              "$source_tar_asset" \
              "$manifest_asset" \
              > "$checksum_asset"
          )

          assets=(
            "$apk_asset"
            "$aab_asset"
            "$source_zip_asset"
            "$source_tar_asset"
            "$manifest_asset"
            "$checksum_asset"
          )
          mapfile -t actual_assets < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${assets[@]}" | sort)
          if [[ ${#actual_assets[@]} -ne 6 ]]; then
            printf 'Expected exactly 6 release assets, found %d:\n' "${#actual_assets[@]}" >&2
            printf '  %s\n' "${actual_assets[@]}" >&2
            exit 1
          fi
          diff -u \
            <(printf '%s\n' "${expected_assets[@]}") \
            <(printf '%s\n' "${actual_assets[@]}")

      - uses: actions/upload-artifact@v4
        with:
          name: Xylune-${{ env.XYLUNE_TAG }}-Android-release
          if-no-files-found: error
          path: |
            release/Xylune-${{ env.XYLUNE_VERSION }}-release.apk
            release/Xylune-${{ env.XYLUNE_VERSION }}-release.aab
            release/Xylune-${{ env.XYLUNE_VERSION }}-source.zip
            release/Xylune-${{ env.XYLUNE_VERSION }}-source.tar.gz
            release/Xylune-${{ env.XYLUNE_VERSION }}-release.json
            release/Xylune-${{ env.XYLUNE_VERSION }}-SHA256.txt

      - name: Publish six assets in canonical order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/RELEASE_NOTES_${XYLUNE_VERSION}.md"
          if [[ ! -f "$notes" ]]; then
            notes="CHANGELOG.md"
          fi

          assets=(
            "Xylune-${XYLUNE_VERSION}-release.apk"
            "Xylune-${XYLUNE_VERSION}-release.aab"
            "Xylune-${XYLUNE_VERSION}-source.zip"
            "Xylune-${XYLUNE_VERSION}-source.tar.gz"
            "Xylune-${XYLUNE_VERSION}-release.json"
            "Xylune-${XYLUNE_VERSION}-SHA256.txt"
          )

          mapfile -t existing_draft_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == true and (.tag_name == \"${XYLUNE_TAG}\" or .name == \"Xylune ${XYLUNE_VERSION}\")) | .id"
          )
          for existing_release_id in "${existing_draft_ids[@]}"; do
            echo "Removing incomplete draft release ${existing_release_id} before rebuilding ${XYLUNE_TAG}."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}"
          done

          release_id="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$XYLUNE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Xylune ${XYLUNE_VERSION}" \
              -F draft=true \
              -F prerelease=false \
              --raw-field body="$(cat "$notes")" \
              --jq '.id'
          )"
          if [[ -z "$release_id" ]]; then
            echo "GitHub did not return a release ID for ${XYLUNE_TAG}." >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            encoded_asset="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$asset")"
            curl --fail-with-body --silent --show-error --retry 3 \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@release/$asset" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${encoded_asset}" \
              >/dev/null
          done

          mapfile -t remote_assets < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq 'sort_by(.id) | .[].name'
          )
          if [[ ${#remote_assets[@]} -ne 6 ]]; then
            printf 'Refusing to publish: expected 6 remote assets, found %d.\n' "${#remote_assets[@]}" >&2
            exit 1
          fi
          for index in "${!assets[@]}"; do
            if [[ "${remote_assets[$index]}" != "${assets[$index]}" ]]; then
              printf 'Refusing to publish: asset %d is %s, expected %s.\n' \
                "$((index + 1))" "${remote_assets[$index]}" "${assets[$index]}" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            >/dev/null
