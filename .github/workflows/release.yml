name: Release Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unpublished app version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          release_tag="v${app_version}"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null \
            || gh release view "$release_tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$release_tag already exists; nothing to publish."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "$release_tag is new and will be built."
          fi

  release:
    needs: detect_version
    if: needs.detect_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      XYLUNE_VERSION: ${{ needs.detect_version.outputs.version }}
      XYLUNE_TAG: ${{ needs.detect_version.outputs.tag }}
      XYLUNE_SOURCE_REPOSITORY: ${{ github.repository }}
      XYLUNE_SOURCE_COMMIT: ${{ github.sha }}
      XYLUNE_MICROSOFT_CLIENT_ID: ${{ vars.XYLUNE_MICROSOFT_CLIENT_ID }}
      XYLUNE_DROPBOX_APP_KEY: ${{ vars.XYLUNE_DROPBOX_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Assemble optimized release AAB
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bundleRelease

      - name: Assemble instrumentation APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest

      - name: Verify release APK signature
        shell: bash
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          apk_asset="Xylune-${XYLUNE_VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "release/$apk_asset"
          cp app/build/outputs/bundle/release/app-release.aab "release/Xylune-${XYLUNE_VERSION}-release.aab"
          apk_sha256="$(sha256sum "release/$apk_asset" | awk '{print $1}')"
          cert_sha256="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/$apk_asset" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1
          )"
          package_name="$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "release/$apk_asset" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          export apk_asset apk_sha256 cert_sha256 package_name version_code
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["XYLUNE_VERSION"]
          manifest = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["XYLUNE_TAG"],
              "versionName": version,
              "versionCode": int(os.environ["version_code"]),
              "packageName": os.environ["package_name"],
              "apkAsset": os.environ["apk_asset"],
              "apkSha256": os.environ["apk_sha256"],
              "signingCertificateSha256": os.environ["cert_sha256"],
              "sourceCommit": os.environ["GITHUB_SHA"],
          }
          Path(f"release/Xylune-{version}-release.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
          git archive --format=zip --prefix="Xylune-${XYLUNE_VERSION}/" \
            -o "release/Xylune-${XYLUNE_VERSION}-source.zip" "$GITHUB_SHA"
          git archive --format=tar --prefix="Xylune-${XYLUNE_VERSION}/" "$GITHUB_SHA" \
            | gzip -n > "release/Xylune-${XYLUNE_VERSION}-source.tar.gz"
          (
            cd release
            sha256sum * > "Xylune-${XYLUNE_VERSION}-SHA256.txt"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Xylune-${{ env.XYLUNE_TAG }}-Android-release
          if-no-files-found: error
          path: release/*

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/RELEASE_NOTES_${XYLUNE_VERSION}.md"
          if [[ ! -f "$notes" ]]; then
            notes="CHANGELOG.md"
          fi
          if gh release view "$XYLUNE_TAG" >/dev/null 2>&1; then
            gh release upload "$XYLUNE_TAG" release/* --clobber
          else
            gh release create "$XYLUNE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Xylune ${XYLUNE_VERSION}" \
              --notes-file "$notes"
          fi
