name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unpublished app version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          release_tag="v${app_version}"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null \
            || gh release view "$release_tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$release_tag already exists; nothing to publish."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "$release_tag is new and will be built."
          fi

  release:
    needs: detect_version
    if: needs.detect_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ARBOR_VERSION: ${{ needs.detect_version.outputs.version }}
      ARBOR_TAG: ${{ needs.detect_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Verify offline license catalog
        run: ./gradlew --no-daemon :app:generateOfflineLicenseCatalog

      - name: Verify and build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug bundleDebug assembleDebugAndroidTest

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Arbor-${ARBOR_VERSION}-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "release/Arbor-${ARBOR_VERSION}-debug.aab"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "release/Arbor-${ARBOR_VERSION}-debug-androidTest.apk"
          (
            cd release
            sha256sum * > "Arbor-${ARBOR_VERSION}-SHA256.txt"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Arbor-${{ env.ARBOR_TAG }}-Android
          if-no-files-found: error
          path: release/*

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/RELEASE_NOTES_${ARBOR_VERSION}.md"
          if [[ ! -f "$notes" ]]; then
            notes="CHANGELOG.md"
          fi
          if gh release view "$ARBOR_TAG" >/dev/null 2>&1; then
            gh release upload "$ARBOR_TAG" release/* --clobber
          else
            gh release create "$ARBOR_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Arbor ${ARBOR_VERSION}" \
              --notes-file "$notes"
          fi
