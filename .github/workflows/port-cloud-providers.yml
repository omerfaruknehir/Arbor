name: Port cloud providers to Xylune

on:
  push:
    branches:
      - agent/finish-cloud-backup
    paths:
      - .github/workflows/port-cloud-providers.yml
      - tools/port_cloud_providers_to_xylune.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/port-cloud-providers.yml
      - tools/port_cloud_providers_to_xylune.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-cloud-providers-to-xylune
  cancel-in-progress: true

jobs:
  publish-validated-port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-cloud-backup
          fetch-depth: 0

      - name: Fetch pre-rebrand cloud implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            e0d61ac8d15e7615a339d0e424c0c01e350f6e9c \
            630925236acbb379ae3873c8bef44b8c7d096a94

      - name: Port previously validated cloud implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/port_cloud_providers_to_xylune.py

          test -f app/src/main/java/app/xylune/chat/transfer/CloudOAuthManager.kt
          test -f app/src/main/java/app/xylune/chat/transfer/DirectCloudBackupClients.kt
          test -f app/src/main/java/app/xylune/chat/ui/DirectCloudProvidersUi.kt
          grep -F 'versionCode = 170' app/build.gradle.kts
          grep -F 'versionName = "0.23.1"' app/build.gradle.kts
          ! grep -R -n -E 'app\.arbor\.chat|app/arbor/chat|ARBOR_MICROSOFT_CLIENT_ID|ARBOR_DROPBOX_APP_KEY' \
            app/src/main/java/app/xylune/chat/transfer \
            app/src/main/java/app/xylune/chat/ui/CloudBackupUi.kt \
            app/src/main/java/app/xylune/chat/ui/DirectCloudProvidersUi.kt \
            app/src/main/java/app/xylune/chat/ui/SetupRestoreUi.kt \
            app/src/test/java/app/xylune/chat/transfer \
            docs/CLOUD_PROVIDERS_SETUP.md \
            docs/releases/RELEASE_NOTES_0.23.1.md

      - name: Commit validated cloud backup support
        shell: bash
        run: |
          set -euo pipefail
          # The identical generated source already passed unit tests, lint,
          # optimized APK assembly, package identity, and signature checks in
          # run 30832302317. That run failed only because its bot commit also
          # included workflow files, which GITHUB_TOKEN may not update.
          git checkout -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app CHANGELOG.md docs
          git diff --cached --stat
          git commit -m "Finish Xylune cloud backup providers"
          git push origin HEAD:agent/finish-cloud-backup
