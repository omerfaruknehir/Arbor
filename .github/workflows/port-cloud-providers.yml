name: Port cloud providers to Xylune

on:
  push:
    branches:
      - agent/finish-cloud-backup
    paths:
      - .github/workflows/port-cloud-providers.yml
      - tools/port_cloud_providers_to_xylune.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/port-cloud-providers.yml
      - tools/port_cloud_providers_to_xylune.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-cloud-providers-to-xylune
  cancel-in-progress: true

jobs:
  port-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-cloud-backup
          fetch-depth: 0

      - name: Fetch pre-rebrand cloud implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            e0d61ac8d15e7615a339d0e424c0c01e350f6e9c \
            630925236acbb379ae3873c8bef44b8c7d096a94

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Port cloud provider implementation
        run: python3 tools/port_cloud_providers_to_xylune.py

      - name: Verify licenses and offline catalog
        shell: bash
        run: |
          set -euo pipefail
          ./ci/verify-third-party-licenses.sh
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:generateOfflineLicenseCatalog

      - name: Run release unit tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            testReleaseUnitTest

      - name: Run release lint
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            lintRelease

      - name: Assemble optimized release APK
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            assembleRelease

      - name: Verify Xylune identity and cloud configuration
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > /tmp/xylune-cloud-badging.txt
          grep -F "package: name='app.xylune.chat.debug' versionCode='170' versionName='0.23.1'" /tmp/xylune-cloud-badging.txt
          grep -F "application-label:'Xylune'" /tmp/xylune-cloud-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

          test -f app/src/main/java/app/xylune/chat/transfer/CloudOAuthManager.kt
          test -f app/src/main/java/app/xylune/chat/transfer/DirectCloudBackupClients.kt
          test -f app/src/main/java/app/xylune/chat/ui/DirectCloudProvidersUi.kt
          ! grep -R -n -E 'app\.arbor\.chat|app/arbor/chat|ARBOR_MICROSOFT_CLIENT_ID|ARBOR_DROPBOX_APP_KEY' \
            app/src/main/java/app/xylune/chat/transfer \
            app/src/main/java/app/xylune/chat/ui/CloudBackupUi.kt \
            app/src/main/java/app/xylune/chat/ui/DirectCloudProvidersUi.kt \
            app/src/main/java/app/xylune/chat/ui/SetupRestoreUi.kt \
            app/src/test/java/app/xylune/chat/transfer \
            docs/CLOUD_PROVIDERS_SETUP.md \
            docs/releases/RELEASE_NOTES_0.23.1.md

      - name: Commit validated cloud backup support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No cloud provider changes were produced"
            exit 1
          fi
          git commit -m "Finish Xylune cloud backup providers"
          git push origin HEAD:agent/finish-cloud-backup
