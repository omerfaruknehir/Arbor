name: Apply Xylune 0.24.5 Pages polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'release/0.24.5-thinking-update-check' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply Pages patch
        run: |
          python3 .github/patch-pages-release-0.24.5.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/app/xylune/chat/ui/LegalWebsiteIntegrationTest.kt')
          text = path.read_text()
          replacements = {
              'fun `home uses banner and release notes expand in page`\\(\\) {':
                  'fun `home uses banner and release notes expand in page`() {',
              'assertTrue(home.contains("class="home-banner""))':
                  'assertTrue(home.contains("class=\\"home-banner\\""))',
              'assertTrue(home.contains("href="releases/""))':
                  'assertTrue(home.contains("href=\\"releases/\\""))',
          }
          for bad, good in replacements.items():
              if text.count(bad) != 1:
                  raise SystemExit(f'Expected one malformed generated test fragment, found {text.count(bad)}: {bad}')
              text = text.replace(bad, good, 1)
          path.write_text(text)
          PY

      - name: Validate JavaScript
        run: |
          node --check docs/assets/js/theme-boot.js
          node --check docs/assets/js/site.js
          node --check docs/assets/js/releases.js

      - name: Run website integration tests
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          testReleaseUnitTest
          --tests app.xylune.chat.ui.LegalWebsiteIntegrationTest

      - name: Commit Pages polish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch-pages-release-0.24.5.py .github/workflows/patch-pages-release-0.24.5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish Xylune Pages home and releases"
          git push origin HEAD:${{ github.head_ref }}
