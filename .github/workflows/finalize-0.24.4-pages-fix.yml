name: Finalize Xylune 0.24.4 Pages fix

on:
  push:
    branches:
      - fix/pages-scroll-icon-scheme
    paths:
      - .github/workflows/finalize-0.24.4-pages-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-scroll-icon-scheme
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Finalize version and release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old_code = '        versionCode = 192'
          new_code = '        versionCode = 193'
          old_name = '        versionName = "0.24.3"'
          new_name = '        versionName = "0.24.4"'
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('Expected exactly one 0.24.3 version declaration')
          build.write_text(text.replace(old_code, new_code).replace(old_name, new_name))

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          if not current.startswith('## 0.24.4'):
              entry = '\n'.join([
                  '## 0.24.4 — 2026-08-05',
                  '',
                  '- Route Privacy, Terms, and Data Deletion to the rendered Xylune Pages site and expose them under About Xylune.',
                  '- Match the website title motion to Xylune\'s Android app while confining title snap behavior to the two app-bar states.',
                  '- Show labeled App, Dark, Light, and Auto scheme controls without an empty slot when no app palette is available.',
                  '- Keep canonical branding for web themes and recolor the logo and favicon only for an app-provided palette when enabled in Xylune.',
                  '- Sort the Pages release list numerically by semantic version and fix the stale Predictive Back progress-flow crash.',
                  '',
                  '',
              ])
              changelog.write_text(entry + current)

          release_workflow = Path('.github/workflows/release.yml')
          release_text = release_workflow.read_text()
          slash = chr(92)
          old_publish = f'            -F draft=false {slash}\n            >/dev/null'
          new_publish = f'            -F draft=false {slash}\n            -f make_latest=true {slash}\n            >/dev/null'
          if new_publish not in release_text:
              if release_text.count(old_publish) != 1:
                  raise SystemExit('Could not locate canonical release publication step')
              release_workflow.write_text(release_text.replace(old_publish, new_publish))
          PY

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Commit finalized release
        shell: bash
        run: |
          rm -f .github/workflows/prepare-0.24.4.yml
          rm .github/workflows/finalize-0.24.4-pages-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            CHANGELOG.md \
            .github/workflows/release.yml \
            .github/workflows/prepare-0.24.4.yml \
            .github/workflows/finalize-0.24.4-pages-fix.yml
          git commit -m 'Finalize Xylune 0.24.4'
          git push origin HEAD:fix/pages-scroll-icon-scheme
