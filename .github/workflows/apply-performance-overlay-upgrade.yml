name: Apply performance overlay upgrade

on:
  push:
    branches:
      - agent/performance-overlay-profile-scale

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/performance-overlay-profile-scale

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def regex_replace_once(text: str, pattern: str, replacement: str, label: str, flags=0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return updated

          # --- AppPreferences: persist and normalize overlay scale.
          path = Path("app/src/main/java/app/arbor/chat/settings/AppPreferences.kt")
          text = path.read_text()
          text = replace_once(
              text,
              """    val performanceOverlayBackgroundOpacity: Float = 0.86f,
              val performanceOverlayTextOpacity: Float = 1f,
              val blurBoundaryDebugEnabled: Boolean = false,""",
              """    val performanceOverlayBackgroundOpacity: Float = 0.86f,
              val performanceOverlayTextOpacity: Float = 1f,
              val performanceOverlayScale: Float = 1f,
              val blurBoundaryDebugEnabled: Boolean = false,""",
              "DeveloperSettings scale field",
          )
          text = replace_once(
              text,
              """        performanceOverlayBackgroundOpacity = performanceOverlayBackgroundOpacity.coerceIn(0f, 1f),
              performanceOverlayTextOpacity = performanceOverlayTextOpacity.coerceIn(0f, 1f),
              blurBoundaryDebugThicknessDp = blurBoundaryDebugThicknessDp.coerceIn(1f, 8f),""",
              """        performanceOverlayBackgroundOpacity = performanceOverlayBackgroundOpacity.coerceIn(0f, 1f),
              performanceOverlayTextOpacity = performanceOverlayTextOpacity.coerceIn(0f, 1f),
              performanceOverlayScale = performanceOverlayScale.coerceIn(0.60f, 2.00f),
              blurBoundaryDebugThicknessDp = blurBoundaryDebugThicknessDp.coerceIn(1f, 8f),""",
              "DeveloperSettings scale normalization",
          )
          text = replace_once(
              text,
              """            putFloat(KEY_PERFORMANCE_OVERLAY_BACKGROUND_OPACITY, normalized.performanceOverlayBackgroundOpacity)
              putFloat(KEY_PERFORMANCE_OVERLAY_TEXT_OPACITY, normalized.performanceOverlayTextOpacity)
              putBoolean(KEY_BLUR_BOUNDARY_DEBUG_ENABLED, normalized.blurBoundaryDebugEnabled)""",
              """            putFloat(KEY_PERFORMANCE_OVERLAY_BACKGROUND_OPACITY, normalized.performanceOverlayBackgroundOpacity)
              putFloat(KEY_PERFORMANCE_OVERLAY_TEXT_OPACITY, normalized.performanceOverlayTextOpacity)
              putFloat(KEY_PERFORMANCE_OVERLAY_SCALE, normalized.performanceOverlayScale)
              putBoolean(KEY_BLUR_BOUNDARY_DEBUG_ENABLED, normalized.blurBoundaryDebugEnabled)""",
              "DeveloperSettings scale persistence",
          )
          text = replace_once(
              text,
              """        performanceOverlayBackgroundOpacity = preferences.getFloat(KEY_PERFORMANCE_OVERLAY_BACKGROUND_OPACITY, 0.86f),
              performanceOverlayTextOpacity = preferences.getFloat(KEY_PERFORMANCE_OVERLAY_TEXT_OPACITY, 1f),
              blurBoundaryDebugEnabled = preferences.getBoolean(KEY_BLUR_BOUNDARY_DEBUG_ENABLED, false),""",
              """        performanceOverlayBackgroundOpacity = preferences.getFloat(KEY_PERFORMANCE_OVERLAY_BACKGROUND_OPACITY, 0.86f),
              performanceOverlayTextOpacity = preferences.getFloat(KEY_PERFORMANCE_OVERLAY_TEXT_OPACITY, 1f),
              performanceOverlayScale = preferences.getFloat(KEY_PERFORMANCE_OVERLAY_SCALE, 1f),
              blurBoundaryDebugEnabled = preferences.getBoolean(KEY_BLUR_BOUNDARY_DEBUG_ENABLED, false),""",
              "DeveloperSettings scale read",
          )
          text = replace_once(
              text,
              """        const val KEY_PERFORMANCE_OVERLAY_BACKGROUND_OPACITY = "performance_overlay_background_opacity"
              const val KEY_PERFORMANCE_OVERLAY_TEXT_OPACITY = "performance_overlay_text_opacity"
              const val KEY_BLUR_BOUNDARY_DEBUG_ENABLED = "blur_boundary_debug_enabled"
              """,
              """        const val KEY_PERFORMANCE_OVERLAY_BACKGROUND_OPACITY = "performance_overlay_background_opacity"
              const val KEY_PERFORMANCE_OVERLAY_TEXT_OPACITY = "performance_overlay_text_opacity"
              const val KEY_PERFORMANCE_OVERLAY_SCALE = "performance_overlay_scale"
              const val KEY_BLUR_BOUNDARY_DEBUG_ENABLED = "blur_boundary_debug_enabled"
              """,
              "DeveloperSettings scale key",
          )
          path.write_text(text)

          # --- Settings UI: expose scale and describe ranked attribution.
          path = Path("app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt")
          text = path.read_text()
          text = replace_once(
              text,
              """    SettingSlider(
                  label = "Text opacity",
                  valueLabel = "${(settings.performanceOverlayTextOpacity * 100).roundToInt()}%",
                  value = settings.performanceOverlayTextOpacity,
                  onValueChange = { value -> viewModel.updateDeveloperSettings { it.copy(performanceOverlayTextOpacity = value) } },
                  valueRange = 0f..1f,
                  enabled = settings.enabled && settings.performanceOverlayEnabled,
              )
              Text(
                  "The performance overlay is visual-only and click-through. It does not intercept taps, scrolling, drawer gestures, or back navigation.",""",
              """    SettingSlider(
                  label = "Text opacity",
                  valueLabel = "${(settings.performanceOverlayTextOpacity * 100).roundToInt()}%",
                  value = settings.performanceOverlayTextOpacity,
                  onValueChange = { value -> viewModel.updateDeveloperSettings { it.copy(performanceOverlayTextOpacity = value) } },
                  valueRange = 0f..1f,
                  enabled = settings.enabled && settings.performanceOverlayEnabled,
              )
              SettingSlider(
                  label = "Overlay scale",
                  valueLabel = "${(settings.performanceOverlayScale * 100).roundToInt()}%",
                  value = settings.performanceOverlayScale,
                  onValueChange = { value -> viewModel.updateDeveloperSettings { it.copy(performanceOverlayScale = value) } },
                  valueRange = 0.60f..2.00f,
                  enabled = settings.enabled && settings.performanceOverlayEnabled,
              )
              Text(
                  "The overlay explicitly shares pointer input with the content underneath and never consumes it. Taps, scrolling, drawer gestures, and back navigation continue through the panel.",""",
              "Settings overlay scale slider",
          )
          text = replace_once(
              text,
              "Cause profiler also shows a likely bottleneck plus FrameMetrics, blur-strip, recomposition, allocation, and GC counters.",
              "Cause profiler ranks primary and secondary causes, reports confidence and severity, and shows the evidence used for attribution alongside FrameMetrics, blur, recomposition, allocation, and GC counters.",
              "Settings cause profile description",
          )
          path.write_text(text)

          # --- Root wiring: pass the scale into the overlay.
          path = Path("app/src/main/java/app/arbor/chat/ui/ArborApp.kt")
          text = path.read_text()
          text = replace_once(
              text,
              """        backgroundOpacity = settings.performanceOverlayBackgroundOpacity,
              textOpacity = settings.performanceOverlayTextOpacity,
              modifier = modifier,""",
              """        backgroundOpacity = settings.performanceOverlayBackgroundOpacity,
              textOpacity = settings.performanceOverlayTextOpacity,
              scale = settings.performanceOverlayScale,
              modifier = modifier,""",
              "Root overlay scale wiring",
          )
          path.write_text(text)

          # --- Performance overlay: ranked cause profile, scale, and explicit sibling sharing.
          path = Path("app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt")
          text = path.read_text()
          text = replace_once(
              text,
              """import androidx.compose.ui.graphics.graphicsLayer
              import androidx.compose.ui.text.font.FontFamily
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.unit.sp""",
              """import androidx.compose.ui.graphics.graphicsLayer
              import androidx.compose.ui.input.pointer.PointerEvent
              import androidx.compose.ui.input.pointer.PointerEventPass
              import androidx.compose.ui.node.ModifierNodeElement
              import androidx.compose.ui.node.PointerInputModifierNode
              import androidx.compose.ui.platform.InspectorInfo
              import androidx.compose.ui.text.font.FontFamily
              import androidx.compose.ui.unit.IntSize
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.unit.sp""",
              "Performance overlay pointer imports",
          )
          text = replace_once(
              text,
              """    val blockingGcPerSecond: Double = 0.0,
              val screenName: String = "UNKNOWN",
              val likelyBottleneck: String = "Profiler disabled",
          )""",
              """    val blockingGcPerSecond: Double = 0.0,
              val screenName: String = "UNKNOWN",
              val causeProfile: PerformanceCauseProfile = PerformanceCauseProfile.disabled(),
          )""",
              "PerformanceSnapshot cause profile",
          )

          cause_analysis = """
          internal enum class PerformanceSeverity(val displayName: String) {
              HEALTHY("Healthy"),
              NOTICE("Notice"),
              DEGRADED("Degraded"),
              SEVERE("Severe"),
          }

          internal data class PerformanceCauseProfile(
              val primaryCause: String,
              val secondaryCause: String? = null,
              val confidencePercent: Int = 0,
              val severity: PerformanceSeverity = PerformanceSeverity.HEALTHY,
              val evidence: String = "",
          ) {
              companion object {
                  fun disabled() = PerformanceCauseProfile(
                      primaryCause = "Profiler disabled",
                      confidencePercent = 0,
                      severity = PerformanceSeverity.HEALTHY,
                      evidence = "Enable Cause profiler to collect attribution data",
                  )
              }
          }

          private data class ScoredPerformanceCause(
              val label: String,
              val score: Double,
              val evidence: String,
          )

          internal fun analyzePerformanceCause(input: PerformanceCauseInput): PerformanceCauseProfile {
              val refresh = input.refreshRateHz.takeIf { it >= 30f } ?: 60f
              val budgetMs = 1_000.0 / refresh
              if (input.fps <= 0.0 && input.frameTotalMs <= 0.0) {
                  return PerformanceCauseProfile(
                      primaryCause = "Idle / no rendered frames",
                      confidencePercent = 100,
                      severity = PerformanceSeverity.HEALTHY,
                      evidence = "No rendered FrameMetrics samples in this interval",
                  )
              }

              val totalRatio = input.frameTotalMs / budgetMs
              val p95Ratio = input.frameDurationP95Ms / budgetMs
              val severity = when {
                  p95Ratio >= 3.0 || input.jankPercent >= 30.0 -> PerformanceSeverity.SEVERE
                  p95Ratio >= 2.0 || input.jankPercent >= 12.0 -> PerformanceSeverity.DEGRADED
                  p95Ratio >= 1.20 || input.jankPercent >= 3.0 -> PerformanceSeverity.NOTICE
                  else -> PerformanceSeverity.HEALTHY
              }
              val candidates = mutableListOf<ScoredPerformanceCause>()
              fun add(label: String, score: Double, evidence: String) {
                  if (score.isFinite() && score > 0.0) candidates += ScoredPerformanceCause(label, score, evidence)
              }

              val recompositions = input.appRecompositionsPerSecond + input.chatRecompositionsPerSecond
              if (input.blockingGcPerSecond >= 0.25 || input.allocationMbPerSecond >= 96.0) {
                  val score = 2.8 +
                      max(input.blockingGcPerSecond / 0.5, input.allocationMbPerSecond / 160.0)
                  add(
                      "Allocation / blocking GC pressure",
                      score,
                      "bGC ${input.blockingGcPerSecond.f1()}/s, alloc ${input.allocationMbPerSecond.f1()} MB/s",
                  )
              }
              if (recompositions > refresh * 1.5 && (totalRatio >= 0.8 || p95Ratio >= 1.2)) {
                  add(
                      "Compose state churn / recomposition",
                      1.8 + recompositions / (refresh * 3.0) + max(totalRatio - 0.8, 0.0),
                      "${recompositions.f1()} recompositions/s at ${refresh.toDouble().f0()} Hz",
                  )
              }
              if (input.blurSourceDrawsPerFrame > 1.15 && (totalRatio >= 0.8 || p95Ratio >= 1.2)) {
                  add(
                      "Duplicate content recording for blur",
                      2.4 + (input.blurSourceDrawsPerFrame - 1.15) * 1.5 + max(totalRatio - 0.8, 0.0),
                      "${input.blurSourceDrawsPerFrame.f1()} blur source traversals/frame",
                  )
              }

              val stages = buildList {
                  input.gpuMs?.let { add("GPU rendering" to it) }
                  add("Layout / measure" to input.layoutMs)
                  add("UI draw / recording" to input.drawMs)
                  add("Render command issue" to input.commandMs)
                  add("Render sync" to input.syncMs)
                  add("Buffer swap" to input.swapMs)
                  add("Animation" to input.animationMs)
                  add("Input handling" to input.inputMs)
                  if (input.blurFrames > 0L) add("Blur CPU recording / replay" to input.blurCpuMs)
              }
              val dominant = stages.maxByOrNull { it.second }
              stages.forEach { (rawLabel, durationMs) ->
                  val ratio = durationMs / budgetMs
                  if (ratio < 0.35) return@forEach
                  val label = when {
                      rawLabel == "GPU rendering" && input.blurFrames > 0L -> "GPU rendering (blur active)"
                      rawLabel == "UI draw / recording" &&
                          input.blurFrames > 0L &&
                          input.blurCpuMs >= durationMs * 0.35 -> "Blur source recording / extra draws"
                      else -> rawLabel
                  }
                  add(
                      label,
                      ratio * 1.7,
                      "${durationMs.f1()} ms of ${budgetMs.f1()} ms frame budget",
                  )
              }

              val intervalSlow = p95Ratio >= 1.45 || input.jankPercent >= 3.0
              val dominantMs = dominant?.second ?: 0.0
              if (intervalSlow && dominantMs < budgetMs * 0.62) {
                  add(
                      "Frame pacing / scheduling stalls",
                      2.0 + max(p95Ratio - 1.0, 0.0) + input.jankPercent / 20.0,
                      "p95 ${input.frameDurationP95Ms.f1()} ms, jank ${input.jankPercent.f1()}%, largest measured stage ${dominantMs.f1()} ms",
                  )
              }

              if (candidates.isEmpty()) {
                  val withinBudget = totalRatio < 1.0 && p95Ratio < 1.2 && input.jankPercent < 3.0
                  return PerformanceCauseProfile(
                      primaryCause = if (withinBudget) "Within frame budget" else "Mixed / unattributed frame work",
                      confidencePercent = if (withinBudget) 96 else 48,
                      severity = severity,
                      evidence = "total ${input.frameTotalMs.f1()} ms, p95 ${input.frameDurationP95Ms.f1()} ms, budget ${budgetMs.f1()} ms, jank ${input.jankPercent.f1()}%",
                  )
              }

              val ranked = candidates.sortedByDescending(ScoredPerformanceCause::score)
              val primary = ranked.first()
              val secondary = ranked.drop(1).firstOrNull { it.label != primary.label }
              val margin = if (secondary == null) {
                  1.0
              } else {
                  ((primary.score - secondary.score) / primary.score.coerceAtLeast(0.001)).coerceIn(0.0, 1.0)
              }
              val strength = (primary.score / 4.0).coerceIn(0.0, 1.0)
              val dataCoverage = if (input.gpuMs != null) 1.0 else 0.92
              val confidence = ((45.0 + strength * 35.0 + margin * 20.0) * dataCoverage)
                  .toInt()
                  .coerceIn(40, 99)
              val secondaryLabel = secondary
                  ?.takeIf { it.score >= primary.score * 0.45 }
                  ?.label
              return PerformanceCauseProfile(
                  primaryCause = primary.label,
                  secondaryCause = secondaryLabel,
                  confidencePercent = confidence,
                  severity = severity,
                  evidence = primary.evidence,
              )
          }

          /** Compatibility helper for callers/tests which need only the top-ranked label. */
          internal fun detectLikelyBottleneck(input: PerformanceCauseInput): String =
              analyzePerformanceCause(input).primaryCause
          """.strip()

          text = regex_replace_once(
              text,
              r'internal fun detectLikelyBottleneck\(input: PerformanceCauseInput\): String \{.*?\n\}\n\ninternal fun normalizedPerformanceIntervalMs',
              cause_analysis + "\n\ninternal fun normalizedPerformanceIntervalMs",
              "Ranked cause analyzer",
              flags=re.S,
          )
          text = replace_once(
              text,
              """internal fun normalizedPerformanceIntervalMs(value: Int): Int = value.coerceIn(250, 2_000)

          internal fun performancePercentile""",
              """internal fun normalizedPerformanceIntervalMs(value: Int): Int = value.coerceIn(250, 2_000)
          internal fun normalizedPerformanceOverlayScale(value: Float): Float = value.coerceIn(0.60f, 2.00f)

          internal fun performancePercentile""",
              "Overlay scale normalization function",
          )
          text = regex_replace_once(
              text,
              r'val cause = if \(diagnosticProfilerEnabled\) detectLikelyBottleneck\((.*?)\n            \) else "Profiler disabled"',
              r'val causeProfile = if (diagnosticProfilerEnabled) analyzePerformanceCause(\1\n            ) else PerformanceCauseProfile.disabled()',
              "Monitor cause profile wiring",
              flags=re.S,
          )
          text = replace_once(
              text,
              "                likelyBottleneck = cause,",
              "                causeProfile = causeProfile,",
              "Snapshot cause profile assignment",
          )

          overlay_block = """
          @Composable
          internal fun ArborPerformanceOverlay(
              snapshot: PerformanceSnapshot,
              detailed: Boolean,
              modifier: Modifier = Modifier,
              backgroundOpacity: Float = 0.86f,
              textOpacity: Float = 1f,
              scale: Float = 1f,
          ) {
              val panelAlpha = backgroundOpacity.coerceIn(0f, 1f)
              val uiScale = normalizedPerformanceOverlayScale(scale)
              val corner = (10f * uiScale).dp
              val secondaryText = Color.White.copy(alpha = 0.86f)
              val diagnosticText = Color.White.copy(alpha = 0.82f)
              Surface(
                  modifier = modifier
                      .performanceOverlayTouchThrough()
                      .border((1f * uiScale).dp, Color.White.copy(alpha = 0.14f * panelAlpha), corner),
                  color = Color.Black.copy(alpha = panelAlpha),
                  contentColor = Color.White,
                  shape = RoundedCornerShape(corner),
                  shadowElevation = (6f * uiScale * panelAlpha).dp,
              ) {
                  Column(
                      Modifier
                          .graphicsLayer { alpha = textOpacity.coerceIn(0f, 1f) }
                          .padding(horizontal = (9f * uiScale).dp, vertical = (7f * uiScale).dp),
                  ) {
                      Text(
                          "Render ${snapshot.appRenderedFrameRate.f0()} fps  ${snapshot.averageFrameMs.f1()} ms  J ${snapshot.jankPercent.f1()}%",
                          fontFamily = FontFamily.Monospace,
                          fontSize = (11f * uiScale).sp,
                          maxLines = 1,
                      )
                      if (detailed) {
                          Text(
                              "Display ${snapshot.displayRefreshRateHz.toDouble().f0()} Hz  Callback ${snapshot.choreographerCallbackRate.f0()}/s  Present ${snapshot.presentedFrameRate?.f0() ?: "n/a"}",
                              fontFamily = FontFamily.Monospace,
                              fontSize = (10f * uiScale).sp,
                              color = secondaryText,
                              maxLines = 1,
                          )
                          Text(
                              "FM avg ${snapshot.frameMetricsTotalMs.f1()} ms  p95 ${snapshot.p95FrameMs.f1()}  p99 ${snapshot.p99FrameMs.f1()}",
                              fontFamily = FontFamily.Monospace,
                              fontSize = (10f * uiScale).sp,
                              color = secondaryText,
                              maxLines = 1,
                          )
                          Text(
                              "CPU ${snapshot.cpuPercent.f1()}%  PSS ${snapshot.pssMb.f0()} MB  Heap ${snapshot.javaHeapMb.f0()} MB",
                              fontFamily = FontFamily.Monospace,
                              fontSize = (10f * uiScale).sp,
                              color = secondaryText,
                              maxLines = 1,
                          )
                          Text(
                              "GPU ${snapshot.gpuAverageMs?.f1() ?: "n/a"} ms  Miss/s ${snapshot.missedFramesPerSecond.f1()}  Reports ${snapshot.droppedMetricReports}",
                              fontFamily = FontFamily.Monospace,
                              fontSize = (10f * uiScale).sp,
                              color = MaterialTheme.colorScheme.primary.copy(alpha = 0.95f),
                              maxLines = 1,
                          )
                          if (snapshot.diagnosticProfilerActive) {
                              val profile = snapshot.causeProfile
                              Text(
                                  "Cause ${profile.confidencePercent}% · ${profile.severity.displayName}: ${profile.primaryCause}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (10f * uiScale).sp,
                                  color = Color(0xFFFFD180),
                                  maxLines = 1,
                              )
                              Text(
                                  "Evidence: ${profile.evidence}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (9f * uiScale).sp,
                                  color = Color(0xFFFFE0B2),
                                  maxLines = 1,
                              )
                              profile.secondaryCause?.let { secondary ->
                                  Text(
                                      "Secondary: $secondary",
                                      fontFamily = FontFamily.Monospace,
                                      fontSize = (9f * uiScale).sp,
                                      color = Color.White.copy(alpha = 0.76f),
                                      maxLines = 1,
                                  )
                              }
                              Text(
                                  "FM ${snapshot.frameMetricsTotalMs.f1()}  L ${snapshot.layoutMeasureMs.f1()}  D ${snapshot.drawMs.f1()}  Cmd ${snapshot.commandIssueMs.f1()}  Sw ${snapshot.swapBuffersMs.f1()}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (9f * uiScale).sp,
                                  color = diagnosticText,
                                  maxLines = 1,
                              )
                              Text(
                                  "BlurCPU ${snapshot.blurCpuMsPerFrame.f2()}  ${snapshot.blurFilteredMegapixelsPerSecond.f0()} MP/s  srcTrav×${snapshot.blurSourceDrawsPerFrame.f1()} replay×${snapshot.blurLayerReplaysPerFrame.f1()}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (9f * uiScale).sp,
                                  color = diagnosticText,
                                  maxLines = 1,
                              )
                              Text(
                                  "cap/s ${snapshot.blurCaptureUpdatesPerSecond.f1()} fx/s ${snapshot.blurEffectBuildsPerSecond.f1()}  levels D${snapshot.blurDownsampleLevels.f1()}/U${snapshot.blurUpsampleLevels.f1()}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (9f * uiScale).sp,
                                  color = diagnosticText,
                                  maxLines = 1,
                              )
                              Text(
                                  "Recomp/s app ${snapshot.appRecompositionsPerSecond.f1()} chat ${snapshot.chatRecompositionsPerSecond.f1()}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (9f * uiScale).sp,
                                  color = diagnosticText,
                                  maxLines = 1,
                              )
                              Text(
                                  "Alloc ${snapshot.allocationMbPerSecond.f1()} MB/s  bGC ${snapshot.blockingGcPerSecond.f1()}  Screen ${snapshot.screenName}",
                                  fontFamily = FontFamily.Monospace,
                                  fontSize = (9f * uiScale).sp,
                                  color = Color.White.copy(alpha = 0.68f),
                                  maxLines = 1,
                              )
                          }
                      }
                  }
              }
          }

          /**
           * Makes the visual overlay an explicit hit-test participant which shares every event
           * with the sibling underneath and never consumes any change. This is stronger than
           * merely omitting clickable/pointerInput: overlapping sibling hit testing is now
           * guaranteed for scroll, tap, drawer-edge, and stylus input which starts on the panel.
           */
          private class PerformanceOverlayTouchThroughNode : Modifier.Node(), PointerInputModifierNode {
              override fun sharePointerInputWithSiblings(): Boolean = true
              override fun onPointerEvent(
                  pointerEvent: PointerEvent,
                  pass: PointerEventPass,
                  bounds: IntSize,
              ) = Unit
              override fun onCancelPointerInput() = Unit
          }

          private class PerformanceOverlayTouchThroughElement :
              ModifierNodeElement<PerformanceOverlayTouchThroughNode>() {
              override fun create(): PerformanceOverlayTouchThroughNode = PerformanceOverlayTouchThroughNode()
              override fun update(node: PerformanceOverlayTouchThroughNode) = Unit
              override fun InspectorInfo.inspectableProperties() {
                  name = "performanceOverlayTouchThrough"
              }
              override fun equals(other: Any?): Boolean = other is PerformanceOverlayTouchThroughElement
              override fun hashCode(): Int = javaClass.hashCode()
          }

          private fun Modifier.performanceOverlayTouchThrough(): Modifier =
              this then PerformanceOverlayTouchThroughElement()
          """.strip()

          text = regex_replace_once(
              text,
              r'@Composable\ninternal fun ArborPerformanceOverlay\(.*?\n\}\n\nprivate fun Double\.f0',
              overlay_block + "\n\nprivate fun Double.f0",
              "Overlay UI replacement",
              flags=re.S,
          )
          path.write_text(text)

          # --- Tests: scale persistence, ranked profile, and hard pass-through guarantees.
          path = Path("app/src/test/java/app/arbor/chat/ui/PerformanceOverlayTest.kt")
          text = path.read_text()
          text = replace_once(
              text,
              """        assertEquals(0f, defaults.copy(performanceOverlayTextOpacity = -1f).normalized().performanceOverlayTextOpacity)
              }""",
              """        assertEquals(0f, defaults.copy(performanceOverlayTextOpacity = -1f).normalized().performanceOverlayTextOpacity)
              assertEquals(0.60f, defaults.copy(performanceOverlayScale = 0.1f).normalized().performanceOverlayScale)
              assertEquals(2.00f, defaults.copy(performanceOverlayScale = 5f).normalized().performanceOverlayScale)
              }""",
              "Scale normalization test",
          )
          text = replace_once(
              text,
              """        assertTrue(settingsSource.contains("Panel opacity"))
              assertTrue(settingsSource.contains("click-through"))""",
              """        assertTrue(settingsSource.contains("Panel opacity"))
              assertTrue(settingsSource.contains("Overlay scale"))
              assertTrue(settingsSource.contains("shares pointer input"))""",
              "Settings scale wiring test",
          )
          text = replace_once(
              text,
              """        assertTrue(overlay.contains("FrameMetrics.LAYOUT_MEASURE_DURATION"))
              assertTrue(overlay.contains("Likely:"))""",
              """        assertTrue(overlay.contains("FrameMetrics.LAYOUT_MEASURE_DURATION"))
              assertTrue(overlay.contains("PerformanceCauseProfile"))
              assertTrue(overlay.contains("profile.confidencePercent"))""",
              "Cause profile source test",
          )
          text = replace_once(
              text,
              """        assertTrue(function.contains("backgroundOpacity"))
              assertTrue(function.contains("textOpacity"))
              assertTrue(!function.contains(".clickable("))
              assertTrue(!function.contains(".pointerInput("))""",
              """        assertTrue(function.contains("backgroundOpacity"))
              assertTrue(function.contains("textOpacity"))
              assertTrue(function.contains("scale: Float"))
              assertTrue(function.contains("sharePointerInputWithSiblings(): Boolean = true"))
              assertTrue(function.contains("onPointerEvent("))
              assertTrue(!function.contains(".clickable("))
              assertTrue(!function.contains(".pointerInput("))
              assertTrue(!function.contains(".consume("))""",
              "Touch-through source test",
          )
          extra_test = """

              @Test
              fun causeProfileIncludesConfidenceSeverityAndEvidence() {
                  val profile = analyzePerformanceCause(
                      PerformanceCauseInput(
                          refreshRateHz = 120f, fps = 55.0, frameTotalMs = 17.0,
                          frameDurationP95Ms = 20.0, jankPercent = 10.0, gpuMs = 2.0,
                          inputMs = 0.2, animationMs = 0.2, layoutMs = 9.0, drawMs = 2.0,
                          syncMs = 0.3, commandMs = 1.0, swapMs = 0.5, blurCpuMs = 0.2,
                          blurFrames = 20, blurSourceDrawsPerFrame = 1.0,
                          appRecompositionsPerSecond = 10.0, chatRecompositionsPerSecond = 10.0,
                          allocationMbPerSecond = 2.0, blockingGcPerSecond = 0.0,
                      ),
                  )
                  assertEquals("Layout / measure", profile.primaryCause)
                  assertTrue(profile.confidencePercent in 40..99)
                  assertTrue(profile.severity != PerformanceSeverity.HEALTHY)
                  assertTrue(profile.evidence.contains("frame budget"))
              }
          """
          text = regex_replace_once(
              text,
              r'\n}\s*$',
              extra_test + "\n}\n",
              "Cause profile behavior test",
              flags=re.S,
          )
          path.write_text(text)

          # --- Version and release documentation.
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          text = replace_once(
              text,
              """        versionCode = 136
                  versionName = "0.20.10"
              """,
              """        versionCode = 137
                  versionName = "0.20.11"
              """,
              "Version bump",
          )
          path.write_text(text)

          path = Path("README.md")
          text = path.read_text()
          text = replace_once(text, "Current version: **0.20.10**", "Current version: **0.20.11**", "README version")
          text = replace_once(text, "Arbor-0.20.10-release.apk", "Arbor-0.20.11-release.apk", "README APK")
          text = replace_once(
              text,
              "docs/releases/RELEASE_NOTES_0.20.10.md",
              "docs/releases/RELEASE_NOTES_0.20.11.md",
              "README release notes",
          )
          path.write_text(text)

          path = Path("CHANGELOG.md")
          text = path.read_text()
          entry = """## 0.20.11 — 2026-07-30

          - Add a 60–200% scale control for the performance overlay.
          - Replace the single “Likely” label with a ranked cause profile containing primary and secondary causes, confidence, severity, and measured evidence.
          - Make the overlay explicitly share pointer input with the UI underneath while consuming nothing, so scrolling and taps work through it.

          """
          marker = "# Changelog\n\n"
          if marker not in text:
              raise SystemExit("CHANGELOG marker missing")
          text = text.replace(marker, marker + entry, 1)
          path.write_text(text)

          Path("docs/releases/RELEASE_NOTES_0.20.11.md").write_text("""# Arbor 0.20.11

          ## Performance overlay

          - Added an **Overlay scale** slider from 60% to 200%.
          - Replaced the vague single “Likely” diagnosis with a ranked cause profile:
            - primary cause
            - optional secondary cause
            - confidence percentage
            - severity
            - concrete evidence from the sampled interval
          - Added explicit sibling pointer sharing without consuming pointer changes. Scroll, tap, drawer-edge, and stylus input can begin directly over the overlay and continue to the content underneath.

          ## Compatibility

          - Developer settings remain available in the optimized release build.
          - Existing chats, credentials, providers, OAuth sessions, workspaces, Linux environments, and app data remain compatible.
          """)
          PY

      - name: Verify transformed source
        shell: bash
        run: |
          grep -q 'versionName = "0.20.11"' app/build.gradle.kts
          grep -q 'performanceOverlayScale' app/src/main/java/app/arbor/chat/settings/AppPreferences.kt
          grep -q 'Overlay scale' app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt
          grep -q 'sharePointerInputWithSiblings(): Boolean = true' app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt
          grep -q 'PerformanceCauseProfile' app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt
          ! grep -q 'Likely:' app/src/main/java/app/arbor/chat/ui/PerformanceOverlay.kt

      - name: Run focused validation
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleRelease

      - name: Commit source-only result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-performance-overlay-upgrade.yml
          git add app README.md CHANGELOG.md docs/releases/RELEASE_NOTES_0.20.11.md
          git commit -m "Upgrade performance overlay profiling and touch-through UX"
          git push origin HEAD:agent/performance-overlay-profile-scale
