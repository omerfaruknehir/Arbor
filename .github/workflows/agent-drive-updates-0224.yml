name: Verify Arbor 0.22.4 Drive and repository updates

on:
  push:
    branches:
      - release/drive-updates-0.22.4
  workflow_dispatch:

permissions:
  contents: write

env:
  ARBOR_SOURCE_REPOSITORY: ${{ github.repository }}
  ARBOR_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/drive-updates-0.22.4
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply integrated release patch
        run: |
          python3 tools/apply-drive-updates-0224.py
          python3 tools/fix-drive-updates-0224.py
          python3 tools/fix-drive-updates-0224-gradle.py
          python3 tools/fix-drive-updates-0224-signatures.py
          python3 tools/fix-drive-updates-0224-api.py

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk"

      - name: Commit verified release changes
        shell: bash
        run: |
          git rm .github/workflows/agent-drive-updates-0224.yml tools/apply-drive-updates-0224.py tools/fix-drive-updates-0224.py tools/fix-drive-updates-0224-gradle.py tools/fix-drive-updates-0224-signatures.py tools/fix-drive-updates-0224-api.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .github/workflows/release.yml docs
          git commit -m 'Fix Drive registration diagnostics and add repository updates in Arbor 0.22.4'
          git push origin HEAD:release/drive-updates-0.22.4
