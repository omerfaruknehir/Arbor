name: Prepare Xylune 0.24.5

on:
  push:
    branches:
      - release/0.24.5-thinking-update-check

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.24.5-thinking-update-check
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply release patch
        run: python3 .github/patch-release-0.24.5.py

      - name: Run focused unit tests
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          testReleaseUnitTest
          --tests app.xylune.chat.provider.NativeProviderProtocolTest
          --tests app.xylune.chat.ui.RepositoryUpdateIntegrationTest

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch-release-0.24.5.py .github/workflows/patch-release-0.24.5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prepare Xylune 0.24.5"
          git push origin HEAD:release/0.24.5-thinking-update-check
