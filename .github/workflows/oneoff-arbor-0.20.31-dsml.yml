name: One-off Arbor 0.20.31 DSML repair

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/oneoff-arbor-0.20.31-dsml.yml

permissions:
  contents: write

jobs:
  verify-release-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android 16 SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare 0.20.31 release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old = '        versionCode = 156\n        versionName = "0.20.30"'
          new = '        versionCode = 157\n        versionName = "0.20.31"'
          if old not in text:
              raise SystemExit('Expected Arbor 0.20.30 version block was not found')
          build.write_text(text.replace(old, new, 1))

          notes = [
              '# Arbor 0.20.31',
              '',
              '- Recognizes the double-pipe DSML tool-call form emitted by DeepSeek V4-compatible endpoints, including `<||DSML||...>` markers.',
              '- Accepts gateway-formatted DSML markers with whitespace and either ASCII or full-width pipe characters without exposing protocol text in chat.',
              '- Keeps split streaming markers buffered until the complete native tool request is available, then routes it through Arbor\'s normal validation and execution path.',
              '- Adds regression coverage using the exact `compile_widget` marker shape observed on-device.',
          ]
          Path('docs/releases/RELEASE_NOTES_0.20.31.md').write_text('\n'.join(notes) + '\n')
          PY

      - name: Verify third-party licenses
        run: ./ci/verify-third-party-licenses.sh

      - name: Run release unit tests
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process testReleaseUnitTest

      - name: Run release lint
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process lintRelease

      - name: Build optimized release APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      - name: Commit verified release
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-arbor-0.20.31-dsml.yml
          git config user.name "Arbor Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix DeepSeek V4 double-pipe DSML tool calls

          Release Arbor 0.20.31 with robust DSML fence parsing so compile_widget calls are hidden, validated, executed, and allowed to continue the tool loop."
          git push origin HEAD:main
