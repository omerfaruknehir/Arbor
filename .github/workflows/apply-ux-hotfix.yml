name: Apply UX hotfix

on:
  push:
    branches: [ agent/ux-empty-response-hotfix ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == '' || github.head_ref == 'agent/ux-empty-response-hotfix'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Apply source changes
        run: |
          base64 --decode ci/apply_ux_hotfix.py.gz.b64 | gzip --decompress > ci/apply_ux_hotfix.py
          python3 ci/apply_ux_hotfix.py
      - name: Commit generated hotfix
        run: |
          rm -f ci/apply_ux_hotfix.py ci/apply_ux_hotfix.py.gz.b64 .github/workflows/apply-ux-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify active response UX and retry empty generations"
          git push origin HEAD:${TARGET_BRANCH}
