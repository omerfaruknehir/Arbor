name: Apply UX hotfix

on:
  push:
    branches: [ agent/ux-empty-response-hotfix ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply source changes
        run: |
          base64 --decode ci/apply_ux_hotfix.py.gz.b64 | gzip --decompress > ci/apply_ux_hotfix.py
          python3 ci/apply_ux_hotfix.py
      - name: Commit generated hotfix
        run: |
          rm -f ci/apply_ux_hotfix.py ci/apply_ux_hotfix.py.gz.b64 .github/workflows/apply-ux-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify active response UX and retry empty generations"
          git push origin HEAD:${{ github.ref_name }}
