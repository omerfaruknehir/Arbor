name: Apply Arbor 0.20.21 setup viewport fixes

on:
  push:
    branches:
      - agent/fix-setup-viewport-0.20.21

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          cat .github/patches/setup-02021/part-*.patch > /tmp/arbor-0.20.21.patch
          git apply --check /tmp/arbor-0.20.21.patch
          git apply /tmp/arbor-0.20.21.patch
          git diff --check

      - name: Validate setup contracts
        shell: bash
        run: |
          ./ci/verify-third-party-licenses.sh
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path('app/src/main').rglob('*.xml'):
              ET.parse(path)

          checks = {
              'app/build.gradle.kts': ['versionCode = 147', 'versionName = "0.20.21"'],
              'app/src/main/java/app/arbor/chat/settings/PersistentUiStateStore.kt': [
                  'setupPageOffsetFraction', 'KEY_SETUP_PAGE_OFFSET', 'setup_scroll.', 'saveSetupScroll',
              ],
              'app/src/main/java/app/arbor/chat/ui/ChatViewModel.kt': [
                  'setupPageOffsetFraction', 'latestSetupScrollOffsets',
                  'saveSetupScroll(stepIndex, offset, immediate = true)', 'updateSetupPagerPosition',
              ],
              'app/src/main/java/app/arbor/chat/ui/OnboardingScreen.kt': [
                  'pagerState.currentPage to pagerState.currentPageOffsetFraction',
                  'scrollToPage(initialPage, initialOffset)',
                  'verticalScroll(pageScrollStates[page])',
                  'setupProgressForSegment(pagePosition, index)',
                  'snapshotFlow { scrollState.value }',
              ],
              'app/src/main/java/app/arbor/chat/ui/ArborApp.kt': [
                  'stepOffsetFraction = setupPageOffsetFraction',
                  'onPagerPositionChanged = viewModel::updateSetupPagerPosition',
                  'onStepScrollChanged = viewModel::saveSetupScrollOffset',
              ],
          }
          for name, needles in checks.items():
              text = Path(name).read_text()
              for needle in needles:
                  assert needle in text, f'{name}: missing {needle}'

          settings = Path('app/src/main/java/app/arbor/chat/ui/SettingsScreen.kt').read_text()
          assert 'Setup assistant' not in settings
          assert 'onStartSetup' not in settings
          print('Validated standalone setup, viewport restore, and continuous progress contracts')
          PY

      - name: Commit clean implementation
        shell: bash
        run: |
          rm -rf .github/patches/setup-02021
          rm -f .github/workflows/apply-setup-02021.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix setup viewport restoration and swipe progress"
          git push
